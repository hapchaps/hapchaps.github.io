// A big portfolio would shove the Call Log a mile down the page. Instead the property list
// scrolls inside its panel, and the panel is sized so its bottom lines up with the bottom of
// the left column (the end of Companies), which puts Call Log right underneath both.
let cpropsExpanded = false;
function fitContactProps(){
  const list = document.getElementById('cprops-list');
  const panel = document.getElementById('cprops-panel');
  if(!list || !panel || !document.getElementById('cprops-toggle')) return;
  list.style.maxHeight = ''; list.style.overflowY = '';
  if(cpropsExpanded) return;
  const left = panel.parentElement.parentElement.firstElementChild;
  const leftBottom = left.lastElementChild.getBoundingClientRect().bottom;
  const lr = list.getBoundingClientRect(), pr = panel.getBoundingClientRect();
  const below = pr.bottom - lr.bottom;                       // panel padding under the list
  let avail = window.innerWidth <= 860 ? window.innerHeight * 0.6 : leftBottom - lr.top - below;
  avail = Math.max(avail, 260);
  if(lr.height > avail){ list.style.maxHeight = avail + 'px'; list.style.overflowY = 'auto'; }
}
function toggleContactProps(){
  cpropsExpanded = !cpropsExpanded;
  document.getElementById('cprops-toggle').textContent = cpropsExpanded ? 'fit to column' : 'show all';
  fitContactProps();
}
window.addEventListener('resize', () => { try { fitContactProps(); } catch(e){} });

// Size and age chips beside the acuity chip on owner and contact property cards, so they
// are the first thing read on a call. Size: units, else SNF certified beds, else RCFE
// licensed capacity, else total beds. Age: NIC MAP open month/year when we have it, else
// year built. NIC MAP stamps January on most records whose real month is unknown, so a
// 1/ month is shown as the year alone rather than a made-up "Jan".
function propSizeLabel(p){
  return p.total_units ? num(p.total_units) + ' units'
    : p.certified_beds ? num(p.certified_beds) + ' beds'
    : p.rcfe_capacity ? num(p.rcfe_capacity) + ' beds'
    : p.total_beds ? num(p.total_beds) + ' beds' : '';
}
function propBuiltLabel(p){
  const m = /^(\d{1,2})\/(\d{4})$/.exec(p.month_opened || '');
  if(m && +m[1] > 1 && +m[1] <= 12){
    const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[1]-1];
    return 'built ' + mon + ' ' + m[2];
  }
  const yr = m ? m[2] : p.year_built;
  return yr ? 'built ' + esc(yr) : '';
}

// TLO link for a databased row: owner LLC -> Businesses search; person/no-LLC -> Properties by address.
function tloLinkFor(r){
  if(r.owner && !r.owner_is_person){
    const q = (r.tlo_dead_end && r.tlo_left_off) ? r.tlo_left_off : r.owner;
    const u = 'https://tloxp.tlo.com/search.php?type=BusinessComboSearch&action=search&BusinessName=' + encodeURIComponent(q);
    return `<a class="tlolink" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">&#128269; owner</a>`;
  }
  if(r.primary_address){
    const u = tloPropertyUrl(r.primary_address, r.zip);
    return `<a class="tlolink" href="${u}" target="_blank" rel="noopener" onclick="event.stopPropagation()">&#128269; property</a>`;
  }
  return '';
}

// "Recently Databased" call list: properties most recently run through TLO, newest first.
// Optional state filter (chips, mirroring Owner Targets) narrows to one state; the list
// stays newest-first within that state so the "fresh call list" ordering is preserved.
// Paginated 40 at a time -- each row costs the server 1-2 extra owner-lookup queries, so
// fetching hundreds at once (e.g. all of CA) was the slow load Hap hit switching states.
let dbCurState = '', dbSort = '', dbDir = 'desc', dbLast = null;
function setDatabasedPage(off){
  const p = new URLSearchParams();
  if(dbCurState) p.set('state', dbCurState);
  if(dbSort){ p.set('sort', dbSort); p.set('dir', dbDir); }
  if(off) p.set('offset', off);
  location.hash = 'databased' + (p.toString()?('?'+p.toString()):'');
}
function setDatabasedSort(col, defDir){
  const dir = dbSort===col ? (dbDir==='desc'?'asc':'desc') : defDir;
  const p = new URLSearchParams();
  if(dbCurState) p.set('state', dbCurState);
  p.set('sort', col); p.set('dir', dir);
  location.hash = 'databased' + (p.toString()?('?'+p.toString()):'');
}

// Page cache + background prefetch: each page still costs the server 1-2 extra owner-lookup
// queries per row, but once a (state, offset) page has been fetched -- including via a quiet
// background prefetch of the page you'll probably hit next -- revisiting it is instant.
const dbPageCache = new Map();
function dbCacheKey(state, sort, dir, offset){ return (state||'') + '|' + (sort||'') + '|' + (dir||'') + '|' + (offset||0); }
async function fetchDatabasedPage(state, sort, dir, offset){
  const key = dbCacheKey(state, sort, dir, offset);
  if(dbPageCache.has(key)) return dbPageCache.get(key);
  const qp = new URLSearchParams();
  if(state) qp.set('state', state);
  if(sort) qp.set('sort', sort);
  if(sort && dir) qp.set('dir', dir);
  if(offset) qp.set('offset', offset);
  const d = await getJSON('/api/databased' + (qp.toString()?('?'+qp.toString()):''));
  dbPageCache.set(key, d);
  return d;
}

async function renderDatabased(state, sort, dir, offset){
  const dbState = state || '';
  dbCurState = dbState; dbSort = sort || ''; dbDir = dir || 'desc';
  const dbOffset = offset || 0;
  const cacheKey = dbCacheKey(dbState, dbSort, dbDir, dbOffset);
  if(!dbPageCache.has(cacheKey)){
    app.innerHTML = '<div class="spinner">Loading recently databased...</div>';
  }
  dbLast = await fetchDatabasedPage(dbState, dbSort, dbDir, dbOffset);
  paintDatabased();
}

// Repaint from the page already in memory -- no refetch. Split out of renderDatabased so an
// inline note edit can update one cell and repaint without a spinner, the same way
// paintTargets / paintDevelopments do for the other two rosters.
function paintDatabased(){
  const d = dbLast;
  if(!d) return;
  const dbState = dbCurState;
  const rows = (d && d.databased) || [];
  const states = (d && d.states) || [];
  const allTotal = states.reduce((s,x)=>s+x.count,0);
  const filTotal = d.total || 0;
  const limit = d.limit || 40;
  const curOffset = d.offset || 0;

  let head = `<div class="cl-head"><h1>&#128209; Recently Databased</h1></div>
    <div class="cl-sub">Everything recently run through TLO, newest first. This is the raw feed, not filtered:
    it includes portfolio/institutional owners (badged below) and dead ends. For the vetted, ready-to-call
    list with those stripped out, see <a onclick="location.hash=TARGETS_HOME" style="cursor:pointer">Owner Targets</a>.
    Click a property to open it, or the TLO link to dig for phones.
    <b>${allTotal}</b> databased${dbState?` &middot; <b>${esc(dbState)}</b> (${filTotal})`:''}.</div>`;

  const dbHash = st => {
    const p = new URLSearchParams();
    if(st) p.set('state', st);
    if(dbSort){ p.set('sort', dbSort); p.set('dir', dbDir); }
    return 'databased' + (p.toString()?('?'+p.toString()):'');
  };
  head += `<div class="cl-cats"><span class="lbl">State:</span>`;
  head += `<span class="catchip ${dbState?'':'active'}" onclick="location.hash='${dbHash('')}'">All<span class="ct">${allTotal}</span></span>`;
  for(const s of states){
    head += `<span class="catchip ${dbState===s.state?'active':''}" onclick="location.hash='${dbHash(s.state)}'">${esc(s.state||'?')}<span class="ct">${s.count}</span></span>`;
  }
  head += `</div>`;

  if(!rows.length){
    app.innerHTML = head + '<div class="empty-msg">Nothing databased yet &mdash; run TLO owner searches to populate.</div>';
    window.scrollTo(0,0); return;
  }

  const hasPrev = curOffset > 0;
  const hasNext = curOffset + rows.length < filTotal;
  const pager = `<div style="display:flex;align-items:center;gap:10px;margin:10px 2px">
    <span class="muted" style="font-size:13px">Showing ${curOffset+1}&ndash;${curOffset+rows.length} of ${filTotal}</span>
    <span class="navlink" style="padding:5px 11px;font-size:13px;${hasPrev?'cursor:pointer':'opacity:.35;pointer-events:none'}" onclick="setDatabasedPage(${Math.max(0,curOffset-limit)})">&larr; Prev</span>
    <span class="navlink" style="padding:5px 11px;font-size:13px;${hasNext?'cursor:pointer':'opacity:.35;pointer-events:none'}" onclick="setDatabasedPage(${curOffset+limit})">Next &rarr;</span>
  </div>`;

  const gf = 'setDatabasedSort';
  let html = head + pager + `<div class="panel" style="margin-top:0"><table class="cl"><thead><tr>
    ${rosterTh(dbSort, dbDir, 'databased', 'Databased', gf, 'desc')}
    ${rosterTh(dbSort, dbDir, 'name', 'Property', gf)}
    ${rosterTh(dbSort, dbDir, 'city', 'City', gf)}
    ${rosterTh(dbSort, dbDir, 'state', 'ST', gf)}
    <th>Type</th>
    ${rosterTh(dbSort, dbDir, 'size', 'Size', gf, 'desc')}
    ${rosterTh(dbSort, dbDir, 'built', 'Built', gf, 'desc')}
    <th>Owner found</th><th>Mailing / phone</th><th>TLO</th>
    <th>Last Contact</th><th>Notes</th>
  </tr></thead><tbody>`;
  for(const r of rows){
    // badge portfolio/institutional owners and TLO dead ends -- these are exactly what
    // Owner Targets filters out, so they're not really callable prospects
    let ownerBadges = '';
    if(r.portfolio) ownerBadges += ` <span class="chip portfolio" title="Known portfolio/institutional owner, excluded from Owner Targets">${esc(r.portfolio)}</span>`;
    if(r.tlo_dead_end) ownerBadges += ` <span class="chip deadend" title="TLO dead end, no reachable human found">dead end</span>`;
    const owner = r.owner ? ownerLink(r) + ownerBadges + cmsChip(r) : '<span class="muted">(none found)</span>';
    const contact = [r.owner_mailing?esc(r.owner_mailing):'', r.owner_phone?('<a href="tel:'+esc(r.owner_phone)+'">'+esc(r.owner_phone)+'</a>'+facTag(r.owner_phone)):''].filter(Boolean).join(' &middot; ');
    const size = r.total_units ? num(r.total_units)+' units' : (r.certified_beds ? num(r.certified_beds)+' beds' : '<span class="empty">-</span>');
    const type = `<span class="chip ${esc(r.asset_class||'')}" title="${esc(r.asset_label||'')}">${esc(ASSET_SHORT[r.asset_class]||r.asset_class||'?')}</span>`;
    const built = r.year_built ? esc(r.year_built) : '<span class="empty">-</span>';
    html += `<tr>
      <td style="white-space:nowrap">${esc(r.databased_at||'')}</td>
      <td><a onclick="location.hash='property/${esc(r.id)}'" style="cursor:pointer">${esc(r.name||'')}</a></td>
      <td>${esc(r.city||'')}</td><td>${esc(r.state||'')}</td>
      <td style="white-space:nowrap">${type}</td>
      <td style="white-space:nowrap">${size}</td>
      <td>${built}</td>
      <td>${owner}</td><td>${contact}</td><td>${tloLinkFor(r)}</td>
      <td style="white-space:nowrap">${touchChip('property', r.id, r.is_dnc ? 'DNC' : r.last_contact, 'touchRefreshDatabased', hotOwnerTarget(r))}</td>
      <td style="min-width:240px;max-width:380px">${noteCell(r, 'property', r.id)}</td>
    </tr>`;
  }
  html += `</tbody></table></div>` + pager;
  app.innerHTML = html;
  window.scrollTo(0,0);

  // Quietly warm the cache for wherever Prev/Next would take you next, so the click itself
  // is instant instead of waiting on a fresh round of owner lookups.
  if(hasNext) fetchDatabasedPage(dbState, dbSort, dbDir, curOffset + limit).catch(()=>{});
  if(hasPrev) fetchDatabasedPage(dbState, dbSort, dbDir, Math.max(0, curOffset - limit)).catch(()=>{});
}

// Owner Targets: curated single/few-owner call targets (no REIT/portfolio, no institutional
// dead-ends), organized by state then major metro/MSA. Smaller non-MSA towns fall into "Other <ST>".
// State/metro are both server-side filters now (api_targets caches its expensive full-set
// computation, so filtering and paging are cheap); results are paginated 40 at a time with
// the same page-cache + background-prefetch pattern as Recently Databased.
// Display names for the SoCal/NorCal keys used in URLs and the API. Overwritten from
// whatever the server sends (region_labels) so app.py stays the one place they are named.
let REGION_LABELS = {SoCal: 'Southern CA', NorCal: 'Northern CA'};
// Where "Owner Targets" lands: Southern CA, all metros, SMALLEST first -- opened on page
// TWO. Hap works SoCal hardest, and small callable owners beat the institutions at the far
// end of the list, but he is currently hunting a notch above the very smallest, so the
// landing page skips the first 40 (page 2 of Southern CA opens just under 50 units). Prev
// still walks back to the 30s, and every chip resets to page 1 of whatever it selects.
const TARGETS_HOME = 'targets?state=CA&region=SoCal&sort=size&dir=asc&offset=40';
function regionLabel(r){ return REGION_LABELS[r] || r; }

let targetsLast = null, targetsState = '', targetsMetro = '', targetsRegion = '', targetsSort = '', targetsDir = 'asc';
const targetsPageCache = new Map();
function targetsCacheKey(state, metro, region, sort, dir, offset){
  return (state||'')+'|'+(metro||'')+'|'+(region||'')+'|'+(sort||'')+'|'+(dir||'')+'|'+(offset||0);
}
async function fetchTargetsPage(state, metro, region, sort, dir, offset){
  const key = targetsCacheKey(state, metro, region, sort, dir, offset);
  if(targetsPageCache.has(key)) return targetsPageCache.get(key);
  const qp = new URLSearchParams();
  if(state) qp.set('state', state);
  if(metro) qp.set('metro', metro);
  if(region) qp.set('region', region);
  if(sort) qp.set('sort', sort);
  if(sort && dir) qp.set('dir', dir);
  if(offset) qp.set('offset', offset);
  const d = await getJSON('/api/targets' + (qp.toString()?('?'+qp.toString()):''));
  targetsPageCache.set(key, d);
  return d;
}
function setTargetsPage(off){
  const p = new URLSearchParams();
  if(targetsState) p.set('state', targetsState);
  if(targetsMetro) p.set('metro', targetsMetro);
  if(targetsRegion) p.set('region', targetsRegion);
  if(targetsSort){ p.set('sort', targetsSort); p.set('dir', targetsDir); }
  if(off) p.set('offset', off);
  location.hash = 'targets' + (p.toString()?('?'+p.toString()):'');
}
function setTargetsMetro(m){
  const newMetro = (targetsMetro===m ? '' : m);
  const p = new URLSearchParams();
  if(targetsState) p.set('state', targetsState);
  if(newMetro) p.set('metro', newMetro);
  // Metro is a further narrowing WITHIN the current region (the chip row only ever offers
  // metros belonging to it), so keep the region rather than resetting to the whole state.
  if(targetsRegion) p.set('region', targetsRegion);
  if(targetsSort){ p.set('sort', targetsSort); p.set('dir', targetsDir); }
  location.hash = 'targets' + (p.toString()?('?'+p.toString()):'');
}
// California is offered as its two halves rather than as one chip -- Hap's callable
// territory is all of AZ and CO but only Santa Barbara County and south, so "Southern CA"
// is a top-level destination, not a second click. Picking one drops any metro filter.
function setTargetsStateRegion(st, r){
  const p = new URLSearchParams();
  if(st) p.set('state', st);
  if(r) p.set('region', r);
  if(targetsSort){ p.set('sort', targetsSort); p.set('dir', targetsDir); }
  location.hash = 'targets' + (p.toString()?('?'+p.toString()):'');
}
// A sort replaces the default metro GROUPING with one flat order, but it must not touch
// what you are looking at: sorting Southern CA by size means the biggest in Southern CA,
// so territory and metro both ride along. (They used to be dropped here, which bounced you
// back to All the moment you clicked a column header.)
function setTargetsSort(col, defDir){
  const dir = targetsSort===col ? (targetsDir==='desc'?'asc':'desc') : defDir;
  const p = new URLSearchParams();
  if(targetsState) p.set('state', targetsState);
  if(targetsRegion) p.set('region', targetsRegion);
  if(targetsMetro) p.set('metro', targetsMetro);
  p.set('sort', col); p.set('dir', dir);
  location.hash = 'targets' + (p.toString()?('?'+p.toString()):'');
}
async function renderTargets(state, metro, region, sort, dir, offset){
  targetsState = state || ''; targetsMetro = metro || ''; targetsRegion = region || '';
  targetsSort = sort || ''; targetsDir = dir || 'asc';
  const curOff = offset || 0;
  const cacheKey = targetsCacheKey(targetsState, targetsMetro, targetsRegion, targetsSort, targetsDir, curOff);
  if(!targetsPageCache.has(cacheKey)){
    app.innerHTML = '<div class="spinner">Loading owner targets...</div>';
  }
  targetsLast = await fetchTargetsPage(targetsState, targetsMetro, targetsRegion, targetsSort, targetsDir, curOff);
  if(targetsLast.region_labels) REGION_LABELS = targetsLast.region_labels;
  paintTargets();
  // warm the cache for wherever Prev/Next would take you next
  const limit = targetsLast.limit || 40;
  const curOffset = targetsLast.offset || 0;
  const rows = targetsLast.targets || [];
  const filTotal = targetsLast.count || 0;
  if(curOffset + rows.length < filTotal)
    fetchTargetsPage(targetsState, targetsMetro, targetsRegion, targetsSort, targetsDir, curOffset + limit).catch(()=>{});
  if(curOffset > 0)
    fetchTargetsPage(targetsState, targetsMetro, targetsRegion, targetsSort, targetsDir, Math.max(0, curOffset - limit)).catch(()=>{});
}
function paintTargets(){
  const d = targetsLast || {};
  const rows = d.targets || [];
  const states = d.states || [];
  const metros = d.metros || [];
  const total = d.total || 0;
  const filTotal = d.count || 0;
  const limit = d.limit || 40;
  const curOffset = d.offset || 0;

  let head = `<div class="cl-head"><h1>&#127919; Owner Call Targets</h1>
    ${filTotal?`<a class="navlink" style="padding:5px 11px;font-size:13px" onclick="exportTargetsCSV()">Download CSV</a>`:''}
  </div>
  <div class="cl-sub">Single/few-owner targets you can call &mdash; LLCs, partnerships, family trusts &amp; individuals.
    Known REITs/operator portfolios and institutional dead-ends are excluded.
    <b>${total}</b> target${total===1?'':'s'} in ${states.length} state${states.length===1?'':'s'}${targetsState?` &middot; <b>${esc(targetsRegion?regionLabel(targetsRegion):targetsState)}</b> (${filTotal})`:''}${targetsMetro?` &middot; <b>${esc(targetsMetro)}</b>`:''}.</div>`;

  // Territory chips (server filter). A state that is split into regions (California, into
  // Southern/Northern) shows one chip per half instead of one chip for the whole state --
  // Hap calls on all of AZ and CO but only the bottom half of CA, so the half he works is
  // a top-level choice, not a second click. "All" still spans everything.
  const allRegions = d.regions || [];
  head += `<div class="cl-cats"><span class="lbl">Territory:</span>`;
  head += `<span class="catchip ${targetsState?'':'active'}" onclick="location.hash='targets'">All<span class="ct">${total}</span></span>`;
  for(const s of states){
    const regs = allRegions.filter(r => r.state===s.state);
    if(regs.length > 1){
      for(const r of regs){
        const on = (targetsState===s.state && targetsRegion===r.region);
        head += `<span class="catchip ${on?'active':''}" onclick="setTargetsStateRegion('${s.state}','${r.region}')">${esc(regionLabel(r.region))}<span class="ct">${r.count}</span></span>`;
      }
      // Safety valve: every CA target has a county today, so the two halves add up to the
      // state. If a row ever lands with no county AND an unrecognized metro it would have
      // no region and be reachable only from All -- so give the whole state its own chip
      // back the moment the halves stop summing.
      const regSum = regs.reduce((n, r) => n + r.count, 0);
      if(regSum < s.count){
        head += `<span class="catchip ${targetsState===s.state && !targetsRegion?'active':''}" onclick="setTargetsStateRegion('${s.state}','')">All ${esc(s.state)}<span class="ct">${s.count}</span></span>`;
      }
    } else {
      head += `<span class="catchip ${targetsState===s.state?'active':''}" onclick="setTargetsStateRegion('${s.state}','')">${esc(s.state||'?')}<span class="ct">${s.count}</span></span>`;
    }
  }
  head += `</div>`;

  // metro chips (server filter) once a single territory is focused. The server already
  // narrows this list to the selected state+region, so a CA half only ever offers its own
  // metros -- county-based regions cut across the metro buckets ("Other CA" holds towns
  // from both halves), which is why this can no longer be filtered client-side.
  if(targetsState){
    const ms = metros.filter(m => m.state===targetsState);
    if(ms.length > 1){
      const scopeTotal = targetsRegion
        ? (allRegions.find(r=>r.state===targetsState && r.region===targetsRegion)||{}).count || 0
        : (states.find(s=>s.state===targetsState)||{}).count || 0;
      head += `<div class="cl-cats"><span class="lbl">Metro:</span>`;
      head += `<span class="catchip ${targetsMetro?'':'active'}" onclick="setTargetsMetro('')">All metros<span class="ct">${scopeTotal}</span></span>`;
      for(const m of ms){
        const arg = (m.metro||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        head += `<span class="catchip ${targetsMetro===m.metro?'active':''}" onclick="setTargetsMetro('${arg}')">${esc(m.metro)}<span class="ct">${m.count}</span></span>`;
      }
      head += `</div>`;
    }
  }

  if(!rows.length){
    app.innerHTML = head + `<div class="empty-msg">No owner targets for this filter.</div>`;
    window.scrollTo(0,0); return;
  }

  const pager = pagerHTML(curOffset, rows.length, filTotal, limit, 'setTargetsPage');
  const gf = 'setTargetsSort';
  let html = head + pager + `<div class="panel targets-panel" style="margin-top:0"><table class="cl targets">
    <thead><tr>
      ${rosterTh(targetsSort, targetsDir, 'name', 'Property', gf)}
      ${rosterTh(targetsSort, targetsDir, 'city', 'City', gf)}
      ${rosterTh(targetsSort, targetsDir, 'state', 'ST', gf)}
      <th>Acuity</th>
      ${rosterTh(targetsSort, targetsDir, 'size', 'Size', gf, 'desc')}
      ${rosterTh(targetsSort, targetsDir, 'built', 'Built', gf, 'desc')}
      <th>Owner Type</th>
      ${rosterTh(targetsSort, targetsDir, 'owner', 'Owner', gf)}
      <th>CoStar True Owner</th><th>NIC MAP Owner</th><th>NIC MAP Operator</th><th>Last Contact</th><th>Notes</th>
    </tr></thead><tbody>`;
  let curKey = null;
  for(const r of rows){
    // An active sort renders one flat list -- grouping by metro only makes sense under
    // the default order, and mixing the two would be confusing (a metro header, then rows
    // sorted GLOBALLY that don't stay within it).
    const key = r.state + '|' + r.metro;
    if(!targetsSort && key !== curKey){
      curKey = key;
      const cnt = (metros.find(m => m.state===r.state && m.metro===r.metro)||{}).count || '';
      const label = targetsState ? esc(r.metro) : (esc(r.state)+' &mdash; '+esc(r.metro));
      html += `<tr><td colspan="13" style="background:var(--accent-soft);font-weight:700;letter-spacing:.03em">${label} <span class="muted">(${cnt})</span></td></tr>`;
    }
    const cluster = r.owner_n>1 ? ` <span class="chip status" title="this owner appears on ${r.owner_n} target properties">&#9733; owns ${r.owner_n}</span>` : '';
    // Hand-entered owner (recorded via "+ add owner/operator" rather than a batch TLO grind
    // load) -- same "this is yours, not an imported feed" badge as the property page.
    const addedBadge = r.owner_added_by_ui
      ? `<span class="uichip" title="Entered by you in this UI, outranks the imported feeds">&#9998; yours</span>` : '';
    const otype = r.owner_is_person ? 'Person' : r.owner_via ? 'Company' : (/(TRUST)\b/i.test(r.owner||'')?'Trust':(isEntityName(r.owner||'')?'LLC/LP':'Owner'));
    const owner = r.owner ? ownerLink(r)+cluster+addedBadge+cmsChip(r) : '<span class="muted">(none)</span>';
    const acuity = `<span class="chip ${esc(r.asset_class||'')}" title="${esc(r.asset_label||'')}">${esc(ASSET_SHORT[r.asset_class]||r.asset_class||'?')}</span>`;
    const size = r.total_units ? num(r.total_units)+' units' : (r.certified_beds ? num(r.certified_beds)+' beds' : '<span class="empty">-</span>');
    const built = r.year_built ? esc(r.year_built) : '<span class="empty">-</span>';
    // quick visual cross-reference: flag when the CoStar/NIC MAP true owner name looks like
    // the same entity as the TLO-found owner, so a match/mismatch is obvious at a glance
    let costarOwner = '<span class="empty">-</span>';
    if(r.costar_true_owner){
      const a = r.costar_true_owner.trim().toUpperCase(), b = (r.owner||'').trim().toUpperCase();
      const matches = a && b && (a===b || a.includes(b) || b.includes(a));
      costarOwner = esc(r.costar_true_owner) + (matches ? ` <span class="chip status" title="matches the TLO owner name">&#10003; match</span>` : '');
    }
    let nicOwner = '<span class="empty">-</span>';
    if(r.nicmap_owner){
      const a = r.nicmap_owner.trim().toUpperCase(), b = (r.owner||'').trim().toUpperCase();
      const matches = a && b && (a===b || a.includes(b) || b.includes(a));
      nicOwner = esc(r.nicmap_owner) + (matches ? ` <span class="chip status" title="matches the TLO owner name">&#10003; match</span>` : '');
    }
    const nicOperator = r.nicmap_operator ? esc(r.nicmap_operator) : '<span class="empty">-</span>';
    html += `<tr>
      <td class="t-prop"><a onclick="location.hash='property/${esc(r.id)}'" style="cursor:pointer">${esc(r.name||'')}</a></td>
      <td title="${esc(r.city||'')}" style="max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.city||'')}</td><td>${esc(r.state||'')}</td>
      <td style="white-space:nowrap">${acuity}</td>
      <td style="white-space:nowrap">${size}</td>
      <td>${built}</td>
      <td style="white-space:nowrap">${otype}</td>
      <td class="t-owner">${owner}</td>
      <td class="t-nic">${costarOwner}</td>
      <td class="t-nic">${nicOwner}</td>
      <td class="t-nic">${nicOperator}</td>
      <td style="white-space:nowrap">${touchChip('property', r.id, r.is_dnc ? 'DNC' : r.portfolio_last_contact, 'touchRefreshTargets', hotOwnerTarget(r))}</td>
      <td class="t-notes">${noteCell(r, 'property', r.id)}</td>
    </tr>`;
  }
  html += `</tbody></table></div>` + pager;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

// Export ignores pagination -- refetches the full filtered set (cheap: the expensive part
// is cached server-side) rather than exporting just the 40 rows currently on screen.
async function exportTargetsCSV(){
  const qp = new URLSearchParams();
  if(targetsState) qp.set('state', targetsState);
  if(targetsMetro) qp.set('metro', targetsMetro);
  if(targetsRegion) qp.set('region', targetsRegion);
  qp.set('limit', 100000);
  const d = await getJSON('/api/targets' + (qp.toString()?('?'+qp.toString()):''));
  const src = d.targets || [];
  const hdr = ['Property','Address','City','County','State','Region','Metro','Zip','Acuity','Units','Beds','YearBuilt','Owner','OwnerLLC','OwnerType','OwnerFacilities','CostarTrueOwner','Phone','LastContact','LastNote','OwnershipNotes'];
  const rows = [hdr];
  for(const r of src){
    const otype = r.owner_is_person ? 'Person' : r.owner_via ? 'Company' : (/(TRUST)\b/i.test(r.owner||'')?'Trust':(isEntityName(r.owner||'')?'LLC/LP':'Owner'));
    rows.push([r.name, r.primary_address, r.city, r.county, r.state, regionLabel(r.region||''), r.metro, r.zip, r.asset_class, r.total_units, r.certified_beds, r.year_built, r.owner, r.owner_via||'', otype, r.owner_n, r.costar_true_owner, r.owner_phone, (r.is_dnc?'DNC':r.portfolio_last_contact), r.last_note, r.tlo_left_off]);
  }
  const csv = rows.map(r => r.map(v => {
    v = (v==null?'':String(v));
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'owner_targets'+(targetsState?'_'+targetsState:'')+(targetsRegion?'_'+targetsRegion:'')+(targetsMetro?'_'+targetsMetro.replace(/[^A-Za-z0-9]+/g,'_'):'')+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Hot Prospects page ----------
// An OWNER summary, not a property roster. Everywhere else in the app the row is a building;
// here the row is the person or company Hap is working, carrying their buildings, their
// phone numbers and the whole merged call log underneath -- because once a prospect is hot,
// the question stops being "which property" and becomes "what did I say to them last, and
// when". Small list by construction, so it loads whole: no pagination, no page cache.
// Split into the three buckets the flame sorts people into (Needs contact / Keep in touch /
// Hot, BOV worthy), one bucket on screen at a time. Default order is longest-since-contact
// first, so the top of each bucket is always who to call next.
let hotLast = null, hotState = '', hotSort = 'stale', hotDir = '', hotStageTab = 'hot';
const hotOpen = new Set();   // owner rows expanded to their full card; survives refetches
const HOT_SORTS = [
  ['stale', 'Longest since contact'],
  ['added', 'Recently added'],
  ['name', 'Owner name'],
  ['units', 'Size'],
];
function hotHash(over){
  const v = Object.assign({state: hotState, sort: hotSort, dir: hotDir, stage: hotStageTab}, over || {});
  const p = new URLSearchParams();
  if(v.stage !== 'hot') p.set('stage', v.stage || '');   // no param = the Hot/BOV bucket
  if(v.state) p.set('state', v.state);
  if(v.sort && v.sort !== 'stale'){ p.set('sort', v.sort); if(v.dir) p.set('dir', v.dir); }
  else if(v.sort === 'stale' && v.dir && v.dir !== 'asc') p.set('dir', v.dir);
  location.hash = 'hot' + (p.toString() ? ('?' + p.toString()) : '');
}
function setHotSort(col){
  // Clicking the sort you are already on flips it; anything else takes that sort's own
  // sensible default direction (newest-first for dates, coldest-first for staleness).
  hotHash({sort: col, dir: hotSort === col ? (hotDir === 'desc' ? 'asc' : 'desc') : ''});
}
function setHotState(st){ hotHash({state: st}); }
function setHotStageTab(st){ hotHash({stage: st}); }
async function renderHot(state, sort, dir, stage, keepScroll){
  hotState = state || ''; hotSort = sort || 'stale'; hotDir = dir || '';
  hotStageTab = stage == null ? 'hot' : stage;
  if(!hotLast) app.innerHTML = '<div class="spinner">Loading hot prospects...</div>';
  const qp = new URLSearchParams();
  if(hotState) qp.set('state', hotState);
  if(hotSort) qp.set('sort', hotSort);
  if(hotDir) qp.set('dir', hotDir);
  if(hotStageTab) qp.set('stage', hotStageTab);
  const d = await apiJSON('/api/hot' + (qp.toString() ? ('?' + qp.toString()) : ''));
  if(d && d.error){
    hotLast = null;
    app.innerHTML = '<div class="cl-head"><h1>&#128293; Hot Prospects</h1></div>'
      + '<div class="empty-msg">' + esc(d.error) + '</div>';
    return;
  }
  hotLast = d;
  hotDir = hotLast.dir || hotDir;
  paintHot(keepScroll);
}
// A touch/note logged from inside a card can change the card's rollup (its last-contact
// date, the top of its call log), which only the server can recompute -- so unlike the big
// rosters this one refetches. It is a shortlist; the round trip is not felt.
function touchRefreshHot(){ renderHot(hotState, hotSort, hotDir, hotStageTab, true); }
// Move a whole owner row to another bucket (every star filed on it moves together).
async function moveHotGroup(sel){
  const g = (hotLast && hotLast.prospects || []).find(x => x.key === sel.dataset.key);
  if(!g) return;
  const stage = sel.value;
  const d = await apiJSON('/api/hot/stage', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({stage, refs: g.refs})});
  if(!d || d.error){ alert('Could not move it.\n\n' + ((d && d.error) || 'unknown error')); return; }
  for(const r of g.refs) HOT.set(hotKey(r.kind, r.id), stage);
  hotToast('&#128293; ' + esc(g.owner_name || 'Moved') + ' &rarr; ' + esc(HOT_STAGE_SHORT[stage]));
  touchRefreshHot();
}
function toggleHotRow(key){
  if(hotOpen.has(key)) hotOpen.delete(key); else hotOpen.add(key);
  paintHot(true);
}

function hotPhones(c){
  const bits = [];
  if(c.phone_mobile) bits.push('C: <a href="tel:' + esc(c.phone_mobile) + '">' + esc(c.phone_mobile) + '</a>' + facTag(c.phone_mobile));
  if(c.phone_office) bits.push('O: <a href="tel:' + esc(c.phone_office) + '">' + esc(c.phone_office) + '</a>' + facTag(c.phone_office));
  if(c.facility_phone) bits.push((c.facility_phone ? 'F: <a href="tel:'+esc(c.facility_phone)+'">'+esc(c.facility_phone)+'</a> <span class="ph-fac">(facility'+(c.facility_phone_name?': '+esc(c.facility_phone_name):'')+')</span>' : ''));
  if(c.email) bits.push('<a href="mailto:' + esc(c.email) + '">' + esc(c.email) + '</a>');
  return bits.join(' &nbsp;&middot;&nbsp; ');
}

// One merged log entry. Named by what it was logged AGAINST, since on an owner card the
// same feed carries calls to three different people and notes on two buildings.
function hotLogEntry(a){
  const when = a.occurred_at ? fmtTouchDate((a.occurred_at || '').slice(0, 10)) : '';
  const kind = (a.activity_type && a.activity_type !== 'note') ? noteTypeLabel(a.activity_type) : 'Note';
  const via = a.contact_name ? ('contact/' + a.contact_id + '|' + a.contact_name)
    : (a.property_name ? ('property/' + a.property_id + '|' + a.property_name)
    : (a.development_name ? ('development/' + a.development_id + '|' + a.development_name)
    : (a.entity_name ? ('entity/' + a.entity_id + '|' + a.entity_name) : '')));
  let viaHtml = '';
  if(via){
    const [href, label] = [via.slice(0, via.indexOf('|')), via.slice(via.indexOf('|') + 1)];
    viaHtml = ` <span class="lt" onclick="location.hash='${esc(href)}'" style="cursor:pointer">&middot; ${esc(label)}</span>`;
  }
  const also = a.also_count
    ? ` <span class="lt" title="The same note was logged on each of them">&middot; and ${a.also_count} other${a.also_count===1?'':'s'}</span>` : '';
  return `<div class="le"><span class="ld">${esc(when)} &middot; ${esc(kind)}</span>${viaHtml}${also}
    <div>${esc(a.body)}</div></div>`;
}

// "+ Log a call" on the card header: fires the first last-contact chip inside the card, which
// is the primary person if there is one and the first building otherwise -- the popup it
// opens is the same note+date editor used everywhere else, so nothing new to learn.
function hotLogCall(key){
  const card = document.querySelector('.hotcard[data-key="' + key.replace(/"/g, '\\"') + '"]');
  if(!card) return;
  const chip = card.querySelector('.hc-people .touchchip') || card.querySelector('.hc-props .touchchip')
    || card.querySelector('.touchchip');
  if(chip) openTouchPop(chip);
}

function hotReasonEdit(el){
  if(el.querySelector('textarea')) return;
  const cur = el.dataset.reason || '';
  el._prev = el.innerHTML;
  el.innerHTML = `<textarea class="hr-body" rows="2" style="width:100%;box-sizing:border-box;background:var(--bg);
    color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font:inherit;font-size:13px"
    placeholder="Why they're hot / what's next (Ctrl+Enter to save, Esc to cancel)"
    onkeydown="hotReasonKeys(event,this)">${esc(cur)}</textarea>
    <div class="row" style="margin-top:5px"><button class="btn" onclick="hotReasonSave(this)">Save</button>
    <a onclick="hotReasonCancel(this)" style="margin-left:8px">cancel</a></div>`;
  const ta = el.querySelector('textarea');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}
function hotReasonKeys(ev, ta){
  if((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter'){ hotReasonSave(ta); return; }
  if(ev.key === 'Escape'){ ev.stopPropagation(); hotReasonCancel(ta); }
}
function hotReasonCancel(el){
  const w = el.closest('.hc-reason');
  if(w && w._prev != null) w.innerHTML = w._prev;
}
async function hotReasonSave(el){
  const w = el.closest('.hc-reason');
  const reason = w.querySelector('textarea').value.trim();
  const d = await apiJSON('/api/hot/reason', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({kind: w.dataset.rk, id: w.dataset.ri, reason})});
  if(!d || d.error){ alert('Could not save.\n\n' + ((d && d.error) || 'unknown error')); return; }
  w.dataset.reason = reason;
  w.classList.toggle('empty', !reason);
  w.innerHTML = esc(reason) || 'Why are they hot? What&rsquo;s the next step? (click to add)';
  if(hotLast && hotLast.prospects){
    const g = hotLast.prospects.find(x => x.key === w.closest('.hotcard').dataset.key);
    if(g) g.reason = reason || null;
  }
}

    if(!keepScroll) window.scrollTo(0, 0);

  // Compact roster, Owner Targets style: one row per owner, what they own, who to call, when

  html += `</tbody></table></div>`;
  app.innerHTML = html;
  if(!keepScroll) window.scrollTo(0, 0);

function hotLink(g){
  const gk = g.group_kind, gid = g.group_id;
  return g.person_id ? ('contact/' + g.person_id)
    : gk === 'entity' ? ('entity/' + gid)
    : gk === 'contact' ? ('contact/' + gid)
    : gk === 'development' ? ('development/' + gid) : ('property/' + gid);
}

// The full owner card: every building, every person with numbers, and the merged call log.
function hotCardHTML(g){
  let html = '';
  {
    const gk = g.group_kind, gid = g.group_id;
    const dev = g.development || null;
    const link = hotLink(g);
    const chipDate = g.is_dnc ? 'DNC' : (gk === 'entity' ? g.owner_last_contact
      : gk === 'development' ? (dev && dev.last_contact_date) : null);
    // The owner's own chip pins contact at the RELATIONSHIP level (and is the one place an
    // entity can be marked DNC); the per-person and per-building chips below log the calls.
    const ownerChip = touchChip(gk, gid, chipDate, 'touchRefreshHot', {kind: gk, id: gid, label: g.owner_name});

    const props = g.properties || [], contacts = g.contacts || [];
    const stateChips = (g.states || []).map(s => `<span class="chip status">${esc(s)}</span>`).join(' ');
    const sizeBit = g.units ? `<span class="chip">${num(g.units)} units/beds</span>` : '';
    const propBit = g.prop_total ? `<span class="chip">${num(g.prop_total)} propert${g.prop_total===1?'y':'ies'}</span>` : '';
    const ci = g.company_info || {};
    const ciBits = [];
    if(ci.phone) ciBits.push('<a href="tel:' + esc(ci.phone) + '">' + esc(ci.phone) + '</a>' + facTag(ci.phone));
    if(ci.address) ciBits.push(esc(ci.address));
    const lastBit = g.last_contact ? 'last contact ' + esc(fmtTouchDate(g.last_contact)) : 'never contacted';

    html += `<div class="hotcard${g.is_dnc?' dnc':''}" data-key="${esc(g.key)}">
      <div class="hc-head">
        <div class="hc-id">
          <div class="hc-name"><a onclick="location.hash='${esc(link)}'">${esc(g.owner_name||'(unnamed)')}</a>
            ${propBit}${sizeBit}${stateChips}</div>
          <div class="hc-sub">${esc(g.owner_sub||'')} &middot; ${lastBit} &middot; added ${esc(fmtTouchDate(g.added_at)||g.added_at||'')}${ciBits.length?' &middot; '+ciBits.join(' &middot; '):''}</div>
        </div>
        <div class="hc-actions">
          <a class="addlink" onclick="hotLogCall('${esc(g.key)}')">Log a call</a>
          ${ownerChip}
        </div>
      </div>
      <div class="hc-reason${g.reason?'':' empty'}" data-rk="${esc(g.reason_target.kind)}" data-ri="${esc(g.reason_target.id)}"
        data-reason="${esc(g.reason||'')}" title="Click to edit"
        onclick="hotReasonEdit(this)">${g.reason ? esc(g.reason) : 'Why are they hot? What&rsquo;s the next step? (click to add)'}</div>
      <div class="hc-cols">
        <div class="hc-box hc-people"><h4>People to call${g.contact_total?` (${g.contact_total})`:''}</h4>`;
    if(!contacts.length){
      html += `<div class="hc-more">No contacts on file yet.</div>`;
    } else {
      for(const c of contacts){
        const nm = contactName(c);
        html += `<div class="hc-row">
          <div class="l">
            <div class="nm"><a onclick="location.hash='contact/${esc(c.id)}'">${esc(nm)}</a>${c.starred?' <span class="hc-star">&#128293;</span>':''}${c.do_not_contact?' <span class="dnc">DNC</span>':''}</div>
            <div class="ex">${esc(c.title||'')}${c.employer_name&&c.employer_name!==g.owner_name?(c.title?' &middot; ':'')+esc(c.employer_name):''}</div>
            ${hotPhones(c)?`<div class="ph">${hotPhones(c)}</div>`:''}
          </div>
          <div>${touchChip('contact', c.id, c.last_touch_date, 'touchRefreshHot')}</div>
        </div>`;
      }
      if(g.contact_total > contacts.length)
        html += `<div class="hc-more">+ ${g.contact_total - contacts.length} more on the owner page</div>`;
    }
    html += `</div><div class="hc-box hc-props"><h4>Properties${g.prop_total?` (${g.prop_total})`:''}</h4>`;
    if(!props.length && dev){
      html += `<div class="hc-row"><div class="l">
        <div class="nm"><a onclick="location.hash='development/${esc(dev.id)}'">${esc(dev.project_name||'')}</a></div>
        <div class="ex">${esc([dev.city, dev.state].filter(Boolean).join(', '))}${dev.stage?' &middot; '+esc(dev.stage):''}${dev.units?' &middot; '+num(dev.units)+' units':''}</div>
      </div><div>${touchChip('development', dev.id, dev.last_contact_date, 'touchRefreshHot')}</div></div>`;
    } else if(!props.length){
      html += `<div class="hc-more">No properties linked yet.</div>`;
    } else {
      for(const p of props){
        const size = p.total_units ? num(p.total_units) + ' units'
          : (p.certified_beds ? num(p.certified_beds) + ' beds' : '');
        html += `<div class="hc-row">
          <div class="l">
            <div class="nm"><a onclick="location.hash='property/${esc(p.id)}'">${esc(p.name||'')}</a>${p.starred?' <span class="hc-star">&#128293;</span>':''}</div>
            <div class="ex"><span class="chip ${esc(p.asset_class||'')}" title="${esc(p.asset_label||'')}">${esc(ASSET_SHORT[p.asset_class]||p.asset_class||'?')}</span>
              ${esc([p.city, p.state].filter(Boolean).join(', '))}${size?' &middot; '+size:''}${p.year_built?' &middot; built '+esc(p.year_built):''}</div>
          </div>
          <div>${touchChip('property', p.id, p.last_contact_date === 'DNC' ? 'DNC' : p.last_contact_date, 'touchRefreshHot')}</div>
        </div>`;
      }
      if(g.prop_total > props.length)
        html += `<div class="hc-more">+ ${g.prop_total - props.length} more on the owner page</div>`;
    }
    html += `</div></div>`;

    const acts = g.activities || [];
    html += `<div class="hc-box hc-log"><h4>Call log &amp; notes${acts.length?` (${acts.length}${acts.length>=40?'+':''})`:''}</h4>`;
    if(!acts.length){
      html += `<div class="hc-more">Nothing logged yet &mdash; use a &ldquo;Log call&rdquo; chip above (or &ldquo;Log a call&rdquo;) to write the first note.</div>`;
    } else {
      // Newest few open, the rest behind a disclosure: on a prospect worked for months the
      // log is the longest thing on the card, and what matters on a call is the last one.
      for(const a of acts.slice(0, 4)) html += hotLogEntry(a);
      if(acts.length > 4){
        html += `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px">
          Show ${acts.length - 4} earlier note${acts.length-4===1?'':'s'}</summary>`;
        for(const a of acts.slice(4)) html += hotLogEntry(a);
        html += `</details>`;
      }
    }
    html += `</div></div>`;
  }
  return html;
}

// New Development: the NIC MAP Dodge Construction Pipeline (planned/underway/deferred/
// abandoned senior housing projects), organized state -> CBSA the same way Owner Targets
// groups state -> metro, plus Stage and Subclass chips since this feed carries both.
function devStageClass(stage){ return 'stage-' + (stage||'').replace(/[^A-Za-z]/g,''); }
let devLast = null, devRegion = '', devState = '', devCbsa = '', devStage = '', devSubclass = '', devSort = '', devDir = 'asc';
const devPageCache = new Map();
function devCacheKey(state, cbsa, stage, subclass, sort, dir, offset){
  return devRegion+'|'+(state||'')+'|'+(cbsa||'')+'|'+(stage||'')+'|'+(subclass||'')+'|'+(sort||'')+'|'+(dir||'')+'|'+(offset||0);
}
async function fetchDevPage(state, cbsa, stage, subclass, sort, dir, offset){
  const key = devCacheKey(state, cbsa, stage, subclass, sort, dir, offset);
  if(devPageCache.has(key)) return devPageCache.get(key);
  const qp = new URLSearchParams();
  if(state) qp.set('state', state);
  if(cbsa) qp.set('cbsa', cbsa);
  if(devRegion) qp.set('region', devRegion);
  if(stage) qp.set('stage', stage);
  if(subclass) qp.set('subclass', subclass);
  if(sort) qp.set('sort', sort);
  if(sort && dir) qp.set('dir', dir);
  if(offset) qp.set('offset', offset);
  const d = await getJSON('/api/developments' + (qp.toString()?('?'+qp.toString()):''));
  devPageCache.set(key, d);
  return d;
}
function devHashParams(overrides){
  const p = new URLSearchParams();
  const v = Object.assign({state:devState, region:devRegion, cbsa:devCbsa, stage:devStage, subclass:devSubclass, sort:devSort, dir:devDir}, overrides||{});
  if(v.state) p.set('state', v.state);
  if(v.region) p.set('region', v.region);
  if(v.cbsa) p.set('cbsa', v.cbsa);
  if(v.stage) p.set('stage', v.stage);
  if(v.subclass) p.set('subclass', v.subclass);
  if(v.sort){ p.set('sort', v.sort); p.set('dir', v.dir); }
  return p;
}
function setDevPage(off){
  const p = devHashParams(); if(off) p.set('offset', off);
  location.hash = 'developments' + (p.toString()?('?'+p.toString()):'');
}
function setDevCbsa(m){
  location.hash = 'developments' + devHashParams({cbsa: devCbsa===m?'':m}).toString().replace(/^/,'?').replace('??','?').replace(/^\?$/,'');
}
function setDevRegion(r){
  const p = devHashParams({region: devRegion===r?'':r, cbsa:''});
  location.hash = 'developments' + (p.toString()?('?'+p.toString()):'');
}
function setDevStage(s){
  const p = devHashParams({stage: devStage===s?'':s});
  location.hash = 'developments' + (p.toString()?('?'+p.toString()):'');
}
function setDevSubclass(s){
  const p = devHashParams({subclass: devSubclass===s?'':s});
  location.hash = 'developments' + (p.toString()?('?'+p.toString()):'');
}
function setDevSort(col, defDir){
  const dir = devSort===col ? (devDir==='desc'?'asc':'desc') : defDir;
  const p = devHashParams({sort: col, dir});
  location.hash = 'developments' + (p.toString()?('?'+p.toString()):'');
}

// ---------- Educational Notes cheat sheet ----------
// Vocab, process notes and call talking points for developer/land-owner conversations.
// Drop new terms in here (term/body/why/tip) -- Hap pastes raw notes, they get organized in.
const DEV_NOTES = [
  { cat: 'Traffic & Trip Generation', items: [
    { term: 'ITE / Trip Generation Manual', body: `ITE is the Institute of Transportation Engineers. Its Trip Generation Manual (currently 11th edition) is the industry-standard reference for estimating vehicle trips generated by different land uses, used in traffic impact studies, site plan review, and entitlement work.<br><br>Senior housing land use codes:<ul><li><b>252</b> &mdash; Senior Adult Housing, Attached (IL/AL blended)</li><li><b>253</b> &mdash; Congregate Care Facility</li><li><b>254</b> &mdash; Assisted Living</li><li><b>255</b> &mdash; Continuing Care Retirement Community (CCRC)</li><li><b>620</b> &mdash; Nursing Home (SNF)</li></ul>Each code gives trip rates (or rate equations) per unit/bed for AM peak, PM peak, and daily trips, based on empirical studies at surveyed sites.<br><br><b>Parking:</b> ITE also publishes parking generation rates by land use, which set the baseline parking requirement &mdash; for senior housing/nursing categories this typically runs around <b>0.5 to 0.54 spaces per bed</b>. From there, the architect prepares a yield study (a site plan testing how many units/beds the parcel can actually yield against setbacks, parking, and other site constraints) to confirm the ITE-driven parking count still pencils on the buildable area. Parking studies and trip generation studies both draw off the same underlying ITE data, but answer different questions &mdash; trips measure traffic impact off-site, parking measures stalls needed on-site.`,
      why: `Municipalities and county traffic engineers use these rates to decide whether a project triggers a full traffic impact study, requires road improvements, or affects entitlement conditions.`,
      tip: `Senior housing trip rates run meaningfully lower than multifamily or single-family rates &mdash; a selling point in entitlement discussions and useful support for density arguments or reduced parking ratios. On a call: ask which ITE code and edition the traffic engineer used &mdash; if they defaulted to a multifamily code instead of 252/253/254/255, that's an opening to push back.` },
    { term: 'Level of Service (LOS) vs. VMT', body: `LOS grades how well an intersection or road segment operates, A (free-flow) through F (gridlock), based on delay. Under CA's SB 743, most jurisdictions have shifted CEQA transportation analysis from LOS to Vehicle Miles Traveled (VMT) &mdash; how much driving a project generates region-wide, not just how congested the local intersection gets.`,
      why: `A project can fail LOS (triggering road-widening conditions) but pass VMT (little to no mitigation), or vice versa. Which standard applies changes both the cost and timeline of entitlement significantly.`,
      tip: `Ask the land-use consultant whether the jurisdiction is still LOS-based or has moved to VMT &mdash; infill senior housing near transit/services often screens out of VMT analysis entirely.` },
    { term: 'Traffic Impact Study (TIS/TIA)', body: `A study required when a project's projected trip generation (per ITE) exceeds a jurisdiction's threshold, or when it's near a sensitive intersection/school/etc. It analyzes existing and projected traffic, identifies deficient intersections, and recommends mitigation (signals, turn lanes, road widening).`,
      why: `TIS findings directly shape entitlement conditions of approval &mdash; and can add significant cost (off-site improvements) or delay if a signal warrant or road widening is triggered.` },
  ]},
  { cat: 'Entitlement & Zoning', items: [
    { term: 'By-right vs. Discretionary Approval', body: `By-right (ministerial) means a use is permitted under existing zoning and can move to building permit without a public hearing. Discretionary approval requires a CUP, variance, rezone, or similar and typically involves a public hearing where conditions can be added or the project denied.`,
      why: `Usually the single biggest driver of entitlement timeline and risk. Assisted living/memory care in a residential-adjacent zone very often needs a CUP even where multifamily is by-right.`,
      tip: `Early call question: "Is this project by-right under current zoning, or does it need a CUP or rezone?" The answer reframes the whole timeline conversation.` },
    { term: 'Conditional Use Permit (CUP)', body: `A discretionary approval allowing a use not automatically permitted in a zone, granted with conditions (hours of operation, landscaping/buffers, parking ratios, traffic mitigation, etc.). Requires a public hearing, usually before the Planning Commission.`,
      why: `Senior housing, and especially licensed care uses (AL/MC/SNF), frequently require a CUP even in zones that allow multifamily by-right, because of the licensed-care/institutional-use distinction.` },
    { term: 'Variance', body: `Relief from one specific zoning standard, such as a reduced setback, increased height, or fewer parking spaces than the code requires, granted when strict application would create an unusual hardship on that particular parcel.`,
      tip: `Lower parking ratios based on senior housing's documented lower vehicle ownership/trip generation are a common, defensible variance ask.` },
    { term: 'Density Bonus (CA Gov. Code 65915)', body: `California state law allowing a developer to build above the base zoning density (up to 50%+ under recent amendments) in exchange for including affordable and/or senior units, plus incentives/concessions (reduced setbacks, parking, height).`,
      why: `One of the most senior-housing-relevant entitlement tools in CA &mdash; some density bonus tiers are keyed specifically to senior housing or senior/affordable combinations, and it can turn a marginal site into a viable one.` },
    { term: 'FAR (Floor Area Ratio)', body: `The ratio of total building floor area to the lot's land area. An FAR of 0.5 on a 100,000 sf lot allows 50,000 sf of building. Zoning codes often cap FAR in addition to height and setback limits.`,
      why: `FAR caps can be the real constraint on unit count for a mid-rise IL/AL building even when height and setbacks look workable.` },
    { term: 'General Plan Amendment (GPA)', body: `Required when a project's proposed use or density conflicts with the jurisdiction's General Plan land use designation for that parcel &mdash; a legislative act, separate from and in addition to any rezone.`,
      why: `One of the slowest, most political entitlement paths (often 12+ months, City Council-level). If a site needs one, treat the timeline and execution risk very differently than a straightforward CUP.` },
    { term: 'Rezone / Zone Change', body: `A legislative action changing a parcel's zoning designation itself (e.g., from commercial to a senior-housing-specific or multifamily zone), rather than seeking an exception within the existing zone.` },
    { term: 'Planned Unit Development (PUD) / Overlay District', body: `A zoning tool that lets a specific project or area follow customized development standards instead of the underlying base zone &mdash; common for larger senior campuses (CCRC-scale) where a single set of tailored standards is cleaner than a string of variances.` },
  ]},
  { cat: 'Approval Process & Environmental Review', items: [
    { term: 'Planning Commission vs. City Council', body: `Most discretionary approvals (CUPs, tentative maps, variances) are decided first by the Planning Commission, a body of appointed citizens. Decisions can be appealed to the City Council, which has final say and is more politically exposed (elected).`,
      why: `A contested project that clears the Planning Commission isn't necessarily done &mdash; a neighbor appeal sends it to Council, which adds time and political risk.` },
    { term: 'CEQA Review (CA only)', body: `The California Environmental Quality Act requires environmental review before most discretionary approvals. Three tiers, increasing in scope: Categorical Exemption (no significant impact expected &mdash; fastest), Mitigated Negative Declaration/MND (impacts identified but mitigated below significance), and a full Environmental Impact Report/EIR (significant unmitigated impacts &mdash; slowest, most litigation-exposed).`,
      why: `Which CEQA tier applies is often the single biggest schedule variable on a CA project. AZ and CO don't have a CEQA equivalent, so this only comes up on CA calls.`,
      tip: `Ask early: "Is this project looking at a CatEx, an MND, or a full EIR?" If they don't know yet, that itself tells you the project is early-stage.` },
    { term: 'Vesting Tentative Map', body: `A tentative subdivision map that locks in the zoning and development standards in effect at the time of approval for a fixed period (commonly 2 to 5 years, extendable), protecting the project against subsequent rule changes while it moves through construction.`,
      tip: `Useful to ask about on longer-hold land deals &mdash; it de-risks a multi-year entitlement-to-construction timeline against a jurisdiction changing its rules mid-stream.` },
    { term: 'Entitlement Timeline (rule of thumb)', body: `Rough ranges, highly jurisdiction-dependent: CUP-only, uncontested &mdash; 4 to 8 months. CUP plus MND &mdash; 8 to 14 months. Rezone/GPA plus EIR &mdash; 18 to 36+ months.`,
      why: `Framing a developer's or owner's timeline expectations against these ranges quickly surfaces whether they're being realistic.` },
  ]},
  { cat: 'Site & Civil', items: [
    { term: 'Grading Permit (Rough vs. Precise)', body: `Rough grading shapes the pad and major slopes; precise grading fine-tunes final elevations for building pads, drainage, and utilities. Often permitted and inspected separately from the building permit itself.` },
    { term: 'Stormwater Detention/Retention', body: `On-site basins or underground systems sized to hold and slow-release (detention) or fully absorb (retention) stormwater runoff per the jurisdiction's hydrology standards, so post-development runoff doesn't exceed pre-development rates.`,
      why: `Detention/retention requirements eat into a site's buildable/parking area and can meaningfully affect achievable unit count &mdash; worth asking about early on a raw land deal.` },
    { term: 'ALTA/NSPS Survey', body: `A standardized boundary and title survey (per American Land Title Association / National Society of Professional Surveyors standards) that lenders and title companies require before closing on land acquisition or construction financing. Shows boundaries, easements, encroachments, and improvements.` },
    { term: 'Wet Utilities vs. Dry Utilities', body: `Wet utilities are water and sewer; dry utilities are electric, gas, and telecom/data. Availability and capacity of both at the property line is a basic go/no-go item on raw land.` },
    { term: 'Easement', body: `A recorded right for a party other than the fee owner to use a defined portion of the land, most commonly for access or utilities. Existing easements can constrain building footprint or site circulation even on an otherwise buildable parcel.` },
  ]},
  { cat: 'Land Acquisition & Deal Structure', items: [
    { term: 'Option Agreement', body: `An agreement giving the buyer/developer the right, but not the obligation, to purchase a parcel within a defined period (often tied to entitlement milestones) at agreed terms, in exchange for an option fee. Lets a developer control land through the entitlement process without buying it outright.`,
      why: `Common structure when talking to a land owner about a senior housing developer/buyer &mdash; the owner should understand they're not getting paid in full at signing, and that the option period is usually contingent on entitlement progress.` },
    { term: 'Due Diligence Period', body: `The contract period (commonly 60 to 180 days for a raw or lightly entitled site) during which the buyer investigates title, survey, environmental (Phase I/II ESA), soils, and entitlement feasibility, with a right to terminate and get the deposit back if something doesn't pencil.` },
    { term: 'Contingent vs. Non-Contingent Offer', body: `A contingent offer is subject to conditions being met (financing, entitlement approval, due diligence) before it's binding; a non-contingent ("hard") offer removes those outs, usually in exchange for a lower price or faster close.`,
      tip: `On a call with an owner comparing offers, price alone can be misleading &mdash; a lower non-contingent offer can be worth more to a motivated seller than a higher contingent one that might fall through in entitlement.` },
    { term: 'Land Banking', body: `A developer or investor acquiring and holding land ahead of near-term development, often before entitlements are pursued, betting on future value appreciation and/or a future development window.` },
  ]},
  { cat: 'Hard Costs vs. Soft Costs', items: [
    { term: 'What counts as each, and typical splits', body: `Hard costs are the direct construction costs: site work, shell, structure, MEP (mechanical/electrical/plumbing), finishes, and FF&amp;E for a SNF/AL build. Basically what's in the GC contract, typically 60 to 70% of total project cost on a senior housing development.<br><br>Soft costs are everything else that gets you to a certificate of occupancy and stabilized operations: architecture/engineering, entitlement and permitting fees, legal, financing costs (construction loan interest, origination fees), taxes and insurance during construction, developer fee, marketing/pre-leasing costs, and for licensed care (AL/MC/SNF) CON or licensing costs where applicable, plus pre-opening operating losses during lease-up or fill.<br><br>Total soft costs typically run 30 to 40% of hard costs depending on jurisdiction and product type, with CCRC/entrance-fee deals skewing higher due to actuarial and marketing costs.<br><br>Three things worth flagging on senior housing specifically that get missed:<ul><li><b>Pre-opening/ramp-up losses</b> (staffing up before census fills, marketing burn) often get bucketed as a soft cost or a separate "operating deficit reserve" line. Lenders will want to see it capitalized somewhere in sources and uses rather than assumed away.</li><li><b>FF&amp;E and OS&amp;E</b> (operating supplies and equipment) for a SNF can be a meaningfully bigger line item than a typical multifamily deal, given the clinical equipment and life safety systems, sometimes broken out as its own category rather than folded into hard costs.</li><li><b>CON costs</b> (in Certificate of Need states) and licensing/survey prep costs are a soft cost line that doesn't exist in market rate multifamily and can be underestimated by generalist developers moving into the space.</li></ul>`,
      why: `Knowing where a number falls tells you whether a developer's stated cost per unit is apples to apples with another deal, and whether their contingency or operating reserve assumption is realistic.`,
      tip: `On a call, ask what soft cost percentage they're underwriting to and whether it includes an operating deficit reserve and, where applicable, CON/licensing costs. Generalist multifamily developers moving into senior housing often underestimate both.` },
  ]},
  { cat: 'Financial & Construction Terms', items: [
    { term: 'Construction Loan vs. Permanent (Takeout) Loan', body: `A construction loan funds the build in draws, is typically interest-only and floating-rate, and is repaid or refinanced by a permanent/takeout loan once the project stabilizes. Permanent debt on stabilized senior housing often comes through agency lenders (Fannie Mae, Freddie Mac) or HUD, alongside conventional/life-co debt.` },
    { term: 'Stabilization', body: `The point at which a newly opened community reaches a sustained target occupancy (commonly 90 to 95%) and normalized operating expenses, after which it can be refinanced with permanent debt or valued on an income-approach basis.`,
      why: `Pre-stabilization, a community is valued more on projected/pro forma numbers and development cost; post-stabilization it trades like any other income property. Where a project sits relative to stabilization changes how you should be pricing it.` },
    { term: 'Absorption / Lease-Up Period', body: `The time it takes a new community to fill from opening to stabilized occupancy &mdash; commonly 18 to 30 months for new senior housing, longer for larger CCRC-scale projects or softer submarkets.` },
    { term: 'Cap Rate at Delivery vs. at Stabilization', body: `A forward sale is often priced off a stabilized cap rate applied to projected stabilized NOI, discounted back for the lease-up period and risk &mdash; distinct from the going-in cap rate you'd apply to an already-stabilized asset today.` },
    { term: 'Forward Purchase / Forward Commitment', body: `An investor or buyer commits, before or during construction, to purchase the completed (and often to-be-stabilized) project at agreed terms. Used to de-risk construction financing and give the developer/lender certainty of exit.` },
    { term: 'GMP (Guaranteed Maximum Price) Contract', body: `A construction contract where the contractor guarantees a maximum price for the scope of work; savings versus that cap may be shared with the owner, while cost overruns beyond it are the contractor's risk (subject to change orders).` },
  ]},
  { cat: 'Call Tips & Talking Points', items: [
    { term: 'Lead with entitlement status, not price', body: `For land deals in particular, "where is it in entitlement" (raw / by-right / CUP pending / approved) tells you more about real risk and timeline than the asking price does. Anchor the rest of the conversation on that.` },
    { term: 'Ask what ITE code and unit mix the pro forma assumes', body: `Developers sometimes run their trip generation and parking off a generic multifamily code instead of the correct senior housing ITE code (252-255/620). Catching this is a genuine value-add on a call, not just a vocab flex.` },
    { term: 'Owners vs. developers want different conversations', body: `A land owner usually wants to understand certainty of close and how much of the price is contingent on entitlement; a developer wants to talk unit count, ITE/parking, and timeline. Lead each conversation with what that party actually optimizes for.` },
    { term: 'Ask which jurisdiction contact is assigned', body: `Entitlement risk is jurisdiction-specific and often relationship-specific. Knowing which city/county department and which staff planner or consultant is assigned tells you a lot about how predictable the timeline will be.` },
  ]},
];
function renderDevNotesHTML(){
  let html = '';
  for(const c of DEV_NOTES){
    html += `<details class="dn-cat"><summary>${esc(c.cat)}</summary><div class="dn-catbody">`;
    for(const t of c.items){
      html += `<details class="dn-term"><summary>${esc(t.term)}</summary><div class="dn-body">
        ${t.body}
        ${t.why?`<div class="dn-why"><b>Why it matters:</b> ${t.why}</div>`:''}
        ${t.tip?`<div class="dn-tip">${t.tip}</div>`:''}
      </div></details>`;
    }
    html += `</div></details>`;
  }
  return html;
}
// ---------- email templates ----------
// Clicking any email address anywhere opens a small menu instead of a blank email: pick a
// template, and the draft comes back written around what that person owns. "Open in
// Outlook" hands Outlook a new message with the team bio attached; Hap presses Send there.
// "Plain email" is the old behaviour.
const EMAIL_TEMPLATES = [['voicemail','Left a voicemail'],['intro','Cold intro (no call yet)'],['spoke','Good speaking today']];
let emState = null;

document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="mailto:"]');
  if(!a || a.dataset.plain || window.COMPS_ONLY) return;   // the hosted comp report has no templates
  if(e.ctrlKey || e.metaKey || e.shiftKey) return;     // modifier click = plain mailto
  e.preventDefault();
  const email = decodeURIComponent(a.getAttribute('href').slice(7).split('?')[0]);
  emMenuOpen(a, email);
}, true);

function emMenuClose(){ const m = document.getElementById('em-menu'); if(m) m.remove(); }
function emMenuOpen(a, email){
  emMenuClose();
  const r = a.getBoundingClientRect();
  const m = document.createElement('div');
  m.id = 'em-menu'; m.className = 'em-menu';
  m.innerHTML = `<div class="em-h">Email ${esc(email)}</div>`
    + EMAIL_TEMPLATES.map(([k, lab]) => `<div class="em-opt" data-k="${k}">${esc(lab)}</div>`).join('')
    + `<div class="em-sep"></div><div class="em-opt plain" data-k="">Plain email</div>`;
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
  m.style.top = (r.bottom + h + 6 > innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
  m.addEventListener('click', ev => {
    const o = ev.target.closest('.em-opt'); if(!o) return;
    emMenuClose();
    if(!o.dataset.k){ location.href = 'mailto:' + email; return; }
    emOpen(email, o.dataset.k);
  });
  setTimeout(() => document.addEventListener('click', function off(ev){
    if(!ev.target.closest('#em-menu')){ emMenuClose(); document.removeEventListener('click', off); }
  }), 0);
}

function emContextPid(){
  const h = location.hash.slice(1);
  return h.startsWith('property/') ? h.split('/')[1] : '';
}

async function emOpen(email, template, listing){
  const d = await fetch('/api/email/draft', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, template, property_id: emContextPid(), listing})}).then(r => r.json()).catch(() => null);
  if(!d || d.error){ alert('Could not build that email.'); return; }
  emState = d;
  emRender();
}

function emRender(){
  const d = emState;
  let el = document.getElementById('em-backdrop');
  if(!el){
    el = document.createElement('div');
    el.id = 'em-backdrop'; el.className = 'dn-backdrop';
    el.addEventListener('click', e => { if(e.target.id === 'em-backdrop') emClose(); });
    document.body.appendChild(el);
    document.addEventListener('keydown', emEsc);
  }
  const rc = d.recipient || {};
  const who = [rc.name, rc.n_props ? (rc.n_props === 1 ? rc.owns[0] : rc.n_props + ' properties: ' + rc.owns.slice(0,3).join(', ') + (rc.n_props > 3 ? '...' : '')) : 'nothing on file for this address']
    .filter(Boolean).join(' \u00b7 ');
  const canLog = rc.contact_id || rc.entity_id || (rc.property_ids || []).length;
  const listOpts = ['<option value="">Don\u2019t mention a listing</option>']
    .concat((d.listings || []).map(l => `<option value="${esc(l)}"${l === d.listing ? ' selected' : ''}>${esc(l)}</option>`)).join('');
  el.innerHTML = `<div class="dn-modal em-modal">
    <span class="dn-close" onclick="emClose()">&times;</span>
    <h1>Email ${esc(d.to)}</h1>
    <div class="em-who">${esc(who)}</div>
    <div class="em-tabs">${EMAIL_TEMPLATES.map(([k, lab]) => `<a class="${k === d.template ? 'on' : ''}" onclick="emSwitch('${k}')">${esc(lab)}</a>`).join('')}</div>
    ${d.template !== 'spoke' ? `<label>Listing to mention</label><select onchange="emSwitch('${d.template}', this.value)">${listOpts}</select>` : ''}
    <label>Subject</label><input type="text" id="em-subject" value="${esc(d.subject)}">
    <label>Message</label><textarea id="em-body">${esc(d.body)}</textarea>
    <div class="em-foot">
      <a class="em-go" onclick="emSend()">Open in Outlook</a>
      <label style="margin:0;color:var(--text)"><input type="checkbox" id="em-attach"${d.bio_found ? ' checked' : ' disabled'}> Attach team bio${d.bio_found ? '' : ' (file not found)'}</label>
      ${canLog ? '<label style="margin:0;color:var(--text)"><input type="checkbox" id="em-log" checked> Log it on their record</label>' : ''}
      <span class="em-msg" id="em-msg">Opens as a new message in Outlook. Nothing sends until you press Send there.</span>
    </div>
  </div>`;
}

function emSwitch(template, listing){
  // Keep any hand edits? Switching template rewrites the draft, which is the point of
  // switching; the listing dropdown rewrites it too.
  emOpen(emState.to, template, listing === undefined ? null : listing);
}
function emEsc(e){ if(e.key === 'Escape') emClose(); }
function emClose(){
  const el = document.getElementById('em-backdrop'); if(el) el.remove();
  document.removeEventListener('keydown', emEsc);
  emState = null;
}

async function emSend(){
  const d = emState; if(!d) return;
  const rc = d.recipient || {};
  const logBox = document.getElementById('em-log');
  const label = (EMAIL_TEMPLATES.find(t => t[0] === d.template) || [,'template email'])[1];
  const body = {to: d.to, subject: document.getElementById('em-subject').value,
    body: document.getElementById('em-body').value,
    attach: !!(document.getElementById('em-attach') || {}).checked,
    log: logBox && logBox.checked ? {contact_id: rc.contact_id, entity_id: rc.contact_id ? null : rc.entity_id,
      property_id: (rc.property_ids || [])[0] || null, label} : null};
  const msg = document.getElementById('em-msg');
  if(msg) msg.textContent = 'Opening Outlook...';
  const r = await fetch('/api/email/open', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)}).then(x => x.json()).catch(() => ({error: 'no answer from Beta Station'}));
  if(r.error){ if(msg) msg.textContent = r.error; return; }
  emClose();
}

function devNotesEscHandler(e){ if(e.key==='Escape') closeDevNotes(); }
function openDevNotes(){
  if(document.getElementById('dn-backdrop')) return;
  const div = document.createElement('div');
  div.id = 'dn-backdrop';
  div.className = 'dn-backdrop';
  div.innerHTML = `<div class="dn-modal">
    <span class="dn-close" onclick="closeDevNotes()">&times;</span>
    <h1>&#128218; Educational Notes &mdash; Development &amp; Entitlement Cheat Sheet</h1>
    <div class="dn-sub">Vocab, process notes and talking points for calls with developers, land-use consultants and property owners. Click a category, then a term, to expand.</div>
    ${renderDevNotesHTML()}
  </div>`;
  div.addEventListener('click', (e)=>{ if(e.target.id==='dn-backdrop') closeDevNotes(); });
  document.body.appendChild(div);
  document.addEventListener('keydown', devNotesEscHandler);
}
function closeDevNotes(){
  const el = document.getElementById('dn-backdrop');
  if(el) el.remove();
  document.removeEventListener('keydown', devNotesEscHandler);
}
async function renderDevelopments(state, cbsa, stage, subclass, sort, dir, offset){
  devState = state||''; devCbsa = cbsa||''; devStage = stage||''; devSubclass = subclass||'';
  devSort = sort||''; devDir = dir||'asc';
  const curOff = offset || 0;
  const cacheKey = devCacheKey(devState, devCbsa, devStage, devSubclass, devSort, devDir, curOff);
  if(!devPageCache.has(cacheKey)){
    app.innerHTML = '<div class="spinner">Loading planned developments...</div>';
  }
  devLast = await fetchDevPage(devState, devCbsa, devStage, devSubclass, devSort, devDir, curOff);
  paintDevelopments();
  const limit = devLast.limit || 40;
  const curOffset = devLast.offset || 0;
  const rows = devLast.developments || [];
  const filTotal = devLast.count || 0;
  if(curOffset + rows.length < filTotal)
    fetchDevPage(devState, devCbsa, devStage, devSubclass, devSort, devDir, curOffset + limit).catch(()=>{});
  if(curOffset > 0)
    fetchDevPage(devState, devCbsa, devStage, devSubclass, devSort, devDir, Math.max(0, curOffset - limit)).catch(()=>{});
}

      const label = devState ? esc(r.cbsa||'(no CBSA)') : (esc(r.state)+' &mdash; '+esc(r.cbsa||'(no CBSA)'));

async function exportDevelopmentsCSV(){
  const qp = new URLSearchParams();
  if(devState) qp.set('state', devState);
  if(devCbsa) qp.set('cbsa', devCbsa);
  if(devStage) qp.set('stage', devStage);
  if(devSubclass) qp.set('subclass', devSubclass);
  qp.set('limit', 100000);
  const d = await getJSON('/api/developments' + (qp.toString()?('?'+qp.toString()):''));
  const src = d.developments || [];
  const hdr = ['Project','Address','City','State','CBSA','Zip','Subclass','Stage','Units','Buildings','Stories','TargetStart','TargetCompletion','Status','Overview','Owner','OwnerType','OwnerContact','OwnerPhone','OwnerEmail','OwnerWeb'];
  const rows = [hdr];
  for(const r of src){
    rows.push([r.project_name, r.address, r.city, r.state, r.cbsa, r.zip, r.subclass, r.stage, r.units, r.buildings, r.stories, r.target_start, r.target_completion, r.status, r.overview, r.owner_name, r.owner_type, r.owner_contact, r.owner_phone, r.owner_email, r.owner_web]);
  }
  const csv = rows.map(r => r.map(v => {
    v = (v==null?'':String(v));
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'new_development'+(devState?'_'+devState:'')+(devCbsa?'_'+devCbsa.replace(/[^A-Za-z0-9]+/g,'_'):'')+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function loadDevelopmentMap(p){
  if(p.lat != null && p.lng != null){
    renderMiniMap('dev-map', [{lat: p.lat, lng: p.lng, html: `<b>${esc(p.project_name)}</b>`}]);
    return;
  }
  const el = document.getElementById('dev-map');
  if(el) el.innerHTML = '<div class="empty-msg">Locating on the map...</div>';
  try {
    const r = await fetch('/api/development/'+p.id+'/geocode', {method:'POST'});
    const j = await r.json();
    if(location.hash.slice(1) !== 'development/'+p.id) return; // navigated away
    if(j && j.lat != null && j.lng != null){
      renderMiniMap('dev-map', [{lat: j.lat, lng: j.lng, html: `<b>${esc(p.project_name)}</b>`}]);
    } else if(el){
      el.innerHTML = '<div class="empty-msg">No location on file for this address yet.</div>';
    }

// Every live property in the territory, one row each, laid out exactly like Owner Targets
// so the two read the same. Owner Targets is the callable shortlist; this is the whole
// database, for scanning by territory, acuity and year built. Replaced the Salesforce Call
