let apLast = null, apState = '', apRegion = '', apMetro = '', apClasses = [], apSort = '', apDir = 'asc';
const apPageCache = new Map();
function apQuery(state, region, metro, classes, sort, dir, offset){
  const p = new URLSearchParams();
  if(state) p.set('state', state);
  if(region) p.set('region', region);
  if(metro) p.set('metro', metro);
  if(classes && classes.length) p.set('classes', classes.join(','));
  if(sort){ p.set('sort', sort); p.set('dir', dir || 'asc'); }
  if(offset) p.set('offset', offset);
  return p;
}
async function fetchAllPropsPage(state, region, metro, classes, sort, dir, offset){
  const qs = apQuery(state, region, metro, classes, sort, dir, offset).toString();
  if(apPageCache.has(qs)) return apPageCache.get(qs);
  const d = await apiJSON('/api/allprops' + (qs ? '?' + qs : ''));
  if(d.error) return d;            // never cache a failure, so a retry after a restart works
  apPageCache.set(qs, d);
  return d;
}
// Every control rebuilds the hash from current state plus the one thing it changes, and
// anything that changes WHICH rows are shown drops the offset back to page 1.
function apGo(ch){
  const s = Object.assign({state: apState, region: apRegion, metro: apMetro, classes: apClasses,
                           sort: apSort, dir: apDir, offset: 0}, ch || {});
  const qs = apQuery(s.state, s.region, s.metro, s.classes, s.sort, s.dir, s.offset).toString();
  location.hash = 'allprops' + (qs ? '?' + qs : '');
}
function setAllPropsTerritory(st, r){ apGo({state: st, region: r, metro: ''}); }
function setAllPropsMetro(m){ apGo({metro: apMetro === m ? '' : m}); }
function toggleAllPropsClass(c){
  const cur = new Set(apClasses);
  if(cur.has(c)) cur.delete(c); else cur.add(c);
  apGo({classes: [...cur]});
}
function setAllPropsPage(off){ apGo({offset: off || 0}); }
function setAllPropsSort(col, defDir){
  apGo({sort: col, dir: apSort === col ? (apDir === 'desc' ? 'asc' : 'desc') : defDir});
}
async function renderAllProps(p){
  apState = p.get('state') || ''; apRegion = p.get('region') || ''; apMetro = p.get('metro') || '';
  apClasses = (p.get('classes') || '').split(',').filter(Boolean);
  apSort = p.get('sort') || ''; apDir = p.get('dir') || 'asc';
  const off = parseInt(p.get('offset'), 10) || 0;
  const qs = apQuery(apState, apRegion, apMetro, apClasses, apSort, apDir, off).toString();
  if(!apPageCache.has(qs)) app.innerHTML = '<div class="spinner">Loading all properties...</div>';
  const d = await fetchAllPropsPage(apState, apRegion, apMetro, apClasses, apSort, apDir, off);
  if(location.hash.slice(1).split('?')[0] !== 'allprops') return;   // navigated away
  if(d.error){ app.innerHTML = `<div class="empty-msg">${esc(d.error)}</div>`; return; }
  apLast = d;
  if(d.region_labels) REGION_LABELS = d.region_labels;
  paintAllProps();
  const limit = d.limit || 40, rows = d.properties || [];
  if(off + rows.length < (d.count || 0))
    fetchAllPropsPage(apState, apRegion, apMetro, apClasses, apSort, apDir, off + limit).catch(()=>{});
}
function paintAllProps(){
  const d = apLast || {};
  const rows = d.properties || [];
  const states = d.states || [];
  const allRegions = d.regions || [];
  const metros = d.metros || [];
  const total = d.total || 0, filTotal = d.count || 0, limit = d.limit || 40, curOffset = d.offset || 0;

  let head = `<div class="cl-head"><h1>&#127968; All Properties</h1>
    ${filTotal?`<a class="navlink" style="padding:5px 11px;font-size:13px" onclick="exportAllPropsCSV()">Download CSV</a>`:''}
  </div>
  <div class="cl-sub">Every property in the database across CA, AZ and CO. Click a column header to sort.
    <b>${num(total)}</b> properties${filTotal!==total?` &middot; <b>${num(filTotal)}</b> match these filters`:''}.</div>`;

  // Territory chips: same split as Owner Targets, California offered as its two halves.
  head += `<div class="cl-cats"><span class="lbl">Territory:</span>`;
  head += `<span class="catchip ${apState?'':'active'}" onclick="setAllPropsTerritory('','')">All<span class="ct">${num(total)}</span></span>`;
  for(const s of states){
    const regs = allRegions.filter(r => r.state===s.state);
    if(regs.length > 1){
      for(const r of regs){
        const on = (apState===s.state && apRegion===r.region);
        head += `<span class="catchip ${on?'active':''}" onclick="setAllPropsTerritory('${s.state}','${r.region}')">${esc(regionLabel(r.region))}<span class="ct">${num(r.count)}</span></span>`;
      }
      // Some CA rows have no county and an unrecognized city, so they belong to neither
      // half; the whole-state chip keeps them reachable.
      const regSum = regs.reduce((n, r) => n + r.count, 0);
      if(regSum < s.count){
        head += `<span class="catchip ${apState===s.state && !apRegion?'active':''}" onclick="setAllPropsTerritory('${s.state}','')">All ${esc(s.state)}<span class="ct">${num(s.count)}</span></span>`;

    }
  }
  head += `</div>`;

  if(apState){
    const ms = metros.filter(m => m.state===apState);
    if(ms.length > 1){
      const scopeTotal = ms.reduce((n, m) => n + m.count, 0);
      head += `<div class="cl-cats"><span class="lbl">Metro:</span>`;
      head += `<span class="catchip ${apMetro?'':'active'}" onclick="setAllPropsMetro('')">All metros<span class="ct">${num(scopeTotal)}</span></span>`;
      for(const m of ms){

        head += `<span class="catchip ${apMetro===m.metro?'active':''}" onclick="setAllPropsMetro('${arg}')">${esc(m.metro)}<span class="ct">${num(m.count)}</span></span>`;

  head += `<div class="cl-cats"><span class="lbl">Acuity:</span>`;
  head += `<span class="catchip ${apClasses.length?'':'active'}" onclick="apGo({classes: []})">All</span>`;
  for(const a of (d.acuity || [])){
    const on = apClasses.includes(a.asset_class);
    head += `<span class="catchip ${on?'active':''}" title="${esc(a.label||'')}" onclick="toggleAllPropsClass('${esc(a.asset_class)}')">${esc(ASSET_SHORT[a.asset_class]||a.asset_class||'?')}<span class="ct">${num(a.count)}</span></span>`;
  }
  head += `</div>`;

  if(!rows.length){
    app.innerHTML = head + `<div class="empty-msg">No properties for this filter.</div>`;
    window.scrollTo(0,0); return;
  }

  const pager = pagerHTML(curOffset, rows.length, filTotal, limit, 'setAllPropsPage');
  const gf = 'setAllPropsSort';
  let html = head + pager + `<div class="panel targets-panel" style="margin-top:0"><table class="cl targets">
    <thead><tr>
      ${rosterTh(apSort, apDir, 'name', 'Property', gf)}

      ${rosterTh(apSort, apDir, 'acuity', 'Acuity', gf)}

      <th title="Who owns the building: the one answer across TLO, CoStar, NIC MAP and what you entered">Owner</th>
      <th title="Who runs it: operator on file, else the NIC MAP brand, else the state license holder">Operator</th>

    const built = r.year_built ? esc(r.year_built) : '<span class="empty">-</span>';
    const xref = (name) => {

      return esc(name) + (matches ? ` <span class="chip status" title="matches the owner name">&#10003; match</span>` : '');
    };
    html += `<tr>
      <td class="t-prop"><a onclick="location.hash='property/${esc(r.id)}'" style="cursor:pointer">${esc(r.name||'')}</a></td>

      <td class="t-notes">${noteCell(r, 'property', r.id)}</td>

  html += `</tbody></table></div>` + pager;

// Patch the touched row in memory rather than refetching, same as Owner Targets.
function touchRefreshAllProps(){

// Export ignores pagination: the whole filtered set, owners included. Owner lookups cost
// a few milliseconds a row, so a big export (all of CA) takes several seconds.
async function exportAllPropsCSV(){
  const n = (apLast && apLast.count) || 0;
  if(!n) return;
  const qp = apQuery(apState, apRegion, apMetro, apClasses, apSort, apDir, 0);
  qp.set('limit', n);
  const d = await getJSON('/api/allprops?' + qp.toString());
  const hdr = ['Property','Address','City','County','State','Region','Metro','Zip','Acuity','Units','Beds','YearBuilt',
               'Owner','OwnerSource','Operator','OperatorSource',
               'TLOOwner','CostarTrueOwner','NicmapOwner','NicmapOperator','LastContact','LastNote'];
  // The name column stays clean for a mail merge; how solid it is rides in its own column.
  const pname = (row) => (row && row.name) || '';
  const psrc = (row) => !row || !row.name ? ''
    : [PARTY_SRC[row.source] || row.source || '', row.confidence === 'confirmed' ? '' : row.confidence]
        .filter(Boolean).join(' - ');
  const out = [hdr];
  for(const r of (d.properties || [])){
    out.push([r.name, r.primary_address, r.city, r.county, r.state, regionLabel(r.region||''), r.metro, r.zip, r.asset_class, r.total_units, r.certified_beds, r.year_built,
      pname(r.owner_row), psrc(r.owner_row), pname(r.operator_row), psrc(r.operator_row),
      r.owner, r.costar_true_owner, r.nicmap_owner, r.nicmap_operator, (r.is_dnc?'DNC':r.last_contact), r.last_note]);
  }
  const csv = out.map(r => r.map(v => {
    v = (v==null?'':String(v));
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'all_properties'+(apState?'_'+apState:'')+(apRegion?'_'+apRegion:'')+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---------- Loans Coming Due (#loans) ----------
// Owner Targets, organized around the debt: one row per building with its most pressing
// loan (loans/load_loans.py -> core_loans; CoStar maturity dates + HUD Section 232 terms).
// Same territory/metro chips, owner, last-contact and note columns as the other rosters, plus
// a Loan column (why to call, and when) and a Terms column (rate, balance, lender).
// Known REIT/chain owners are hidden by default: they refinance through a treasury desk.
let lnLast = null, lnState = '', lnRegion = '', lnMetro = '', lnSignal = '', lnInst = false, lnSort = '', lnDir = 'asc';
const lnPageCache = new Map();
const LOAN_SIGNAL_CLASS = {distress:'ln-hot', past_due:'ln-hot', due_12:'ln-hot', due_24:'ln-warm', due_36:'ln-cool', hud_high:'ln-refi', hud_low:'ln-assume'};
function lnQuery(s, offset){
  const p = new URLSearchParams();
  if(s.state) p.set('state', s.state);
  if(s.region) p.set('region', s.region);
  if(s.metro) p.set('metro', s.metro);
  if(s.signal) p.set('signal', s.signal);
  if(s.inst) p.set('inst', '1');
  if(s.sort){ p.set('sort', s.sort); p.set('dir', s.dir || 'asc'); }
  if(offset) p.set('offset', offset);
  return p;
}
function lnCur(){ return {state: lnState, region: lnRegion, metro: lnMetro, signal: lnSignal, inst: lnInst, sort: lnSort, dir: lnDir}; }
async function fetchLoansPage(s, offset){
  const qs = lnQuery(s, offset).toString();
  if(lnPageCache.has(qs)) return lnPageCache.get(qs);
  const d = await apiJSON('/api/loans' + (qs ? '?' + qs : ''));
  if(d.error) return d;
  lnPageCache.set(qs, d);
  return d;
}
// Anything that changes WHICH rows show drops back to page 1.
function lnGo(ch){
  const s = Object.assign(lnCur(), ch || {});
  const qs = lnQuery(s, (ch && ch.offset) || 0).toString();
  location.hash = 'loans' + (qs ? '?' + qs : '');
}
function setLoansPage(off){ lnGo({offset: off || 0}); }
function setLoansSort(col, defDir){ lnGo({sort: col, dir: lnSort === col ? (lnDir === 'desc' ? 'asc' : 'desc') : defDir}); }
async function renderLoans(p){
  lnState = p.get('state') || ''; lnRegion = p.get('region') || ''; lnMetro = p.get('metro') || '';
  lnSignal = p.get('signal') || ''; lnInst = p.get('inst') === '1';
  lnSort = p.get('sort') || ''; lnDir = p.get('dir') || 'asc';
  const off = parseInt(p.get('offset'), 10) || 0;
  const qs = lnQuery(lnCur(), off).toString();
  if(!lnPageCache.has(qs)) app.innerHTML = '<div class="spinner">Loading loans coming due...</div>';
  const d = await fetchLoansPage(lnCur(), off);
  if(location.hash.slice(1).split('?')[0] !== 'loans') return;
  if(d.error){ app.innerHTML = `<div class="cl-head"><h1>&#127974; Loans Coming Due</h1></div><div class="empty-msg">${esc(d.error)}</div>`; return; }
  lnLast = d;
  if(d.region_labels) REGION_LABELS = d.region_labels;
  paintLoans();
  const rows = d.loans || [], limit = d.limit || 40;
  if(off + rows.length < (d.count || 0)) fetchLoansPage(lnCur(), off + limit).catch(()=>{});
}
function fmtMonYr(iso){
  if(!iso) return '';
  const [y, m] = iso.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][(+m||1)-1] + ' ' + y;
}
function fmtMoneyShort(n){
  if(n==null || !n) return '';
  if(n >= 1e6) return '$' + (n/1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if(n >= 1e3) return '$' + Math.round(n/1e3) + 'K';
  return '$' + Math.round(n);
}
function loanWhen(months){
  if(months == null) return '';
  if(months < 0) return (-months) + ' mo ago';
  if(months === 0) return 'this month';
  return 'in ' + months + ' mo';
}
// County foreclosure filing codes: NF = notice of trustee sale. Other codes (RL) are shown as-is until confirmed.
const FC_TYPE = {NF: 'Notice of trustee sale'};
function loanSrcLabel(src){ return src === 'hud' ? 'HUD' : (src === 'tlo' ? 'TLO' : (src === 'research' ? 'county record' : (src === 'county' ? 'county records' : 'CoStar'))); }
// The TLO Property Deeds check (loans/tlo_checks.json): a quiet second line under the loan.
const TLO_VERDICT = {
  match: ['TLO &#10003;', 'TLO shows the same loan and due date'],
  refi_found: ['TLO: refinanced', 'TLO found a newer loan than CoStar shows; this row uses the TLO loan'],
  extended: ['TLO: extended', 'TLO shows a recorded modification that moved the due date; this row uses it'],
  no_due_date: ['TLO: no due date', "TLO has the loan but no due date; CoStar's date stands"],
  date_differs: ['TLO: other date', "TLO dates this loan differently; CoStar's date stands"],
  sold: ['TLO: sold', "TLO shows a newer sale with no new loan; the loan CoStar dates may be paid off"],
  no_record: ['TLO: nothing on file', "TLO has no loan recorded for this address; CoStar's date stands"],
};
function tloCheckLine(verdict, checkedAt, note){
  if(!verdict) return '';
  const [lab, hlp] = TLO_VERDICT[verdict] || [esc(verdict), ''];
  const when = checkedAt ? ' ' + esc(fmtMonYr(checkedAt).split(' ')[0] + ' ' + String(+checkedAt.slice(8,10))) : '';
  const tip = [hlp, note || ''].filter(Boolean).join('. ');
  return `<div class="ln-sub ln-tlo ${(verdict==='refi_found'||verdict==='extended')?'refi':''}" title="${esc(tip)}">${lab}${when}</div>`;
}
function loanCell(r){
  const sig = (lnLast.signals || []).find(s => s.signal === r.loan_signal) || {};
  const chip = `<span class="chip ${LOAN_SIGNAL_CLASS[r.loan_signal]||'status'}" title="${esc(sig.help||'')}">${esc(sig.label||r.loan_signal||'')}</span>`;
  const src = loanSrcLabel(r.loan_source);
  let when = '';
  if(r.loan_maturity_date && !(r.loan_signal === 'hud_high' || r.loan_signal === 'hud_low'))
    when = `<div class="ln-sub">${esc(fmtMonYr(r.loan_maturity_date))} &middot; ${esc(loanWhen(r.loan_months))}</div>`;
  else if(r.loan_maturity_date)
    when = `<div class="ln-sub">matures ${esc(r.loan_maturity_date.slice(0,4))}</div>`;
  return `<span title="per ${src}">${chip}</span>${when}${tloCheckLine(r.loan_tlo_verdict, r.loan_tlo_checked_at, r.loan_tlo_note)}`;
}
function loanTermsCell(r){
  const bits = [];
  if(r.loan_interest_rate) bits.push((+r.loan_interest_rate).toFixed(2) + '%');
  if(r.loan_balance) bits.push(fmtMoneyShort(r.loan_balance));
  else if(r.loan_original_amount) bits.push(fmtMoneyShort(r.loan_original_amount) + ' loan');
  const top = bits.length ? esc(bits.join(' · ')) : '<span class="empty">date only</span>';
  const lender = r.loan_lender ? `<div class="ln-sub" title="${esc(r.loan_program||'')}">${esc(r.loan_lender)}</div>` : '';
  return top + lender;
}
function lastSaleCell(r){
  if(!r.last_sale_date) return '<span class="empty">-</span>';
  const y = r.last_sale_date.slice(0,4);
  // Bought at the 2021-22 peak with today's rates: the owner most likely to be squeezed.
  const peak = (y === '2021' || y === '2022') ? ` <span class="chip warn" title="Bought at the 2021-22 peak; refinancing at today's rates is the squeeze">peak</span>` : '';
  const price = r.last_sale_price ? `<div class="ln-sub">${esc(fmtMoneyShort(r.last_sale_price))}</div>` : '';
  return esc(y) + peak + price;
}

  </div>

    } else {
      head += `<span class="catchip ${lnState===s.state?'active':''}" onclick="lnGo({state:'${s.state}',region:'',metro:''})">${esc(s.state||'?')}<span class="ct">${num(s.count)}</span></span>`;

  let curSig = null;

    const owner = (r.owner_row && r.owner_row.name) ? partyCell(r.owner_row) + inst
      : (r.owner ? ownerLink(r) + inst : partyCell(r.owner_row));
    html += `<tr>
      <td class="t-prop"><a onclick="location.hash='property/${esc(r.id)}'" style="cursor:pointer">${esc(r.name||'')}</a></td>
      <td title="${esc(r.city||'')}" style="max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.city||'')}</td><td>${esc(r.state||'')}</td>
      <td style="white-space:nowrap">${acuity}</td>
      <td style="white-space:nowrap">${size}</td>
      <td>${built}</td>
      <td class="t-owner">${owner}</td>

      <td style="white-space:nowrap">${touchChip('property', r.id, r.is_dnc ? 'DNC' : r.last_contact, 'touchRefreshLoans', hotOwnerTarget(r))}</td>
      <td class="t-notes">${noteCell(r, 'property', r.id)}</td>
    </tr>`;
  }
  html += `</tbody></table></div>` + pager;
  if(d.unmatched)
    html += `<div class="muted" style="margin:10px 2px;font-size:12.5px">${num(d.unmatched)} more loans in the source files could not be tied to a building in BS yet (mostly hospitals, behavioral health, and HUD names that do not match ours).</div>`;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

// One-line loan note at the foot of Property Details, so a building reached from Owner
// Targets or a search still says "their loan comes due in March" without scrolling to the
// Debt panel. Tinted softly by urgency (red past due / within a year, amber 1-3 years,
// green/teal for the HUD pitches); a loan with nothing pressing gets a plain muted line.
function loanNote(loans){
  if(!loans || !loans.length) return '';
  const rank = ['past_due','due_12','due_24','due_36','hud_high','hud_low'];
  const live = loans.filter(l => l.signal).sort((a, b) =>
    rank.indexOf(a.signal) - rank.indexOf(b.signal) || (a.maturity_date||'').localeCompare(b.maturity_date||''));
  let l = live[0] || loans.filter(x => !x.stale && !x.superseded && x.source !== 'tlo' && x.maturity_date).sort((a, b) => (a.maturity_date||'').localeCompare(b.maturity_date||''))[0];
  if(!l) return '';
  // HUD terms fill in a bare CoStar date when both name the same month (same loan).
  const hud = loans.find(x => x.source === 'hud' && x.maturity_date && l.maturity_date && x.maturity_date.slice(0,7) === l.maturity_date.slice(0,7));
  if(l.source === 'costar' && hud) l = Object.assign({}, hud, {signal: l.signal, months: l.months});
  const rateInHead = (l.signal === 'hud_high' || l.signal === 'hud_low');
  const terms = [l.interest_rate && !rateInHead ? (+l.interest_rate).toFixed(2)+'%' : '', l.balance ? fmtMoneyShort(l.balance)+' balance' : '', l.lender || '']
    .filter(Boolean).join(' · ');
  const src = loanSrcLabel(l.source);
  const when = l.maturity_date ? fmtMonYr(l.maturity_date) : '';
  let cls = 'ln-note', head, tail = '';
  switch(l.signal){
    case 'past_due': cls += ' hot'; head = `Loan past due: matured ${when} (${loanWhen(l.months)})`; tail = 'Confirm it was not refinanced.'; break;
    case 'due_12':   cls += ' hot'; head = `Loan due ${when} (${loanWhen(l.months)})`; break;
    case 'due_24':
    case 'due_36':   cls += ' warm'; head = `Loan due ${when} (${loanWhen(l.months)})`; break;
    case 'hud_high': cls += ' refi'; head = `HUD loan at ${(+l.interest_rate).toFixed(2)}%`; tail = 'Refinance pitch.'; break;
    case 'hud_low':  cls += ' assume'; head = `HUD loan at ${(+l.interest_rate).toFixed(2)}%`; tail = 'A buyer can assume it: sale pitch.'; break;
    default:         head = `Loan matures ${when}`;
  }
  const tloRow = loans.find(x => x.source === 'tlo');
  const chk = tloRow && tloRow.tlo;
  const checked = chk ? ({match: 'TLO confirms', refi_found: 'TLO shows the refinance', extended: 'TLO shows the extension', date_differs: 'TLO dates it differently', sold: 'TLO shows a newer sale', no_due_date: 'TLO has no due date', no_record: 'TLO has nothing on file'}[chk.verdict] || '') + (chk.checked_at ? ' ' + fmtMonYr(chk.checked_at) : '') : '';
  const detail = [terms, 'per ' + src, checked, tail].filter(Boolean).join(' · ');
  const nReal = loans.filter(x => x.source !== 'tlo').length;
  const more = nReal > 1 ? ` <span class="muted">(${nReal} loans on file, see Debt)</span>` : '';
  return `<div class="${cls}"><b>${esc(head)}</b><span class="ln-note-d">${esc(detail)}</span>${more}</div>`;
}
// Debt panel on the property page: every loan on file for the building.
function loansPanel(loans){
  if(!loans || !loans.length) return '';
  const sigLab = {distress:'Default filed', past_due:'Past due', due_12:'Due in 12 mo', due_24:'Due 12-24 mo', due_36:'Due 24-36 mo', hud_high:'HUD refi', hud_low:'Cheap HUD'};
  // A CoStar date in the same month as a HUD maturity is the same loan seen twice; show it
  // once, on the HUD row, which has the terms. A TLO check only gets its own row when it
  // found a newer loan; otherwise it rides along as a line under the CoStar row.
  const hudMonths = new Set(loans.filter(l => l.source==='hud' && l.maturity_date).map(l => l.maturity_date.slice(0,7)));
  const tloRow = loans.find(l => l.source === 'tlo');
  const chk = (tloRow && tloRow.tlo) || null;
  let rows = '';
  for(const l of loans){
    if(l.source==='costar' && l.maturity_date && hudMonths.has(l.maturity_date.slice(0,7))) continue;
    if(l.source==='tlo' && !(chk && (chk.verdict==='refi_found' || chk.verdict==='extended'))) continue;
    let chip = '';
    if(l.signal) chip = `<div><span class="chip ${LOAN_SIGNAL_CLASS[l.signal]}">${esc(sigLab[l.signal])}</span></div>`;
    else if(l.superseded) chip = `<div><span class="chip status" title="A newer loan, a sale or a county record finding replaced this date">replaced</span></div>`;
    else if(l.stale) chip = `<div><span class="chip status" title="CoStar never clears a paid-off loan; this date is too old to mean anything">stale</span></div>`;
    const rate = l.interest_rate ? (+l.interest_rate).toFixed(2)+'%' : '';
    const amts = [l.balance ? fmtMoneyShort(l.balance)+' balance' : '', l.original_amount ? fmtMoneyShort(l.original_amount)+' original' : ''].filter(Boolean).join(', ');
    const noLoan = l.source==='county' && !l.lender && !l.original_amount;
    const terms = (rate || amts) ? `${esc(rate || '')}${amts?`<div class="ln-sub">${esc(amts)}</div>`:''}` : `<span class="empty">${noLoan ? 'no loan on file' : 'date only'}</span>`;
    const asGiven = l.maturity_as_given ? `<div class="ln-sub" title="The county export assumed a ${esc(String(l.term_as_given||''))} month term; a commercial loan this long is really its amortization, so the date is not used">file said ${esc(l.maturity_as_given.slice(0,4))} (${esc(String(Math.round((l.term_as_given||0)/12)))} yr term assumed, not reliable)</div>` : '';
    let src;
    if(l.source==='hud'){
      const both = loans.some(x => x.source==='costar' && x.maturity_date && x.maturity_date.slice(0,7)===(l.maturity_date||'').slice(0,7));
      src = `HUD${both ? ' + CoStar' : ''}${l.as_of?`<div class="ln-sub">as of ${esc(l.as_of)}</div>`:''}`;
    } else if(l.source==='tlo'){
      src = `TLO${tloCheckLine(chk.verdict, chk.checked_at, chk.note)}`;
    } else if(l.source==='county'){
      const fc = l.foreclosure;
      src = `County records${fc?`<div class="ln-sub ln-tlo refi" title="${esc('Trustee: '+(fc.trustee||'-')+'; borrower: '+(fc.borrower||'-'))}">${esc((FC_TYPE[fc.type]||('Filing '+(fc.type||'')))+' '+(fc.default_date||''))}${fc.auction_date?esc(', auction '+fc.auction_date):''}</div>`:''}${l.as_of?`<div class="ln-sub">as of ${esc(l.as_of)}</div>`:''}`;
    } else if(l.source==='research'){
      src = `County record${l.research_note?`<div class="ln-sub" title="${esc(l.research_note)}">${esc(l.research_note)}</div>`:''}`;
    } else {
      src = 'CoStar' + (chk && !l.superseded && chk.verdict!=='refi_found' && chk.verdict!=='extended' ? tloCheckLine(chk.verdict, chk.checked_at, chk.note) : '');
    }
    rows += `<tr>
      <td class="dt" style="white-space:nowrap">${esc(l.maturity_date||'-')}${chip}${asGiven}</td>
      <td style="white-space:nowrap">${terms}</td>
      <td>${esc(l.lender||'-')}${l.loan_program?`<div class="ln-sub" title="${esc(l.loan_program)}">${esc(l.loan_program)}</div>`:''}</td>
      <td style="white-space:nowrap">${esc(l.origination_date||'-')}</td>
      <td title="${esc(l.src_name||'')}" style="white-space:nowrap">${src}</td>
    </tr>`;
  }
  return `<div class="panel"><h2>Debt</h2>
    <table class="tx"><thead><tr><th>Matures</th><th>Terms</th><th>Lender</th><th>Originated</th><th>Source</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

// ---------- Sales Comp Report ----------
// Row-per-sale report over the NIC MAP transaction exports (sales_comps/load_sales_comps.py).
// Every filter and the sort are server-side and live in the URL hash, so a filtered view is
// bookmarkable and the browser Back button steps through filter changes.
//
// Deliberately NOT grouped into metro sections like Owner Targets: the value here is a flat,
// sortable list where one click reorders the whole set by $/unit or by date.
const scPageCache = new Map();
let scLast = null, scParams = new URLSearchParams();

// ---- comp selection ----
// Kept in localStorage rather than in the page, because picking a BOV set means filtering
// by state, then by acuity, then by period, and a selection that resets on every filter
// change would be useless. Order is preserved: the person picking is also ranking.
function scSelIds(){
  try { return JSON.parse(localStorage.getItem('compSel') || '[]'); } catch(e){ return []; }
}
function scSelSet(ids){ localStorage.setItem('compSel', JSON.stringify(ids)); }
function scSelHas(id){ return scSelIds().indexOf(id) >= 0; }
function scSelToggle(id){
  const ids = scSelIds();
  const i = ids.indexOf(id);
  if(i >= 0) ids.splice(i,1); else ids.push(id);
  scSelSet(ids);
  const row = document.querySelector(`tr[data-id="${id}"]`);
  if(row) row.classList.toggle('picked', i < 0);
  scRenderTray();
}
function scSelClear(){
  if(scSelIds().length && !confirm('Clear the whole selection?')) return;
  scSelSet([]);
  document.querySelectorAll('tr.picked').forEach(r=>r.classList.remove('picked'));
  document.querySelectorAll('.selbox').forEach(b=>b.checked=false);
  scRenderTray();
  if(scView()==='selected') scGo({view:null});
}

// 'all' rather than '' is the sentinel for no date filter, so the chip's active state and
// the URL agree (an empty value would be stripped from the hash and read back as the default).
// Defaults to Past year: Hap wants the most recent market first and widens deliberately.
const SC_PERIODS = [['1','Past year'],['3','Past 3 years'],['5','Past 5 years'],['all','All time']];
// Quality presets. "Clean" is the set that survives a buyer's analyst: confirmed price,
// arms length, single asset. It is the default because an unflagged comp is the only kind
// worth putting in front of a seller without a caveat.
// Everything is first and is the default: Hap wants to see the whole set on arrival and
// narrow deliberately, rather than land on a filtered view he has to remember is filtered.
const SC_QUALITY = [
  ['all',    'Everything',   'Every recorded sale including portfolio allocations and unconfirmed prices. This is the default.'],
  ['clean',  'Clean only',   'Grade A: confirmed price, arms length, not a portfolio allocation'],
  ['ab',     'A + B',        'Adds usable comps that may draw a question'],
  ['arms',   'Arms length',  'Any grade, but excludes related-party and internal recapitalizations'],
  ['review', 'Needs review', 'Prices outside the plausible band (under $50k or over $1MM per unit), a portfolio total stamped on each property, or statistically extreme for their acuity. Confirm and fix these.'],
];

function scQualityToApi(q){
  if(q==='clean') return {grades:'A'};
  if(q==='ab')    return {grades:'A,B'};
  if(q==='arms')  return {arms_only:'1', no_portfolio:'1'};
  if(q==='review') return {needs_review:'1'};
  return {};
}

// Which of the three tables is showing. All three share one filter bar, because "who
// bought AL in Colorado in the last 3 years" is the same filter as "what AL sold in
// Colorado in the last 3 years", just aggregated differently.
const SC_VIEWS = [
  ['deals',   'Deals',   'One row per closed sale'],
  ['buyers',  'Buyers',  'Who is buying, with contacts and portfolio from your ownership data'],
  ['sellers', 'Sellers', 'Who has been selling. A group that has sold repeatedly is demonstrably willing to trade'],
  ['brokers', 'Brokers', 'Which brokerages are named on the sell side'],
  ['map',     'Map',     'Every matching deal plotted geographically'],
];
function scView(p){ return (p || scParams).get('view') || 'deals'; }

function scApiQuery(p, extra){
  const qp = new URLSearchParams();
  for(const k of ['state','classes','q','sort','dir','offset','needs_review','built_min','built_max']){
    const v = p.get(k); if(v) qp.set(k, v);
  }
  // Period defaults to 3 years. NIC MAP price confidence collapses before 2023, so the
  // trailing-3 window is also where the data is actually defensible.
  const years = p.has('years') ? p.get('years') : '1';
  if(years && years !== 'all') qp.set('years', years);
  const qual = scQualityToApi(p.has('quality') ? p.get('quality') : 'all');
  for(const k in qual) qp.set(k, qual[k]);
  for(const k in (extra||{})) qp.set(k, extra[k]);
  return qp;
}

// Rewrite the hash, always resetting to page 1 unless the caller is explicitly paging.
function scGo(changes, keepOffset){
  const p = new URLSearchParams(scParams.toString());
  for(const k in changes){
    const v = changes[k];
    if(v===null || v==='') p.delete(k); else p.set(k, v);
  }
  if(!keepOffset) p.delete('offset');
  location.hash = 'salescomps' + (p.toString() ? '?'+p.toString() : '');
}
function scSetPage(off){ scGo({offset: off || null}, true); }

// Read both year boxes at once, so typing a "from" and tabbing to "to" does not fire a
// query against a half-entered range.
function scApplyBuilt(){
  const lo = (document.getElementById('b-min')||{}).value || '';
  const hi = (document.getElementById('b-max')||{}).value || '';
  if(lo === (scParams.get('built_min')||'') && hi === (scParams.get('built_max')||'')) return;
  scGo({built_min: lo || null, built_max: hi || null});
}
function scToggleClass(cls){
  let cur = (scParams.get('classes')||'').split(',').filter(Boolean);
  if(cur.includes('all')) cur = [];          // leaving All starts a fresh selection
  const i = cur.indexOf(cls);
  if(i>=0) cur.splice(i,1); else cur.push(cls);
  // Clearing the last chip returns to the IL/AL/MC default rather than to everything.
  scGo({classes: cur.join(',') || null});
}
// Switching view drops the sort: the three tables have different columns, and carrying
// sort=date into Buyers would silently fall back to the server default with the header
// arrow pointing at nothing.
function scSetView(v){ scGo({view: v==='deals'?null:v, sort:null, dir:null}); }

// Clicking the sorted column flips direction; a new column starts descending, except the
// text columns where A-Z is the useful first press.
function scSort(col, defSort){
  const curSort = scParams.get('sort') || defSort || 'date';
  const curDir = scParams.get('dir') || 'desc';
  const dir = curSort===col ? (curDir==='desc'?'asc':'desc') : (['name','city','buyer'].includes(col)?'asc':'desc');
  scGo({sort: col, dir: dir});
}

const SC_ENDPOINT = {deals:'/api/salescomps', selected:'/api/salescomps', buyers:'/api/buyers', sellers:'/api/sellers', brokers:'/api/brokers'};

// Cache key must include the endpoint, or switching Deals -> Buyers under identical
// filters would serve the deals payload back to the buyers renderer.
function scCacheKey(p, extra){
  return (SC_ENDPOINT[scView(p)] || SC_ENDPOINT.deals) + '?' + scApiQuery(p, extra).toString();
}

async function scFetch(p, extra){
  const key = scCacheKey(p, extra);
  if(!extra && scPageCache.has(key)) return scPageCache.get(key);
  const d = await getJSON(key);
  if(!extra) scPageCache.set(key, d);
  return d;
}

// Rounded: Dee's values carry full float precision (a $/unit of 741496.6530612245), where
// NIC MAP's arrived pre-rounded. Cents on a price per unit are noise.
function scMoney(n){ return n==null ? '<span class="empty">-</span>' : '$'+Math.round(Number(n)).toLocaleString(); }

async function renderSalesComps(p){
  scParams = p;
  const view = scView(p);
  if(!scPageCache.has(scCacheKey(p))) app.innerHTML = '<div class="spinner">Loading sale comps...</div>';
  const d = await scFetch(p);
  scLast = d;

  const head = scHeadHTML(p, d, view);
  if(view === 'selected') return scRenderSelected(p, d, head);
  if(view === 'buyers')  return scRenderParty(p, d, head, 'buyers', 'Buyer');
  if(view === 'sellers') return scRenderParty(p, d, head, 'sellers', 'Seller');
  if(view === 'brokers') return scRenderBrokers(p, d, head);
  if(view === 'map') return scRenderMap(p, d, head);
  return scRenderDeals(p, d, head);
}

// Filter bar + view toggle, shared by all three tables.
function scHeadHTML(p, d, view){
  const state = p.get('state') || '';
  const classes = (p.get('classes')||'').split(',').filter(Boolean);
  const years = p.has('years') ? p.get('years') : '1';
  const quality = p.has('quality') ? p.get('quality') : 'all';
  const sort = d.sort || 'date', dir = d.dir || 'desc';

  const total = d.total || 0;
  const SUBS = {
    deals:   `Closed senior housing sales, one row per deal, drawn from NIC MAP plus Dee's Magical research &#10024;: recorded deeds, affidavits of property value, press releases, Senior Care Investor and REIT supplements. Click any column heading to sort. <b>${num(total)}</b> deal${total===1?'':'s'} match the current filter.`,
    buyers:  `Who is buying, aggregated from the same filtered deals. Contacts and portfolio counts come from your own ownership data, not from NIC MAP. <b>${num(total)}</b> buyer${total===1?'':'s'}.`,
    sellers: `Who has been selling, aggregated from the same filtered deals. Rolled up on the true seller where it is known, so a propco SPE groups under its parent. <b>${num(total)}</b> seller${total===1?'':'s'}.`,
    selected: `The comps you have picked for a BOV, in the order you picked them. Review, drop any that do not belong, then download a workbook for Rachel.`,
    brokers: `Brokerages named on the sell side. NIC MAP names a broker on only <b>${d.all_deals?Math.round(100*d.named/d.all_deals):0}%</b> of these deals (${num(d.named||0)} of ${num(d.all_deals||0)}), so this ranks who is visible in the data, not true market share.`,
    map: `Every deal in the current filter that has a location on file, plotted on one map. <b>${num(total)}</b> deal${total===1?'':'s'} match; NIC MAP supplies coordinates for the large majority of them.`,
  };

  let head = `<div class="cl-head"><h1>&#128200; Sales Comp Report</h1>
    <a class="navlink" style="padding:5px 11px;font-size:13px" onclick="location.hash='comp/new'" title="Enter a comp that closed but has not shown up in NIC MAP or Dee's research yet">+ Add Comp</a>
    ${total?`<a class="navlink" style="padding:5px 11px;font-size:13px" onclick="exportSalesCompsCSV()">Download CSV</a>`:''}
  </div>`;

  // ---- view toggle
  head += `<div class="cl-cats" style="margin-bottom:2px"><span class="lbl">View:</span>`;
  for(const [v,label,tip] of SC_VIEWS){
    head += `<span class="catchip ${view===v?'active':''}" onclick="scSetView('${v}')" title="${esc(tip)}">${label}</span>`;
  }
  const nSel = scSelIds().length;
  if(nSel || view==='selected'){
    head += `<span class="catchip ${view==='selected'?'active':''}" onclick="scSetView('selected')" title="The comps you have picked for a BOV">Selected<span class="ct">${nSel}</span></span>`;
  }
  head += `</div><div class="cl-sub">${SUBS[view]||SUBS.deals}</div>
    <div class="betaline"><span class="betatag">Beta</span>
      Built by Hap and Dee, for Hap and Dee. Numbers move as we confirm them, so check the
      source badge before you quote one. Found something wrong? That is the feature working:
      open the comp and fix it.</div>`
    + (view === 'deals' ? compFooterHTML() : '');

  // ---- filter chips
  head += `<div class="cl-cats"><span class="lbl">State:</span>
    <span class="catchip ${state?'':'active'}" onclick="scGo({state:null})">All</span>`;
  for(const s of (d.states||[])){
    head += `<span class="catchip ${state===s.state?'active':''}" onclick="scGo({state:'${esc(s.state)}'})">${esc(s.state)}<span class="ct">${s.count}</span></span>`;
  }
  head += `</div>`;

  // Acuity options and their counts come from the server so the chip labels, the counts
  // and the SQL can never drift apart. No explicit selection means IL/AL/MC.
  const acuityDefault = d.acuity_default || 'ILALMC';
  const showAll = classes.includes('all');
  head += `<div class="cl-cats"><span class="lbl">Acuity:</span>`;
  for(const a of (d.acuity||[])){
    const on = showAll ? false
      : (classes.length ? classes.includes(a.key) : a.key === acuityDefault);
    head += `<span class="catchip ${on?'active':''}" onclick="scToggleClass('${esc(a.key)}')" title="${esc(a.hint||'')}">${esc(a.label)}<span class="ct">${a.count}</span></span>`;
  }
  head += `<span class="catchip ${showAll?'active':''}" onclick="scGo({classes:'all'})" title="Every acuity including skilled nursing and CCRC">All<span class="ct">${d.acuity_all||0}</span></span>`;
  head += `</div>`;

  head += `<div class="cl-cats"><span class="lbl">Sold:</span>`;
  for(const [v,label] of SC_PERIODS){
    head += `<span class="catchip ${years===v?'active':''}" onclick="scGo({years:'${v}'})">${label}</span>`;
  }
  head += `</div>`;

  // Year built. A range and not chips, because the useful band depends on the subject:
  // comparing a 2019 build wants 2015+, comparing a 1970s box wants something else.
  const bMin = p.get('built_min') || '', bMax = p.get('built_max') || '';
  const bAll = !bMin && !bMax;
  head += `<div class="cl-cats"><span class="lbl">Built:</span>
    <span class="catchip ${bAll?'active':''}" onclick="scGo({built_min:null,built_max:null})">All</span>
    <span class="catchip" style="cursor:default;padding-left:4px;padding-right:4px;background:none;border:none">
      <input id="b-min" type="number" min="1800" max="2100" placeholder="from" value="${esc(bMin)}"
        style="width:62px;background:var(--panel);border:1px solid ${bAll?'var(--line)':'var(--accent)'};border-radius:5px;color:inherit;padding:4px 6px;font-size:12.5px"
        onkeydown="if(event.key==='Enter'){event.preventDefault();scApplyBuilt()}" onblur="scApplyBuilt()">
      <span class="muted" style="margin:0 3px">to</span>
      <input id="b-max" type="number" min="1800" max="2100" placeholder="to" value="${esc(bMax)}"
        style="width:62px;background:var(--panel);border:1px solid ${bAll?'var(--line)':'var(--accent)'};border-radius:5px;color:inherit;padding:4px 6px;font-size:12.5px"
        onkeydown="if(event.key==='Enter'){event.preventDefault();scApplyBuilt()}" onblur="scApplyBuilt()">
    </span>
    ${bAll?'':`<span class="muted" style="font-size:11px">comps with no year on record are excluded</span>`}
  </div>`;

  head += `<div class="cl-cats"><span class="lbl">Quality:</span>`;
  for(const [v,label,tip] of SC_QUALITY){
    head += `<span class="catchip ${quality===v?'active':''}" onclick="scGo({quality:'${v}'})" title="${esc(tip)}">${label}</span>`;
  }
  head += `</div>`;

  head += `<div class="cl-cats"><span class="lbl">Find:</span>
    <input id="scq" placeholder="property, city, buyer, seller or operator"
      value="${esc(p.get('q')||'')}"
      style="background:var(--panel);border:1px solid var(--line);border-radius:5px;color:inherit;padding:5px 9px;width:290px;font-size:13px"
      onkeydown="if(event.key==='Enter'){event.preventDefault();scGo({q:this.value})}"
      onblur="if(this.value!==(scParams.get('q')||''))scGo({q:this.value})"></div>`;

  // ---- summary over the whole filtered set, not just this page (Deals view only:
  // on the rollups the per-row medians already carry this and a second set would confuse)
  const st = d.stats || {};
  if(st.unit || st.bed){
    head += `<div class="sc-stats">`;
    if(st.unit){
      head += `<div><div class="k">Per unit (n=${st.unit.n})</div><div class="v">${scMoney(st.unit.median)}</div></div>
        <div><div class="k">25th to 75th</div><div class="v" style="font-size:13px">${scMoney(st.unit.p25)} to ${scMoney(st.unit.p75)}</div></div>
        <div><div class="k">High</div><div class="v">${scMoney(st.unit.max)}</div></div>`;
    }
    // Nursing trades are quoted per bed. Kept as its own block so a $/bed median can never
    // be read as, or averaged into, a $/unit median.
    if(st.bed){
      head += `<div><div class="k">Per bed, SNF (n=${st.bed.n})</div><div class="v">${scMoney(st.bed.median)}</div></div>
        <div><div class="k">25th to 75th</div><div class="v" style="font-size:13px">${scMoney(st.bed.p25)} to ${scMoney(st.bed.p75)}</div></div>`;
    }
    head += `</div>`;
  }

  return head;
}

// Sortable column heading, shared by all three tables.
function scTh(d, defSort, col, label, extra){
  const sort = d.sort || defSort, dir = d.dir || 'desc';
  const arrow = dir==='desc' ? ' &#9660;' : ' &#9650;';
  return `<th class="sortable ${sort===col?'sorted':''} ${extra||''}" onclick="scSort('${col}','${defSort}')">${label}${sort===col?arrow:''}</th>`;
}
function scEmpty(head, msg){
  app.innerHTML = head + `<div class="empty-msg">${msg}</div>`;
  window.scrollTo(0,0);
}

function scRenderDeals(p, d, head){
  const rows = d.comps || [];
  const total = d.total || 0;
  const limit = d.limit || 50;
  const curOffset = d.offset || 0;
  if(!rows.length) return scEmpty(head, 'No sale comps match this filter. Try widening the period or the quality setting.');

  const th = (col,label,extra) => scTh(d, 'date', col, label, extra);
  const pager = pagerHTML(curOffset, rows.length, total, limit, 'scSetPage');
  let html = head + pager + `<div class="panel scwrap" style="margin-top:0"><table class="sc">
    <thead><tr>
      <th title="Tick comps to build a set for a BOV"><input type="checkbox" class="selbox" onclick="scSelPage(this.checked)"></th>
      ${th('date','Sold')}
      ${th('name','Property')}
      ${th('city','City')}
      <th>ST</th>
      <th>Acuity</th>
      ${th('units','Size','n')}
      <th>IL / AL / MC</th>
      ${th('built','Built','n')}
      ${th('price','Price','n')}
      ${th('ppu','$ / Unit','n')}
      <th class="n">Cap</th>
      ${th('buyer','Buyer')}
      <th>Seller</th>
      <th>Seller Broker</th>
      ${th('grade','Gr')}
    </tr></thead><tbody>`;

  for(const r of rows){
    const acuity = r.asset_class
      ? `<span class="chip ${esc(r.asset_class)}" title="${esc(r.asset_label||'')}">${esc(ASSET_SHORT[r.asset_class]||r.asset_class)}</span>`
      : '<span class="empty">-</span>';
    // The name opens the COMP profile, not the property page. In a comp report the deal
    // is the subject; the profile links onward to the property record.
    let fs = {};
    try { fs = JSON.parse(r.field_sources||'{}'); } catch(e) {}
    const deeFields = Object.values(fs).filter(v=>v==='dee').length;
    const costarFields = Object.values(fs).filter(v=>v==='costar').length;
    const name = `<a onclick="location.hash='comp/${esc(r.id)}'" style="cursor:pointer">${esc(r.comp_name||'')}</a>`

      ? scMoney(r.ppu) + (r.ppu_basis==='bed' ? '<span class="muted" style="font-size:10px"> /bed</span>' : '')

    // A price outside the plausible band is a data problem, so it gets its own loud

    const review = (r.flags||[]).filter(f=>NEEDS_REVIEW.includes(f));

      <td>${esc(r.comp_state||'')}</td>
      <td>${acuity}</td>
      <td class="n">${size}</td>
      <td class="n muted">${mix}</td>
      <td class="n">${r.year_built_at_sale||'<span class="empty">-</span>'}</td>
      <td class="n">${scMoney(r.close_price)}</td>
      <td class="n"><b>${ppu}</b></td>
      <td class="n">${cap}</td>
      <td class="wide">${(r.buyer_entity_id && !window.COMPS_ONLY && r.buyer_name)
        ? `<a onclick="location.hash='entity/${esc(r.buyer_entity_id)}'" style="cursor:pointer">${esc(r.buyer_name)}</a>`
        : (esc(r.buyer_name||'')||'<span class="empty">-</span>')}</td>
      <td class="wide">${(r.seller_entity_id && !window.COMPS_ONLY && r.seller_name)
        ? `<a onclick="location.hash='entity/${esc(r.seller_entity_id)}'" style="cursor:pointer">${esc(r.seller_name)}</a>`
        : (esc(r.seller_name||'')||'<span class="empty">-</span>')}</td>
      <td class="wide">${esc(r.seller_broker||'')||'<span class="empty">-</span>'}</td>
      <td>${grade}</td>
    </tr>`;
  }
  html += `</tbody></table></div>` + pager + `<div id="seltray"></div>`;
  app.innerHTML = html;
  scRenderTray();
  window.scrollTo(0,0);

  // Prefetch the neighbouring pages so a real Prev/Next click resolves from cache.
  const warm = off => scFetch(p, {offset: off}).then(r => scPageCache.set(scCacheKey(p, {offset: off}), r));
  if(curOffset+limit < total) warm(curOffset+limit);
  if(curOffset > 0) warm(Math.max(0, curOffset-limit));
}

// Tick or untick every comp on the current page.
function scSelPage(on){
  const ids = scSelIds();
  document.querySelectorAll('table.sc tbody tr[data-id]').forEach(tr=>{
    const id = tr.getAttribute('data-id');
    const i = ids.indexOf(id);
    if(on && i < 0) ids.push(id);
    if(!on && i >= 0) ids.splice(i,1);
    tr.classList.toggle('picked', on);
    const box = tr.querySelector('.selbox'); if(box) box.checked = on;
  });
  scSelSet(ids);
  scRenderTray();
}

// Sticky tray. Only appears once something is picked, so it costs nothing when unused.
function scRenderTray(){
  const el = document.getElementById('seltray');

  if(!ids.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="seltray">

// Live medians for the picked set, so the number moves as comps go in and out.
async function scTrayStats(ids){
  const box = document.getElementById('selstat');
  if(!box) return;
  const d = await getJSON('/api/salescomps?limit=100000&years=&grades=&classes=all');
  const chosen = (d.comps||[]).filter(c=>ids.indexOf(c.id)>=0);
  const ppu = chosen.map(c=>c.price_per_unit).filter(Boolean).sort((a,b)=>a-b);
  const ppb = chosen.map(c=>c.price_per_bed).filter(Boolean).sort((a,b)=>a-b);
  const med = a => a.length ? (a.length%2 ? a[(a.length-1)/2] : (a[a.length/2-1]+a[a.length/2])/2) : null;
  const bits = [];
  if(ppu.length) bits.push(`median <b>${scMoney(med(ppu))}</b>/unit (n=${ppu.length}), range ${scMoney(ppu[0])} to ${scMoney(ppu[ppu.length-1])}`);
  if(ppb.length) bits.push(`median <b>${scMoney(med(ppb))}</b>/bed (n=${ppb.length})`);
  box.innerHTML = bits.join(' &middot; ');
}

async function scExportSelected(){
  const ids = scSelIds();
  if(!ids.length){ alert('Nothing selected yet.'); return; }
  const subjEl = document.getElementById('bov-subject');
  const body = {ids, user: (typeof compUser==='function' ? compUser() : ''),
                subject: subjEl ? subjEl.value : '',
                filter_note: describeCompFilter()};
  let r;
  try {
    r = await fetch('/api/comps/export', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  } catch(e){
    alert('Could not reach the server. Is it still running?\n\n' + e); return;
  }
  if(!r.ok){
    // Say what actually went wrong. A bare "Export failed" sent Hap back to me with a
    // screenshot for what was only a server running code older than the route.
    let msg = '';
    try { msg = (await r.json()).error || ''; } catch(e){ /* error page, not JSON */ }
    if(r.status === 404){
      msg = 'This server does not have the export endpoint yet.\n\n'
          + 'It is running code from before the feature was added. Restart it and try again.';
    } else if(!msg){
      msg = `The server returned ${r.status} ${r.statusText || ''}`.trim();
    }
    alert('Export failed.\n\n' + msg);
    return;
  }
  const blob = await r.blob();
  const cd = r.headers.get('Content-Disposition') || '';
  const m = cd.match(/filename="([^"]+)"/);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = m ? m[1] : 'Sale_Comps.xlsx';
  a.click();
  URL.revokeObjectURL(a.href);
}

// Human-readable summary of the filters in play, stamped onto the sheet so whoever opens
// it knows what the set was drawn from.
function describeCompFilter(){
  const p = scParams;
  const bits = [];
  if(p.get('state')) bits.push(p.get('state'));
  const cls = p.get('classes');
  bits.push(cls ? cls.replace(/_ONLY/g,' only').replace(/ILALMC/,'IL/AL/MC').replace(/,/g,' + ') : 'IL/AL/MC');
  const y = p.has('years') ? p.get('years') : '1';
  bits.push(y==='all' ? 'all time' : `past ${y} year${y==='1'?'':'s'}`);
  const bl = p.get('built_min'), bh = p.get('built_max');
  if(bl || bh) bits.push(`built ${bl||'any'} to ${bh||'any'}`);
  const q = p.has('quality') ? p.get('quality') : 'all';
  bits.push({all:'all quality', clean:'grade A only', ab:'grade A and B',
             arms:'arms length only', review:'needs review'}[q] || q);
  if(p.get('q')) bits.push(`search "${p.get('q')}"`);
  return bits.join(', ');
}

// ---- Comp profile ----
// Every value carries the badge of whichever source won it. Where sources disagree, the
// losing value is printed underneath rather than hidden, so a number can always be argued
// with. Precedence is set server-side in sales_comps/comp_profile.py.
const SRC_LABEL = {dee:'Dee', nicmap:'NIC MAP', manual:'Entered by hand', costar:'CoStar'};
// Flags that mean "this number is probably wrong, go confirm it", as opposed to flags that
// merely describe the deal (portfolio, related party).
const NEEDS_REVIEW = ['price_below_band','price_above_band','price_outlier','price_is_deal_total'];
function srcBadge(s, conflict){
  if(!s) return '';
  return `<span class="src ${esc(s)}" title="${conflict?'Sources disagree on this value':'Source of this value'}">${esc(SRC_LABEL[s]||s)}</span>`
       + (conflict ? `<span class="src conflict" title="Another source reports a materially different value">&#9888;</span>` : '');
}
function fmtVal(v, kind){
  if(v===null || v===undefined || v==='') return '<span class="empty">-</span>';
  const n = Number(v);
  if(kind==='money'  && !isNaN(n)) return '$'+Math.round(n).toLocaleString();
  if(kind==='money2' && !isNaN(n)) return '$'+n.toLocaleString(undefined,{maximumFractionDigits:2});
  if(kind==='pct'    && !isNaN(n)) return (n<=1.5 ? (n*100).toFixed(2) : n.toFixed(2))+'%';
  if(kind==='num2'   && !isNaN(n)) return n.toLocaleString(undefined,{maximumFractionDigits:2});
  if(kind==='year'   && !isNaN(n)) return String(Math.round(n));   // 2021, never "2,021"
  if(kind==='int'    && !isNaN(n)) return Math.round(n).toLocaleString();
  if(kind==='flag') return n ? 'Yes' : 'No';
  return esc(v);
}

const ADDCOMP_CLASSES = [['AL','Assisted Living'],['IL','Independent Living'],

function renderAddComp(){
  const back = `<a class="back" onclick="history.back()">&larr; Back to results</a>`;
  const who = SIGNED_IN
