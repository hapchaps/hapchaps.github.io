function collectAddComp(){
  const v = id => (document.getElementById(id).value || '').trim();
  const n = id => v(id) === '' ? null : Number(v(id));
  return {
    user: SIGNED_IN ? SIGNED_IN.name : v('ac-who'),
    comp_name: v('ac-name'), comp_address: v('ac-address'), comp_city: v('ac-city'),
    comp_state: v('ac-state').toUpperCase(), comp_zip: v('ac-zip'),
    asset_class: v('ac-class'), care_type: v('ac-care'),
    units_at_sale: n('ac-units'), year_built_at_sale: n('ac-built'),
    il_at_sale: n('ac-il'), al_at_sale: n('ac-al'), mc_at_sale: n('ac-mc'), nc_at_sale: n('ac-nc'),
    close_date: v('ac-date'), close_price: n('ac-price'),
    buyer_name: v('ac-buyer'), seller_name: v('ac-seller'), seller_broker: v('ac-broker'),
    cap_rate: n('ac-cap') !== null ? n('ac-cap') / 100 : null,
    note: v('ac-note'),
  };
}

async function submitAddComp(btn, force){
  const payload = collectAddComp();
  if(!payload.comp_name){ alert('Property name is required.'); document.getElementById('ac-name').focus(); return; }
  if(!payload.comp_state){ alert('State is required.'); document.getElementById('ac-state').focus(); return; }
  if(force) payload.force = true;
  btn.disabled = true;
  const r = await fetch('/api/comps/new', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)});
  const j = await r.json().catch(()=>({}));
  btn.disabled = false;
  if(r.status === 409 && j.error === 'possible_duplicate'){
    // core_transactions.source uses its own vocabulary (nicmap_tx, dee, manual, costar_alert),
    // distinct from the per-field source badges (nicmap, dee, manual, costar) SRC_LABEL
    // exists for. 'costar_alert' (not bare 'costar') because that string is already used by
    // the ownership pipeline's bulk last-sale rows, which never reach this dupe check.
    const TX_SRC_LABEL = {nicmap_tx:'NIC MAP', dee:'Dee', manual:'Entered by hand', costar_alert:'CoStar'};
    const rows = (j.duplicates||[]).map(d =>
      `<div>&middot; <a onclick="location.hash='comp/${esc(d.id)}'">${esc(d.comp_name)}</a>`
      + `${d.comp_city?', '+esc(d.comp_city):''} &middot; ${esc((d.close_date||'').slice(0,10))}`
      + `${d.close_price?' &middot; $'+Number(d.close_price).toLocaleString():''} <span class="src ${esc(d.source)}">${esc(TX_SRC_LABEL[d.source]||d.source)}</span></div>`).join('');
    document.getElementById('ac-dupe').innerHTML =
      `<div class="prof-alt" style="border:1px solid var(--warn);border-radius:6px;padding:8px 10px;margin-bottom:10px;font-size:12.5px">
        <b style="color:var(--warn)">This might already be on file:</b>${rows}
        <div style="margin-top:6px"><a onclick="submitAddComp(document.querySelector('.contact-form .btn'), true)">Add it anyway</a></div>
      </div>`;
    return;
  }
  if(!r.ok){ alert(j.error||'Could not add comp'); return; }
  scPageCache.clear();
  location.hash = 'comp/'+j.id;
}

async function renderCompProfile(id){
  app.innerHTML = '<div class="spinner">Loading comp profile...</div>';
  const d = await getJSON('/api/comp/'+encodeURIComponent(id));
  if(!d || d.error){ app.innerHTML = '<div class="empty-msg">Comp not found.</div>'; return; }
  const t = d.transaction || {};
  trackRecentlyViewed('comp', id, t.comp_name || '(unnamed comp)',
    [t.comp_city, t.comp_state].filter(Boolean).join(', '));

  const back = `<a class="back" onclick="history.back()">&larr; Back to results</a>`;
  const acuity = t.asset_class
    ? `<span class="chip ${esc(t.asset_class)}" title="${esc(d.asset_label||'')}">${esc(ASSET_SHORT[t.asset_class]||t.asset_class)}</span>` : '';
  const grade = t.comp_grade ? `<span class="grade ${esc(t.comp_grade)}">${esc(t.comp_grade)}</span>` : '';
  const flags = (d.flags||[]).length
    ? `<span class="muted" style="font-size:12px">&#9888; ${esc(d.flags.join(', ').replace(/_/g,' '))}</span>` : '';

  let html = back + `<div class="dhead">
    <h1>${esc(t.comp_name||'(unnamed comp)')} ${acuity} ${grade}</h1>
    <div class="addr">${[t.comp_address, [t.comp_city,t.comp_state].filter(Boolean).join(', '), t.comp_zip].filter(Boolean).map(esc).join(' &middot; ')}</div>
    <div class="meta">Sold ${esc((t.close_date||'').slice(0,10))}
      ${t.close_price?' &middot; '+'$'+Number(t.close_price).toLocaleString():''}
      ${t.units_at_sale?' &middot; '+t.units_at_sale+' units':''} ${flags}</div>
    ${window.COMPS_ONLY ? '' : (t.property_id
      ? `<div class="meta"><a onclick="location.hash='property/${esc(t.property_id)}'" style="cursor:pointer">View property record${d.property_name?': '+esc(d.property_name):''}</a></div>`
      : '<div class="meta muted">Not matched to a property in the database</div>')}
  </div>`;

  // who is editing. No auth here, so identity is a stated choice kept in localStorage;
  // it is recorded on every edit and confirmation so provenance survives.
  html += `<div class="whoami" style="margin:6px 0 10px">Editing as
    ${SIGNED_IN
      ? `<b>${esc(SIGNED_IN.name)}</b>${SIGNED_IN.admin?' <span class="src dee">admin</span>':''}`
      : `<select id="whoami" onchange="compSetUser(this.value)">
          ${COMP_USERS.map(u=>`<option value="${esc(u)}"${compUser()===u?' selected':''}>${esc(u)}</option>`).join('')}
        </select>`}
    <span class="muted">Edits outrank Dee and NIC MAP, and can be cleared to fall back.</span></div>`;

  // sections of preferred values, each badged with its winning source
  html += `<div class="prof-grid">`;
  for(const sec of (d.sections||[])){
    let rows = '';
    for(const f of sec.fields){
      // a false flag with no source is just an absent fact, not a data point
      if(f.kind==='flag' && !Number(f.value)) continue;
      rows += compFieldRow(id, f, t);
      if(f.conflict){
        const others = (f.sources||[]).slice(1).map(o =>
          `<b>${esc(SRC_LABEL[o.source]||o.source)}</b> says ${fmtVal(o.value_num!=null?o.value_num:o.value_text, f.kind)}`).join(' &middot; ');
        if(others) rows += `<div class="prof-alt">${others}</div>`;
      }
      if(f.confirmed_stale){
        rows += `<div class="prof-alt"><b>Confirmation is stale</b> &middot; ${esc(f.confirmed_by)} confirmed ${fmtVal(f.confirmed_value, f.kind)}, which has since changed</div>`;
      }
    }
    if(rows) html += `<div class="panel"><h2>${esc(sec.title)}</h2>${rows}</div>`;
  }
  html += `</div>`;

  // add a field: catalog entries with no value yet, plus a free-form custom field
  const opts = (d.addable||[]).map(a=>`<option value="${esc(a.field)}">${esc(a.label)} (${esc(a.section)})</option>`).join('');
  html += `<div class="panel"><h2>Add a Field</h2><div class="addfield">
      <select id="addf-field" onchange="document.getElementById('addf-custom').style.display = this.value==='__custom__' ? '' : 'none'">${opts||''}<option value="__custom__">Custom field...</option></select>
      <input id="addf-custom" placeholder="Custom field name" style="display:none;width:170px">
      <input id="addf-value" placeholder="Value" style="width:170px">
      <a class="navlink" style="padding:4px 11px;font-size:12.5px" onclick="compAddField('${esc(id)}')">Add</a>
    </div>
    <div class="prof-alt" style="margin-top:6px">Added values are recorded against your name and outrank both feeds.</div>
  </div>`;

  // economic scenarios side by side. A cap rate without its basis is meaningless, so the
  // label column is never optional here.
  if((d.scenarios||[]).length){
    const ms = d.metrics||[];
    let hdr = '<tr><th>Metric</th>' + d.scenarios.map(s=>`<th>${esc(s.label)}${srcBadge(s.source)}</th>`).join('') + '</tr>';
    let body = '';
    for(const m of ms){
      if(!d.scenarios.some(s => s[m.key]!=null)) continue;
      body += `<tr><td>${esc(m.label)}</td>` +
        d.scenarios.map(s=>`<td>${fmtVal(s[m.key], m.kind)}</td>`).join('') + '</tr>';
    }
    html += `<div class="panel"><h2>Economic Scenarios</h2>
      <div class="scwrap"><table class="scn"><thead>${hdr}</thead><tbody>${body}</tbody></table></div>
      <div class="prof-alt" style="margin-top:7px">Trailing actuals and pro forma are shown separately on purpose. The same building can read a 1.7% cap on T-12 and 8.6% on pro forma.</div>
    </div>`;
  }

  // Full audit trail, newest first. Only human actions appear here: loader writes would
  // bury the handful of real decisions under thousands of feed rows.
  const hist = d.history || [];
  if(hist.length){
    const labels = d.field_labels || {};
    let rows = '';
    for(const h of hist){
      const lbl = labels[h.field] || (h.field.startsWith('custom:') ? h.field.slice(7) : h.field);
      // Confirm actions do not change the value, so an old -> new arrow would misread as an
      // edit. They describe what was vouched for instead.
      let from = '', to;
      if(h.action==='confirm'){
        to = `vouched for ${h.new_value!=null&&h.new_value!==''?esc(h.new_value):'this value'}`;
      } else if(h.action==='unconfirm'){
        to = `<span class="muted">confirmation removed</span>`;
      } else {
        from = h.old_value!=null && h.old_value!=='' ? `<span class="hist-old">${esc(h.old_value)}</span> &rarr; ` : '';
        to = h.new_value!=null && h.new_value!=='' ? esc(h.new_value) : '<span class="empty">value cleared</span>';
      }
      rows += `<tr>
        <td class="dt" data-sort="${esc(h.changed_at||'')}" title="${esc(fmtWhen(h.changed_at))}">${esc(relWhen(h.changed_at))}</td>
        <td><b>${esc(h.changed_by)}</b></td>
        <td><span class="act ${esc(h.action)}">${esc(h.action)}</span></td>
        <td>${esc(lbl)}</td>
        <td>${from}${to}${h.new_source&&h.new_source!=='manual'?srcBadge(h.new_source):''}</td>
        <td class="muted">${esc(h.note||'')}</td>
      </tr>`;
    }
    html += `<div class="panel"><h2>Edit History <span class="muted" style="font-weight:400;font-size:12px">${hist.length} change${hist.length===1?'':'s'}</span></h2>
      <div class="scwrap"><table class="hist">
        <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Field</th><th>Value</th><th>Note</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>`;
  }

  if(d.notes) html += `<div class="panel"><h2>Analyst Notes</h2><div class="notebox">${esc(d.notes)}</div></div>`;
  if(d.extra) html += `<div class="panel"><h2>Additional Research</h2><div class="notebox muted">${esc(d.extra)}</div></div>`;

  app.innerHTML = html;
  window.scrollTo(0,0);
}

// ---- profile editing ----
// There is no login on this app, so identity is a stated choice rather than an
// authenticated one. It is stored per browser and stamped on every edit and confirmation,
// which is enough for two people who trust each other to see who touched what.
// Who edits get attributed to. On the hosted app this comes from the signed-in session, so
// it cannot be spoofed by picking a different name from a dropdown. Locally, where there is
// no login, it falls back to a picker.
const COMP_USERS = ['Hap','Dee','Rachel'];
let SIGNED_IN = null;
function compUser(){
  if(SIGNED_IN && SIGNED_IN.name) return SIGNED_IN.name;
  return localStorage.getItem('compUser') || COMP_USERS[0];
}
function compSetUser(u){ localStorage.setItem('compUser', u); }
async function loadSignedInUser(){
  try {
    const r = await fetch('/api/me');
    if(r.ok) SIGNED_IN = await r.json();
  } catch(e){ /* local app has no /api/me; the picker stays */ }
}

// Timestamps are stored UTC; shown in local time because that is the only clock the reader
// is holding. relWhen keeps rows scannable, fmtWhen gives the exact moment on hover.
function fmtWhen(iso){
  if(!iso) return '';
  const d = new Date(iso.endsWith('Z')?iso:iso+'Z');
  return isNaN(d) ? iso : d.toLocaleString();
}
function relWhen(iso){
  if(!iso) return '';
  const d = new Date(iso.endsWith('Z')?iso:iso+'Z');
  if(isNaN(d)) return iso;
  const s = Math.max(0,(Date.now()-d.getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<86400*30) return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString();
}

// The comp's own buyer_entity_id/seller_entity_id are set at ingest against t.buyer_name/
// t.seller_name specifically -- if a later manual or Dee edit overrides the DISPLAYED name
// (e.g. unwinding a propco SPE to the true buyer), that id no longer describes the value on
// screen, so only link when the preferred value still matches what the id was resolved for.
function compFieldEntityId(t, f){
  if(window.COMPS_ONLY || !t || !f.value) return null;
  const norm = s => String(s||'').trim().toUpperCase();
  if(f.field==='buyer_name' && t.buyer_entity_id && norm(f.value)===norm(t.buyer_name)) return t.buyer_entity_id;
  if(f.field==='seller_name' && t.seller_entity_id && norm(f.value)===norm(t.seller_name)) return t.seller_entity_id;
  return null;
}

function compFieldRow(txId, f, t){
  const conf = f.confirmed_by
    ? `<span class="pf-conf ${f.confirmed_stale?'stale':'on'}" title="${f.confirmed_stale?'Confirmed value has since changed':'Confirmed by '+esc(f.confirmed_by)+' on '+esc((f.confirmed_at||'').slice(0,10))}" onclick="compConfirm('${esc(txId)}','${esc(f.field)}',false)">&#10003; ${esc(f.confirmed_by)}</span>`
    : `<span class="pf-conf" title="Mark this data point as confirmed" onclick="compConfirm('${esc(txId)}','${esc(f.field)}',true)">&#10003;</span>`;
  // Clearing is only offered where a feed can take over, so the button never implies an
  // edit is destructive when it is not.
  const canRevert = f.source==='manual' && (f.sources||[]).length>1;
  // Inline trace of the last human touch. The full trail lives in the History panel; this
  // is just enough to see at a glance that someone has been here.
  const touched = f.last_by
    ? `<span class="pf-hist" title="${esc(f.last_action)} by ${esc(f.last_by)} on ${esc(fmtWhen(f.last_at))}${f.history_count>1?` (${f.history_count} changes)`:''}">${esc(f.last_by)} &middot; ${esc(relWhen(f.last_at))}</span>`
    : '';
  const eid = compFieldEntityId(t, f);
  const valHtml = eid
    ? `<a onclick="location.hash='entity/${esc(eid)}'" style="cursor:pointer">${fmtVal(f.value, f.kind)}</a>`
    : fmtVal(f.value, f.kind);
  return `<div class="prof-row" data-field="${esc(f.field)}">
    <span class="lab">${esc(f.label)} ${touched}</span>
    <span class="val">
      <span class="pf-val" data-raw="${esc(f.value==null?'':f.value)}">${valHtml}</span>${srcBadge(f.source, f.conflict)}
      ${conf}
      <span class="pf-edit" title="Edit this value" onclick="compEditField(this,'${esc(txId)}','${esc(f.field)}','${esc(f.kind)}',${canRevert})">edit</span>
    </span></div>`;
}

function compEditField(el, txId, field, kind, canRevert){
  const row = el.closest('.prof-row');
  const valSpan = row.querySelector('.pf-val');
  if(row.querySelector('.pf-in')) return;
  const raw = valSpan.getAttribute('data-raw') || valSpan.innerText.replace(/[$,%]/g,'').trim();
  const holder = row.querySelector('.val');
  holder.innerHTML = `<input class="pf-in" value="${esc(raw==='-'?'':raw)}">
    <span class="pf-edit" style="opacity:1" onclick="compSaveField(this,'${esc(txId)}','${esc(field)}')">save</span>
    ${canRevert?`<span class="pf-edit" style="opacity:1" title="Remove your edit and fall back to Dee or NIC MAP" onclick="compSaveField(this,'${esc(txId)}','${esc(field)}',true)">clear</span>`:''}
    <span class="pf-edit" style="opacity:1" onclick="renderCompProfile('${esc(txId)}')">cancel</span>`;
  const input = holder.querySelector('.pf-in');
  input.focus(); input.select();
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); compSaveField(holder.querySelector('.pf-edit'), txId, field); }
    if(e.key==='Escape') renderCompProfile(txId);
  });
}

async function compSaveField(el, txId, field, clear){
  const row = el.closest('.prof-row');
  const input = row.querySelector('.pf-in');
  const value = clear ? '' : (input ? input.value : '');
  const r = await fetch('/api/comp/'+encodeURIComponent(txId)+'/field', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({field, value, user: compUser()})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||'Could not save'); return; }
  scPageCache.clear();          // the deals list shows resolved values, so it is now stale
  renderCompProfile(txId);
}

async function compConfirm(txId, field, confirmed){
  const r = await fetch('/api/comp/'+encodeURIComponent(txId)+'/confirm', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({field, confirmed, user: compUser()})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||'Could not confirm'); return; }
  renderCompProfile(txId);
}

async function compAddField(txId){
  const sel = document.getElementById('addf-field');
  const custom = document.getElementById('addf-custom');
  const val = document.getElementById('addf-value');
  let field = sel.value;
  if(field === '__custom__'){
    const name = (custom.value||'').trim();
    if(!name){ alert('Give the custom field a name.'); custom.focus(); return; }
    field = (scLast && scLast.custom_prefix ? scLast.custom_prefix : 'custom:') + name;
  }
  if(!(val.value||'').trim()){ alert('Enter a value.'); val.focus(); return; }
  const r = await fetch('/api/comp/'+encodeURIComponent(txId)+'/field', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({field, value: val.value, user: compUser()})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){ alert(j.error||'Could not add'); return; }
  scPageCache.clear();
  renderCompProfile(txId);
}

function scGradeTip(r){
  const parts = [];
  if(r.comp_grade==='A') parts.push('Cite without a caveat');
  if(r.comp_grade==='B') parts.push('Usable, expect a question');
  if(r.comp_grade==='C') parts.push('Context only, do not anchor a value on it');
  if(r.price_confidence) parts.push('price ' + r.price_confidence.toLowerCase());
  for(const f of (r.flags||[])) parts.push(f.replace(/_/g,' '));
  return parts.join(' &middot; ');
}

// Export ignores pagination and refetches the whole filtered set, otherwise it would
// silently export only the 50 rows currently on screen.
async function exportSalesCompsCSV(){
  const view = scView(scParams);
  const d = await scFetch(scParams, {offset: 0, limit: 100000});
  if(view !== 'deals'){
    const rows = d[view] || [];
    if(!rows.length) return;
    // Buyers and Sellers carry entity-derived counts; brokers have no entity behind them.
    const hasEntity = view !== 'brokers';
    const nameCol = {buyers:'Buyer', sellers:'Seller', brokers:'SellerBroker'}[view];
    const verb = view === 'sellers' ? 'Sale' : (view === 'buyers' ? 'Buy' : 'Deal');
    const out = [[nameCol,'Deals','Volume','Units','MedianPricePerUnit','nPerUnit',
                  'MedianPricePerBed','nPerBed','States','Acuity',
                  'First'+verb, 'Last'+verb]
                  .concat(hasEntity?['Contacts','PropertiesOwned']:[])];
    for(const r of rows){
      out.push([r.label, r.deals, r.volume, r.units, r.median_ppu, r.n_ppu,
                r.median_ppb, r.n_ppb,
                (r.states_list||[]).map(([s,n])=>s+' '+n).join('; '),
                (r.acuity_list||[]).map(([a,n])=>a+' '+n).join('; '),
                (r.first||'').slice(0,10), (r.last||'').slice(0,10)]
                .concat(hasEntity?[r.contacts, r.owns]:[]));
    }
    return scDownloadCSV(out, view);
  }
  const rows = d.comps || [];
  if(!rows.length) return;
  const out = [['SaleDate','Property','Address','City','State','Zip','Metro','Acuity','Units',
                'IL','AL','MC','NC','YearBuilt','ClosePrice','PricePerUnit','PricePerBed','CapRate',
                'Buyer','BuyerType','Seller','SellerType','SellerBroker','Operator',
                'PriceConfidence','Grade','Flags','ArmsLength','PortfolioSale','Lat','Lng']];
  for(const r of rows){
    out.push([
      (r.close_date||'').slice(0,10), r.comp_name, r.comp_address, r.comp_city, r.comp_state,
      r.comp_zip, r.comp_metro, r.asset_label, r.units_at_sale,
      r.il_at_sale, r.al_at_sale, r.mc_at_sale, r.nc_at_sale, r.year_built_at_sale,
      r.close_price, r.price_per_unit, r.price_per_bed, r.cap_rate,
      r.buyer_name, r.buyer_type, r.seller_name, r.seller_type, r.seller_broker, r.operator_name,
      r.price_confidence, r.comp_grade, (r.flags||[]).join(' '),
      r.is_arms_length ? 'yes':'no', r.is_portfolio ? 'yes':'no', r.lat, r.lng,
    ]);
  }
  return scDownloadCSV(out, 'deals');
}

function scDownloadCSV(rows, view){
  const csv = rows.map(r => r.map(v => {
    v = (v==null?'':String(v));
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const st = scParams.get('state'), cls = scParams.get('classes');
  const base = view==='buyers' ? 'comp_buyers' : (view==='brokers' ? 'comp_brokers' : 'sales_comps');
  a.download = base+(st?'_'+st:'')+(cls?'_'+cls.replace(/,/g,'-'):'')+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---- comps-only mode ----
// comps_app/app.py serves this same file with window.COMPS_ONLY set. The views it hides are
// the ones that app does not serve at all: their endpoints 404 there by design, so showing
// the nav for them would only offer a dead end.
if(window.COMPS_ONLY){
  // Hidden, not removed: route() toggles an active class on each nav link every time the
  // hash changes, so deleting the elements throws on the first render.
  const hide = sel => { const el = typeof sel==='string' ? document.querySelector(sel) : sel;
                        if(el) el.style.display = 'none'; };
  ['#nav-hot','#nav-allprops','#nav-targets','#nav-loans','#nav-databased','#nav-buyerlist','#nav-mergereview','.searchwrap','#filterbar']
    .forEach(hide);
  // The comp report brings its own filter bar; the master one drives facility search.
  document.title = 'Sales Comp Report';
  const brand = document.querySelector('.brand');
  if(brand){ brand.textContent = 'Sales Comp Report'; brand.onclick = () => location.hash = 'salescomps'; }
  if(!location.hash || location.hash === '#') location.hash = 'salescomps';
}

// ---- Enter saves ----
// Every edit form in the app ends in a Save (or Add) button, and reaching for the mouse to
// click it after typing a number is the slow part. So Enter anywhere in a form presses that
// form's button: walk up from the field to the nearest box holding one. In a notes box Enter
// saves too; Shift+Enter is how you get a new line. Fields with their own Enter behavior
// (search boxes, inline value edits) call preventDefault and are left alone, and Ctrl+Enter
// stays with the notes boxes that already bind it.
const ENTER_SAVE_RE = /^(save|add)\b/i;
function findSaveButton(el){
  let node = el.parentElement;
  for(let depth = 0; node && node !== document.body && depth < 8; depth++, node = node.parentElement){
    const hits = [...node.querySelectorAll('button.btn, .pf-edit')].filter(b =>
      !b.disabled && b.offsetParent !== null && ENTER_SAVE_RE.test(b.textContent.trim()));
    if(hits.length) return hits.length === 1 ? hits[0] : null;
  }
  return null;
}
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || e.defaultPrevented || e.isComposing) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  const tag = t && t.tagName;
  if(tag !== 'INPUT' && tag !== 'SELECT' && tag !== 'TEXTAREA') return;
  if(tag === 'TEXTAREA' && e.shiftKey) return;
  if(tag === 'INPUT' && /^(button|submit|reset|file|image)$/i.test(t.type)) return;
  // An owner/facility picker with its suggestion list open: Enter would save a half-typed
  // name before you picked the match, so wait for the pick.
  const pick = t.closest('.entpick');
  const sug = pick && pick.querySelector('.entsug');
  if(sug && sug.style.display !== 'none' && sug.children.length) return;
  const btn = findSaveButton(t);
  if(!btn) return;
  e.preventDefault();
  btn.click();
});

// init
if(!window.COMPS_ONLY) loadStates();
loadSignedInUser().then(()=>{ if(location.hash.startsWith('#comp/')) route(); });
// The flame beside every last-contact chip reads from HOT, so the starred set has to land
// before the first paint -- otherwise an owner already on the list renders cold until you
// navigate somewhere else and back. One small local fetch; the delay isn't perceptible.
if(window.COMPS_ONLY) route(); else { loadHotIds().then(route, route); loadMergeCount(); loadFacPhones(); }
if(!window.COMPS_ONLY) search.focus();

// ---- click-to-sort lists + one-line dates ----
// Every in-page list (Transaction History, Sale Comps, Edit History, Outside CA/AZ/CO) sorts
// from its column headers. First click: names A to Z, numbers and dates highest/newest first;
// the second click flips it. Blanks and "-" always sink to the bottom. The paged rosters
// (Owner Targets, All Properties, Sales Comps) sort on the server through their own headers.
// A cell can carry data-sort when its shown text is not sortable ("3 days ago").
function listCellKey(td){
  const raw = (td ? (td.dataset.sort != null ? td.dataset.sort : td.textContent) : '').trim();
  if(!raw || raw === '-' || raw === '(none)') return null;
  if(/^\d{4}-\d{2}(-\d{2})?([ T].*)?$/.test(raw)) return {t:'date', v:raw};
  const n = raw.replace(/[$,%\s]|units?|beds?/gi, '');
  if(/^-?\d+(\.\d+)?$/.test(n)) return {t:'num', v:parseFloat(n)};
  return {t:'text', v:raw.toLowerCase()};
}
document.addEventListener('click', ev => {
  const th = ev.target.closest('table.tx thead th, table.hist thead th');
  if(!th || ev.target.closest('a,input,button,select')) return;
  const table = th.closest('table'), body = table.tBodies[0];
  if(!body) return;
  const col = [...th.parentNode.children].indexOf(th);
  const rows = [...body.rows];
  const keys = new Map(rows.map(r => [r, listCellKey(r.cells[col])]));
  const kinds = new Set([...keys.values()].filter(Boolean).map(k => k.t));
  const kind = kinds.size === 1 ? [...kinds][0] : 'text';
  const dir = table.dataset.sortCol === String(col)
    ? (table.dataset.sortDir === 'asc' ? 'desc' : 'asc')
    : (kind === 'text' ? 'asc' : 'desc');
  table.dataset.sortCol = col; table.dataset.sortDir = dir;
  const val = r => { const k = keys.get(r); return k ? (kind === 'text' ? String(k.v) : k.v) : null; };
  rows.sort((a, b) => {
    const x = val(a), y = val(b);
    if(x == null || y == null) return (x == null) - (y == null);
    const c = kind === 'text' ? x.localeCompare(y, undefined, {numeric:true}) : (x < y ? -1 : x > y ? 1 : 0);
    return dir === 'asc' ? c : -c;
  });
  rows.forEach(r => body.appendChild(r));
  for(const h of th.parentNode.children){
    h.classList.toggle('sorted', h === th);
    const old = h.querySelector('.sortarrow'); if(old) old.remove();
  }
  th.insertAdjacentHTML('beforeend', `<span class="sortarrow">${dir === 'desc' ? ' &#9660;' : ' &#9650;'}</span>`);
});
// Any table cell that is just a date stays on one line, wherever a list renders it.
(function(){
  const DATE = /^\d{4}-\d{2}-\d{2}([ T][\d:.]+Z?)?$/;
  let queued = false;
  const sweep = () => { queued = false;
    for(const td of document.querySelectorAll('td:not(.dt)')){
      const t = td.textContent.trim();
      if(t.length <= 24 && DATE.test(t)) td.classList.add('dt');
    }
  };
  new MutationObserver(() => { if(!queued){ queued = true; requestAnimationFrame(sweep); } })
    .observe(document.body, {childList:true, subtree:true});
})();

// ---- header nav auto-fit ----
// Two things pull against each other up in the header: the tabs should be as readable as the
// window allows, and they have to stay on one row (a wrapped nav buries the last tabs on a
// second line). One hand-picked font size can't do both -- it is either cramped on a wide
// monitor or wrapped on a narrow one. So try a ladder of sizes, largest first, and keep the
// first one that actually fits, measured with the search box pinned to its minimum since the
// search box is what gives up width to make room for the tabs.
(function(){
  const header = document.querySelector('header');
  const search = document.querySelector('.searchwrap');
  if(!header || !search) return;
  const SEARCH_PROMPT = document.getElementById('search') ?
    document.getElementById('search').placeholder : '';
  // [font-size, left/right padding, gap between tabs]
  const TIERS = [[13.5,12,8],[13.5,11,8],[13,11,8],[13,10,7],[12.5,9,7],[12,8,6],[11.5,7,5]];
  const root = document.documentElement.style;

  function setTier(t){
    root.setProperty('--navfs', t[0] + 'px');
    root.setProperty('--navpx', t[1] + 'px');
    root.setProperty('--navgap', t[2] + 'px');
  }
  // Width the row really needs. Summing the children is the only honest measure here:
  // scrollWidth drops the right padding once a flex row overflows, and the search box
  // stretches to fill whatever is left, so a fitting row and an overflowing one both
  // report the full width unless the search box is held at its minimum first.
  function widthUsed(gap){
    const kids = [...header.children].filter(el => el.offsetParent !== null);
    let w = gap * Math.max(0, kids.length - 1);
    kids.forEach(el => { w += el.getBoundingClientRect().width; });
    return w;
  }

  let lastAvail = -1;
  function fitHeaderNav(){
    const cs = getComputedStyle(header);
    // A couple of px in hand: sub-pixel text widths round up, and the last tab sitting
    // exactly on the edge would get clipped rather than nudged.
    const avail = header.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
    if(avail < 200) return;   // pane not laid out yet -- the observer will come back
    lastAvail = avail;
    header.classList.remove('nav-wrap');
    const prevFlex = search.style.flex;
    search.style.flex = '0 0 ' + (parseFloat(getComputedStyle(search).minWidth) || 120) + 'px';
    let picked = TIERS[TIERS.length - 1], fits = false;
    for(const t of TIERS){
      setTier(t);
      if(widthUsed(t[2]) <= avail){ picked = t; fits = true; break; }
    }
    setTier(picked);
    search.style.flex = prevFlex;
    if(!fits) header.classList.add('nav-wrap');
    // The search box is what pays for the bigger tabs, so on a narrower window it ends up
    // too short for the long prompt. Shorten the prompt to match instead of showing a
    // sentence cut off mid-word.
    const box = search.getBoundingClientRect().width;
    const input = document.getElementById('search');
    if(input) input.placeholder = box < 190 ? 'Search...'
                                : box < 300 ? 'Search name, address, city, owner...'
                                : SEARCH_PROMPT;
    // Everything that parks itself under the header (filter bar, recent sidebar) keys off
    // --hdr, and the header's height moves with the type size, so publish it here.
    root.setProperty('--hdr', Math.round(header.getBoundingClientRect().height) + 'px');
  }

  fitHeaderNav();
  // Emoji and fallback metrics can land after first paint, which shifts the real widths.
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeaderNav);
  // Watching the header itself, not just window resize: rendering a long table adds a
  // vertical scrollbar, which quietly takes ~15px off the header and used to clip the last
  // tab after a view finished loading. Re-fit only when the usable width really moved, so
  // the height change this makes can't feed back into another pass.
  if(window.ResizeObserver){
    new ResizeObserver(() => {
      const cs = getComputedStyle(header);
      const avail = header.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 4;
      if(avail !== lastAvail) fitHeaderNav();
    }).observe(header);
  }
  let pending;
  addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(fitHeaderNav, 80); });
})();
</script>
