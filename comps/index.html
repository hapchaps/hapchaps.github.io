// ---------- search ----------
// Two things happen as Hap types. The dropdown answers from the first letter (he is
// usually on a call and needs the record on screen before the other side stops talking);
// the full results page only renders once he pauses, because that one costs a render.
const qsug = document.getElementById('qsug');
let qsugRows = [];      // what is currently listed, in display order
let qsugSel = -1;       // keyboard cursor; -1 = nothing picked yet
let qsugSeq = 0;        // request counter, so a slow answer can never overwrite a fast one
let qsugAbort = null;
let qsugTimer = null;
const qsugCache = new Map();   // query -> results, so backspacing redraws with no round trip

function qsugClose(){ qsug.style.display='none'; qsug.innerHTML=''; qsugRows=[]; qsugSel=-1; }

function qsugMark(text, q){
  // Bold the part of the name he has actually typed, so the reason a row is in the list
  // is visible at a glance rather than something to work out.
  const words = (q||'').toLowerCase().split(/[^a-z0-9]+/i).filter(w=>w.length>1);
  let html = esc(text||'');
  for(const w of [...new Set(words)].sort((a,b)=>b.length-a.length)){
    const re = new RegExp('(?<![a-z0-9>])('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')', 'ig');
    html = html.replace(/(<[^>]*>)|([^<]+)/g, (m,tag,txt)=> tag ? tag : txt.replace(re,'<b>$1</b>'));
  }
  return html;
}

function qsugRender(data, q){
  const rows = (data && data.results) || [];
  qsugRows = rows;
  qsugSel = -1;
  if(!rows.length){
    qsug.innerHTML = '<div class="qs-empty">Nothing found for &ldquo;'+esc(q)+'&rdquo;.</div>';
    qsug.style.display = 'block';
    return;
  }
  // "Closest matches" is the honest heading when no record matched every word typed.
  // The old search showed an empty page here, which is what sent Hap back to deleting
  // words one at a time until something came up.
  let html = data.partial
    ? '<div class="qs-head">No exact match &mdash; closest records</div>' : '';
  rows.forEach((r,i)=>{
    html += `<div class="qs-row" data-i="${i}" onmousedown="event.preventDefault()" onclick="qsugGo(${i})">
      <div class="qs-body">
        <div class="qs-name">${qsugMark(r.title, q)}</div>
        ${r.subtitle?`<div class="qs-sub">${qsugMark(r.subtitle, q)}</div>`:''}
        ${r.meta?`<div class="qs-meta">${qsugMark(r.meta, q)}</div>`:''}
      </div>
      <span class="qs-kind ${esc(r.type)}">${esc(r.kind)}</span>
    </div>`;
  });
  html += `<div class="qs-foot" data-i="-2" onmousedown="event.preventDefault()" onclick="qsugAll()">
    &#9166; See all facilities matching &ldquo;${esc(q)}&rdquo;</div>`;
  qsug.innerHTML = html;
  qsug.style.display = 'block';
}

function qsugHighlight(){
  [...qsug.querySelectorAll('.qs-row, .qs-foot')].forEach(el=>{
    const on = Number(el.dataset.i) === qsugSel;
    el.classList.toggle('sel', on);
    if(on && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
  });
}

function qsugGo(i){
  const r = qsugRows[i];
  if(!r) return;
  qsugClose();
  search.blur();
  location.hash = r.hash;
}

function qsugAll(){ qsugClose(); applySearch(); }

async function qsugFetch(q){
  if(qsugCache.has(q)){ qsugRender(qsugCache.get(q), q); return; }
  const seq = ++qsugSeq;
  if(qsugAbort) qsugAbort.abort();
  qsugAbort = new AbortController();
  try {
    const r = await fetch('/api/quick?q='+encodeURIComponent(q), {signal: qsugAbort.signal});
    const data = await r.json();
    if(seq !== qsugSeq) return;      // a later keystroke already went out; this answer is stale
    if(qsugCache.size > 120) qsugCache.clear();
    qsugCache.set(q, data);
    if(search.value.trim() === q) qsugRender(data, q);
  } catch(e){ /* aborted or offline -- leave whatever is on screen */ }
}

search.addEventListener('input', ()=>{
  clearTimeout(debounce);
  clearTimeout(qsugTimer);
  const q = search.value.trim();
  if(!q){ qsugClose(); if(onSearchPage()) debounce = setTimeout(applySearch, 200); return; }
  // A query he has already typed once repaints with no round trip at all -- which is what
  // backspacing a word feels like. Anything else gets a short hold, so a fast typist
  // sends one request per word rather than one per letter.
  if(qsugCache.has(q)) qsugRender(qsugCache.get(q), q);
  qsugTimer = setTimeout(()=>qsugFetch(q), qsugCache.has(q) ? 150 : 70);
  // The full results page only follows along while he is ALREADY looking at results.
  // Typing from a property page used to throw that page away one keystroke in; now the
  // dropdown answers over the top of it and the page stays put until he picks something.
  if(onSearchPage()) debounce = setTimeout(applySearch, 300);
});
search.addEventListener('focus', ()=>{
  const q = search.value.trim();
  if(q && qsugCache.has(q)) qsugRender(qsugCache.get(q), q);
});
search.addEventListener('blur', ()=>setTimeout(qsugClose, 120));
search.addEventListener('keydown', e=>{
  const open = qsug.style.display !== 'none' && qsugRows.length;
  if(e.key === 'Escape'){ qsugClose(); return; }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!open) return;
    e.preventDefault();
    const last = qsugRows.length - 1;
    if(e.key === 'ArrowDown') qsugSel = qsugSel >= last ? -2 : qsugSel + 1;
    else qsugSel = qsugSel <= -1 ? -2 : (qsugSel === -2 ? last : qsugSel - 1);
    qsugHighlight();
    return;
  }
  if(e.key === 'Enter'){
    e.preventDefault();
    clearTimeout(debounce); clearTimeout(qsugTimer);
    // Enter on a highlighted row opens that record; Enter on nothing (or on the footer)
    // runs the full facility search, which is what it always did.
    if(open && qsugSel >= 0) qsugGo(qsugSel);
    else qsugAll();
  }
});

async function doSearch(params){
  app.innerHTML = '<div class="spinner">Searching...</div>';
  const q = (params.get('q')||'').trim();
  // A bare text search (no state/unit/class filters, which only mean something for a
  // facility) also checks Owners & Contacts, so typing a company or person's name in the
  // ONE search box finds them without having to guess they belong under a different tab.
  const peopleWanted = q.length >= 2 && !window.COMPS_ONLY;
  const [data, people] = await Promise.all([
    getJSON('/api/search?'+params.toString()),
    peopleWanted ? getJSON('/api/people?q='+encodeURIComponent(q)) : Promise.resolve(null),
  ]);
  const rs = data.results||[];
  const ents = (people && people.entities) || [];
  const cons = (people && people.contacts) || [];
  const desc = describeQuery(params);
  if(!rs.length && !ents.length && !cons.length){
    app.innerHTML = '<div class="resultcount">No facilities, owners, or contacts found '+desc+'.</div>'; return;
  }
  let html = '';
  if(ents.length || cons.length){
    html += `<div class="resultcount">Companies &amp; Contacts <a style="font-weight:400;font-size:12px" onclick="location.hash='owners?q=${encodeURIComponent(q)}'">see all in Owners &amp; Contacts &rarr;</a></div><div class="results">`;
    for(const e of ents.slice(0,5)){
      html += `<div class="card" onclick="location.hash='entity/${e.id}'">
        <div class="r1"><span class="name">${esc(e.display_name||e.legal_name)}</span>${e.kind&&e.kind!=='UNKNOWN'?`<span class="chip status">${esc(e.kind)}</span>`:''}${e.possible_dupe?'<span class="chip warn" title="Another live company record shares this exact name -- open the profile to review">&#9888; possible duplicate</span>':''}</div>
        <div class="meta">${entityCardCount(e)}</div>
      </div>`;
    }
    for(const c of cons.slice(0,5)){
      const nm = contactName(c);
      html += `<div class="card" onclick="location.hash='contact/${c.id}'">
        <div class="r1"><span class="name">${esc(nm)}</span></div>
        <div class="meta">${c.title?esc(c.title)+' &middot; ':''}${c.employer_name?esc(c.employer_name):'No company on file'}${
          c.property_count?' &middot; <b>'+num(c.property_count)+'</b> propert'+(c.property_count===1?'y':'ies'):''}</div>
      </div>`;
    }
    html += '</div>';
  }
  if(!rs.length){
    html += '<div class="resultcount" style="margin-top:16px">No facilities found '+desc+'.</div>';
    app.innerHTML = html;
    return;
  }
  const capped = rs.length >= 300 ? ' (showing first 300)' : '';
  // Nothing matched every word. Rather than the empty page that used to send Hap back to
  // deleting words one at a time, show what came closest and say so plainly.
  const lead = data.partial
    ? 'No exact match '+desc+' &mdash; '+rs.length+' closest facilit'+(rs.length>1?'ies':'y')
    : rs.length+' facilit'+(rs.length>1?'ies':'y')+capped+' '+desc;
  html += '<div class="resultcount"'+((ents.length||cons.length)?' style="margin-top:16px"':'')+'>'+lead+'</div><div class="results">';
  for(const r of rs){
    html += `<div class="card" onclick="location.hash='property/${r.id}'">
      <div class="r1">
        <span class="name">${esc(r.name)}</span>
        <span class="chip ${esc(r.asset_class)}">${esc(r.asset_label)}</span>
        ${r.property_status&&r.property_status!=='active'?`<span class="chip status">${esc(r.property_status)}</span>`:''}
        ${r.sf_property_url?`<a class="tlobadge nic" href="${esc(r.sf_property_url)}" target="_blank" rel="noopener" title="This property has a Salesforce record" onclick="event.stopPropagation()">&#9737; SF</a>`:''}
      </div>
      <div class="addr">${esc(r.primary_address)}, ${esc(r.city)}, ${esc(r.state)} ${esc(r.zip||'')}</div>
      <div class="meta">
        ${r.total_units?`<b>${num(r.total_units)}</b> units`:''}
        ${r.owner_summary?` &nbsp;&middot;&nbsp; Operator/Owner: <b>${esc(r.owner_summary)}</b>`:''}
      </div>
    </div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function describeQuery(params){
  const bits=[];
  if(params.get('q')) bits.push('for "'+esc(params.get('q'))+'"');
  if(params.get('classes')) bits.push('('+esc(params.get('classes').replace(/SENIOR_APT/,'Sr Apt'))+')');
  if(params.get('state')) bits.push('in '+esc(params.get('state')));
  const lo=params.get('units_min'), hi=params.get('units_max');
  if(lo&&hi) bits.push(lo+'-'+hi+' units/beds');
  else if(lo) bits.push(lo+'+ units/beds');
  else if(hi) bits.push('up to '+hi+' units/beds');
  return bits.join(' ');
}

function dayAbbrev(iso){
  const bits = (iso||'').split('-');
  if(bits.length !== 3) return iso||'';
  const d = new Date(Number(bits[0]), Number(bits[1])-1, Number(bits[2]));
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, {weekday:'short'});
}
// "2025-11-01" -> "Nov 2025" -- a target date is never precise to the day anyway, and
// dropping it frees up real column width on the New Development roster.
function monthYear(iso){
  const bits = (iso||'').split('-');
  if(bits.length < 2) return iso||'';
  const d = new Date(Number(bits[0]), Number(bits[1])-1, 1);
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, {month:'short', year:'numeric'});
}

async function renderLanding(){

// ---------- Today (morning brief) ----------
// What to work on today, from Beta Station's own data. Filled after the home screen draws:
// the loans part can take a few seconds on a cold server, and the page should not wait.
async function loadBrief(){
  let b;
  try { b = await getJSON('/api/brief'); } catch(e){ b = null; }
  const el = document.getElementById('brief');
  if(!el) return;                       // navigated away while it loaded
  if(!b || b.error){ el.innerHTML = '<h2>Today</h2><div class="brief-empty">Could not build today&rsquo;s list.</div>'; return; }
  el.innerHTML = briefHTML(b);
}

function briefPhone(m, o){
  // Cell first, always.
  if(m) return `<span class="b-ph">C: <a href="tel:${esc(m)}">${esc(m)}</a>${facTag(m)}</span>`;
  if(o) return `<span class="b-ph">O: <a href="tel:${esc(o)}">${esc(o)}</a>${facTag(o)}</span>`;
  return '';
}
function briefAgo(days){
  if(days == null) return 'never';
  return days === 0 ? 'today' : days + 'd ago';
}
// The same Log call chip as every roster: logs into the shared call log on the row's own
// record (the owner for Hot Prospects, the note's record for loose ends, the building for
// loans), then redraws Today, where a handled row usually drops off.
function briefChip(r, date){
  const ago = r.days == null ? 'never reached' : briefAgo(r.days);
  return touchChip(r.kind, r.id, date, 'loadBrief', false) + `<div class="b-sub">${esc(ago)}</div>`;
}
function briefGo(link){ return `onclick="location.hash='${esc(link)}'"`; }

function briefSection(title, why, allHash, allLabel, sec, rowFn, emptyMsg){
  const rows = (sec && sec.rows) || [], total = (sec && sec.total) || 0;
  const more = total > rows.length ? `All ${num(total)} on ${allLabel} &rarr;` : `${allLabel} &rarr;`;
  let h = `<div class="brief-sec"><div class="brief-head"><h3>${title}${total?` <span class="brief-tag">${num(total)}</span>`:''}</h3>
    <span class="bh-why">${why}</span>${allHash?`<a class="bh-all" onclick="location.hash='${esc(allHash)}'">${more}</a>`:''}</div>`;
  if(!rows.length) return h + `<div class="brief-empty">${emptyMsg}</div></div>`;
  return h + `<table class="brief"><tbody>${rows.map(rowFn).join('')}</tbody></table></div>`;
}

// ---------- Copilot name matcher ----------
// Email stays in Copilot (M&M IT). Hap pastes the names Copilot lists, one per line, and
// each comes back matched to its Beta Station record with the last contact. Nothing is
// saved; the pasted text only lives in this page until it is closed.
let bmOpen = false, bmText = '', bmRows = null;

function briefMatchToggle(){
  bmOpen = !bmOpen;
  const box = document.getElementById('bm'), t = document.querySelector('.bm-toggle');
  if(!box) return;
  box.style.display = bmOpen ? '' : 'none';
  if(t) t.textContent = bmOpen ? 'Hide' : 'Match names from a Copilot email summary';
  if(bmOpen){ const ta = box.querySelector('textarea'); if(ta) ta.focus(); }
}

function briefMatchBoxHTML(){
  return `<textarea id="bm-text" placeholder="Paste the names from Copilot, one per line. Names, emails or phone numbers all work.">${esc(bmText)}</textarea>
    <div class="bm-actions"><a onclick="briefMatchRun()">Match</a>
      ${bmRows ? '<a onclick="briefMatchClear()">Clear</a>' : ''}
      <span class="bm-hint">Only names are needed, not the email itself. Nothing here is saved.</span></div>
    <div id="bm-out">${bmRows ? briefMatchRowsHTML(bmRows) : ''}</div>`;
}

async function briefMatchRun(){
  const ta = document.getElementById('bm-text');
  bmText = ta ? ta.value : bmText;
  if(!bmText.trim()) return;
  const out = document.getElementById('bm-out');
  if(out) out.innerHTML = '<div class="brief-empty">Matching...</div>';
  try {
    const r = await fetch('/api/brief/match', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text: bmText})});
    const d = await r.json();
    bmRows = d.rows || [];
  } catch(e){ bmRows = null; if(out) out.innerHTML = '<div class="brief-empty">Could not match those names.</div>'; return; }
  const box = document.getElementById('bm');
  if(box) box.innerHTML = briefMatchBoxHTML();
}
// Called by name from the Log call chip after a save, so the last-contact dates refresh.
function briefMatchRefresh(){ if(bmText.trim()) briefMatchRun(); }
function briefMatchClear(){
  bmText = ''; bmRows = null;
  const box = document.getElementById('bm');
  if(box) box.innerHTML = briefMatchBoxHTML();
}

function briefMatchRowsHTML(rows){
  if(!rows.length) return '<div class="brief-empty">No names found in that text.</div>';
  const n = rows.filter(r => r.match).length;
  let h = `<div class="brief-empty">${n} of ${rows.length} matched</div><table class="brief"><tbody>`;
  for(const r of rows){
    const m = r.match;
    if(!m){
      h += `<tr><td class="b-name" style="color:var(--muted)">${esc(r.line)}</td>
        <td colspan="3" class="b-sub">No match in Beta Station</td></tr>`;
      continue;
    }
    const chip = ['contact','entity','property'].includes(m.type)
      ? touchChip(m.type, m.id, m.last_contact, 'briefMatchRefresh', false) : '';
    h += `<tr>
      <td class="b-name"><a ${briefGo(m.hash)}>${esc(m.title||'(unnamed)')}</a>
        <div class="b-sub">${esc([m.kind, m.sub].filter(Boolean).join(' \u00b7 '))}</div></td>
      <td>${briefPhone(m.phone_mobile, m.phone_office)}</td>
      <td><div class="b-note b-sub">${esc(r.line)}</div></td>
      <td class="b-when">${chip}</td>
    </tr>`;
  }
  return h + '</tbody></table>';
}

// ---------- stars ----------
function stars(n){
  if(n==null) return '<span class="empty">n/a</span>';
  let h='<span class="stars">';
  for(let i=1;i<=5;i++) h+=`<span class="star ${i<=n?'on':''}">&#9733;</span>`;
  h+='</span> '+n+'/5';
  return h;
}

      ${purl?`<a class="tlolink" href="${purl}" target="_blank" rel="noopener" data-q="${esc(curPropAddr||'')}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">🔎 Open this address in TLO and judge the owner →</a>`:''}</div>`;
  }
  if(d.ownership && d.ownership.length){
    // The address search leads the stack: the parcel names the LLC holding title and its
    // contacts, where the name searches below fire on long trust names and return noise.
    // (The suspect-parcel and no-owner boxes carry their own copy of this link.)
    const topUrl = p.tlo_parcel_suspect ? '' : tloPropertyUrl(curPropAddr, curPropCSZ);
    if(topUrl){
      right += `<div class="tloaddr"><a class="tlolink" href="${topUrl}" target="_blank" rel="noopener"
        title="TLO Assets &gt; Real Estate: the parcel names the owning LLC and its contacts"
        data-q="${esc(curPropAddr)}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">&#128269; Open this address in TLO &rarr;</a>
        <span class="muted">${esc(curPropAddr)}${curPropCSZ?' '+esc(curPropCSZ):''}</span></div>`;
    }
    for(const block of d.ownership){
      right += `<div class="roleblock"><div class="rolelabel">${esc(block.label)} (${block.entities.length})</div><div class="entlist">`;
      for(const e of block.entities){
        const link = e.entity_id ? `onclick="location.hash='entity/${e.entity_id}'" style="cursor:pointer"` : '';
        // CA SOS owner-hunt note: commercial agent = dead end -> point to principal address
        let sos = '';
        if(e.sos_agent_commercial){
          sos = `<div class="sosnote sos-deadend">⛔ SOS agent: ${esc(e.sos_agent)} (commercial — dead end). Owner mailing: ${esc(e.sos_principal_address||e.tlo_mailing||'—')}</div>`;
        } else if(e.sos_agent || e.sos_principal_address){
          sos = `<div class="sosnote">SOS agent: ${esc(e.sos_agent||'—')}${e.sos_principal_address?' · Owner mailing: '+esc(e.sos_principal_address):''}</div>`;
        }
        // Clickable TLO owner-hunt link on the real-estate owner. TLOxp reads BusinessName from the
        // query string and (with action=search) pops its own "Run the Search?" confirm -> one click
        // lands Hap straight on the results. Two flavors:
        //   * owner from TLO          -> "suggested contact" (we already vetted it)
        //   * owner from CoStar/other -> "recorded owner, look it up yourself in TLO" (LLC/LP only)
        let tlo = '';
        if(block.role_type==='real_estate_owner' && e.legal_name){
          if(e.from_tlo){
            const q = (e.tlo_dead_end && e.tlo_left_off) ? e.tlo_left_off : e.legal_name;
            const pre = (e.tlo_dead_end && e.tlo_left_off)
              ? `<span class="sos-deadend">↪ laddered to <b>${esc(e.tlo_left_off)}</b> — continue in TLO:</span> `
              : `<span class="suggest">💡 Suggested contact — owner of record (from TLO Properties)${e.tlo_mailing?`, mailing ${esc(e.tlo_mailing)}`:''}. Open the owner in TLO to pick the best principal/number:</span> `;
            const tlourl = 'https://tloxp.tlo.com/search.php?type=BusinessComboSearch&action=search&BusinessName=' + encodeURIComponent(q);
            tlo = `<div class="sosnote">${pre}<a class="tlolink" href="${tlourl}" target="_blank" rel="noopener" data-q="${esc(q)}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">🔎 Search "${esc(q)}" in TLO →</a></div>`;
          } else if(e.owner_source==='salesforce'){
            // Salesforce Property Owner (Company) -- NOT reliably accurate (Hap has seen wrong owner
            // data in SF before). Label it distinctly from a TLO/CoStar owner of record and never
            // merge/prefer it -- it's a separate, lower-confidence signal worth its own TLO lookup.
            const q = e.legal_name;
            const tlourl = 'https://tloxp.tlo.com/search.php?type=BusinessComboSearch&action=search&BusinessName=' + encodeURIComponent(q);
            tlo = `<div class="sosnote"><span class="suggest">🤝 Salesforce-recorded owner (verify — SF ownership data can be stale/wrong):</span> <a class="tlolink" href="${tlourl}" target="_blank" rel="noopener" data-q="${esc(q)}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">🔎 Search "${esc(q)}" in TLO →</a></div>`;
          } else if(isEntityName(e.legal_name)){
            // CoStar (or NIC/CMS) recorded owner — give Hap a one-click TLO Businesses lookup so he
            // can pull the principals/phones himself without retyping the LLC/LP name.
            const q = e.legal_name;
            const tlourl = 'https://tloxp.tlo.com/search.php?type=BusinessComboSearch&action=search&BusinessName=' + encodeURIComponent(q);
            tlo = `<div class="sosnote"><span class="suggest">📇 Recorded owner — look it up in TLO to find the principals / phone numbers:</span> <a class="tlolink" href="${tlourl}" target="_blank" rel="noopener" data-q="${esc(q)}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">🔎 Search "${esc(q)}" in TLO →</a></div>`;
          }
        }
        // Hand-entered ownership outranks every feed -- badge it so future-Hap can tell his
        // own knowledge apart from a CoStar/TLO/SF pull at a glance.
        const uiBadge = e.owner_source==='ui'
          ? `<span class="uichip" title="Entered by you in this UI, outranks the imported feeds">&#9998; yours</span>` : '';
        // Row actions are DOM-scoped via data-role-id (no global edit state), same pattern
        // as the notes/contacts panels.
        const acts = e.role_id ? `<span class="rowacts">
            <a onclick="event.stopPropagation();editOwner(this)" data-role-id="${esc(e.role_id)}"
               data-role-type="${esc(block.role_type)}" data-entity-name="${esc(e.legal_name||'')}"
               data-pct="${e.pct_interest!=null?e.pct_interest:''}">edit</a>
            <a onclick="event.stopPropagation();removeOwner(this)" data-role-id="${esc(e.role_id)}"
               data-name="${esc(e.legal_name||'this owner')}">remove</a>
          </span>` : '';
        right += `<div class="entrow" data-rowfor="${esc(e.role_id||'')}" ${link}>
          <span class="nm">${esc(e.display_name||e.legal_name||'(unknown)')}${uiBadge}</span>
          <span class="ex">
            ${(e.portfolio && e.portfolio_n>1 && e.portfolio_n>(e.property_count||0))
              ? `<span class="portchip" title="Part of the ${esc(e.portfolio)} portfolio (${e.portfolio_n} properties across its entities)">&#9638; ${esc(e.portfolio)} &middot; ${e.portfolio_n} props</span>`
              : (e.property_count>1?`<span class="portchip" title="This owner is linked to ${e.property_count} properties">&#9638; ${e.property_count} properties</span>`
              : (e.portfolio?`<span class="portchip" title="Rolls up to the ${esc(e.portfolio)} portfolio">&#9638; ${esc(e.portfolio)}</span>`:''))}
            ${e.pct_interest!=null?Number(e.pct_interest).toFixed(1)+'%':''}
            ${e.is_inferred?'<span class="inferred">inferred</span>':''}
            ${e.entity_id?touchChip('entity', e.entity_id, e.owner_last_contact, 'touchRefreshProperty'):''}
            ${acts}
          </span>
        </div><div class="edit-owner-slot" data-slotfor="${esc(e.role_id||'')}"></div>${sos}${tlo}${ownerPeopleBlock(e)}${ownerInfoBlock(e)}`;
      }
      right += `</div></div>`;
    }
  } else if(!p.tlo_parcel_suspect){
    // No owner on file and not already flagged suspect: give Hap the TLO property link so he
    // can run the owner-of-record search himself (the core "let me dive into TLO" path).
    const purl = tloPropertyUrl(curPropAddr, curPropCSZ);
    right += `<div class="empty-msg">No ownership records linked.</div>`;
    if(purl){
      const lead = p.tlo_not_found
        ? `<span class="suggest">⚠ TLO had no usable match (${esc(p.tlo_not_found_note||'newer build / address variant')}). Take over with the prefilled property search:</span>`
        : `<span class="suggest">No owner on file yet${p.tlo_attempted?' — earlier TLO attempt found nothing usable':''}. Look up the owner of record in TLO:</span>`;
      right += `<div class="sosnote">${lead} <a class="tlolink" href="${purl}" target="_blank" rel="noopener" data-q="${esc(curPropAddr||'')}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">🔎 Open this address in TLO →</a></div>`;
    }
  }
  right += `</div>`;

  // contacts (add / edit / per-contact call log)
  right += `<div class="panel" id="contacts-panel">
    <h2>Key Contacts <a class="addlink" onclick="showAddContact(this)">+ add</a></h2>
    <div class="add-contact-slot"></div>
    <div id="contacts-list">${renderContacts(d.contacts||[])}</div>
  </div>`;

  // licenses
  if(d.licenses && d.licenses.length){
    let rows='';
    for(const l of d.licenses){
      rows += `<div class="contact">
        <div class="cn">${esc(l.license_type||'License')} ${l.license_number?'#'+esc(l.license_number):''}</div>
        <div class="cr">${esc(l.authority||'')} ${l.status?'&middot; '+esc(l.status):''}</div>
        ${l.expiration_date?`<div class="cc">Expires ${esc(l.expiration_date)}</div>`:''}
        ${l.raw_licensee_string?`<div class="cc">Licensee: ${esc(l.raw_licensee_string)}</div>`:''}
      </div>`;
    }
    right += `<div class="panel"><h2>Licenses</h2>${rows}</div>`;
  }

  html += `<div>${left}</div><div>${right}</div></div>`;
  html += notesPanel(p.id, curActs);
  app.innerHTML = html;
  window.scrollTo(0,0);
  if(flashRoleId){
    const row = app.querySelector(`.entrow[data-rowfor="${flashRoleId}"]`);
    // Clear the class explicitly: a background tab can throttle the animation, and without
    // this the row would sit there highlighted long after the moment it marked.
    if(row) { row.classList.add('justadded'); setTimeout(() => row.classList.remove('justadded'), 2000); }
    flashRoleId = null;
  }
  loadPropertyMap(p);
}

// Renders immediately if the property already has coordinates; otherwise asks the server
// to geocode it once (from the address on file) and caches the result, so this only ever
// costs a round trip to Nominatim the FIRST time a given property is opened.
async function loadPropertyMap(p){
  if(p.lat != null && p.lng != null){
    renderMiniMap('prop-map', [{lat: p.lat, lng: p.lng, html: `<b>${esc(p.name)}</b>`}]);
    return;
  }
  const el = document.getElementById('prop-map');
  if(el) el.innerHTML = '<div class="empty-msg">Locating on the map...</div>';
  try {
    const r = await fetch('/api/property/'+p.id+'/geocode', {method:'POST'});
    const j = await r.json();
    if(curPid === p.id && j && j.lat != null && j.lng != null){
      renderMiniMap('prop-map', [{lat: j.lat, lng: j.lng, html: `<b>${esc(p.name)}</b>`}]);
    } else if(el){
      el.innerHTML = '<div class="empty-msg">No location on file for this address yet.</div>';
    }
  } catch(e){
    if(el) el.innerHTML = '<div class="empty-msg">Could not look up a location right now.</div>';
  }
}

// ---------- notes / activity (shared by properties and contacts) ----------
let curPid = null, curActs = [], curProp = null, curOwnership = [], curOwnerLLC = null,
    curPropAddr = null, curPropCSZ = null;
// Names already on this property's real-estate-owner stack (see renderProperty), plus the
// role row a just-promoted contact created, so it can be flashed once on the repaint.
let curOwnerNames = new Set(), flashRoleId = null;
function nameKey(s){ return (s||'').toUpperCase().replace(/[.,]/g,' ').replace(/\s+/g,' ').trim(); }
let curEntityId = null, curContactId = null;
const NOTE_TYPES = [['call','Call'],['note','Note'],['meeting','Meeting'],['email','Email'],['follow_up','Follow-up'],['other','Other']];
function noteTypeLabel(t){ const m=Object.fromEntries(NOTE_TYPES); return m[t]||t; }
function todayISO(){ const d=new Date(); const l=new Date(d.getTime()-d.getTimezoneOffset()*60000); return l.toISOString().slice(0,10); }

// ---------- last call: a one-click "I called these people" date pin plus the note that
// goes with it -- shown next to any property/company/contact, anywhere in the UI, as a
// small clickable chip. Click it, type what happened, hit Save (or just pin a date).
// Hap, 2026-09-17: it reads "Log call" and carries no icon -- calls are what gets logged
// here, and a phone glyph beside the words said nothing the words didn't.
function fmtTouchDate(s){
  if(!s) return null;
  const bits = s.slice(0,10).split('-');
  if(bits.length !== 3) return s;
  const d = new Date(Number(bits[0]), Number(bits[1])-1, Number(bits[2]));
  if(isNaN(d)) return s;
  const opts = {month:'short', day:'numeric'};
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
}
// kind: 'property' | 'entity' | 'contact'. refreshFnName is the NAME of a global function
// (called by name, not a closure) that re-fetches and repaints wherever this chip lives --
// keeps this string-templated, so a function reference can't survive being baked into HTML.
// dateStr may also be the literal sentinel 'DNC' (not worth calling), stored in the same
// column as a real date -- _max_date on the server excludes it from date comparisons.
// `hot` controls the flame rendered beside the chip: omitted stars the same record the chip
// pins, an object {kind, id, label} stars something else (the owner behind a property row),
// and false suppresses it where a star would be meaningless.
function touchChip(kind, id, dateStr, refreshFnName, hot){
  if(!id) return '';
  const isDnc = dateStr === 'DNC';
  const label = isDnc ? 'DNC' : (dateStr ? fmtTouchDate(dateStr) : 'Log call');
  const cls = isDnc ? 'touchchip dnc' : (dateStr ? 'touchchip has-date' : 'touchchip');
  const title = isDnc ? 'Marked do-not-contact — click to change'
    : (dateStr ? ('Last call ' + dateStr + ' — click to change') : "Click to log today's call");
  const chip = `<span class="${cls}" data-touch-kind="${esc(kind)}" data-touch-id="${esc(id)}" data-touch-refresh="${esc(refreshFnName||'')}"
    onclick="event.stopPropagation();openTouchPop(this)" title="${esc(title)}">${esc(label)}</span>`;
  if(hot === false) return chip;
  const h = hot || {kind, id};
  return `<span class="touchgrp">${chip}${hotBtn(h.kind, h.id, h.label)}</span>`;
}

// ---------- hot prospects ----------
// The shortlist Hap actually works, kept deliberately separate from every computed roster in
// this app: those answer "who COULD I call", this one answers "who am I working right now".
// HOT mirrors the server's set of starred (kind, id) so a flame can be painted next to any
// chip without a per-chip lookup -- it is a shortlist, so the whole thing is a cheap fetch.
// HOT maps each starred "kind:id" to its bucket. Three buckets, coldest to hottest -- the
// flame asks which one rather than just toggling, and the Hot Prospects page shows one
// bucket at a time.
let HOT = new Map(), HOT_COUNT = 0;
const HOT_STAGES = [
  ['not_worth',     'DNC · not worth calling',      'Not worth the time. Off the call lists'],
  ['dnc',           'DNC · yelled at, unless feeling spicy', 'Told us off. Leave them alone unless you feel spicy'],
  ['needs_contact', 'Needs contact',                'Worth calling, haven’t reached them yet'],
  ['keep_in_touch', 'Good convo · keep in touch',   'Talked, not ready yet, stay on them'],
  ['hot',           'Hot prospect · BOV worthy',    'Ready for a BOV conversation'],
];
const HOT_STAGE_SHORT = {not_worth: 'DNC · not worth calling', dnc: 'DNC · yelled at', needs_contact: 'Needs contact', keep_in_touch: 'Keep in touch', hot: 'Hot · BOV'};
function hotKey(kind, id){ return kind + ':' + id; }
function isHot(kind, id){ return HOT.has(hotKey(kind, id)); }
function hotStage(kind, id){ return HOT.get(hotKey(kind, id)) || null; }
function hotTitle(kind, id, label){
  const st = hotStage(kind, id);
  return st ? ('Hot Prospects: ' + HOT_STAGE_SHORT[st] + ' — click to move or remove')
            : ('Add ' + (label || 'this') + ' to Hot Prospects');
}
// `label` only names the thing in the tooltip. `kind`/`id` is what actually gets starred --
// on a roster whose chip is a PROPERTY, callers pass the owner entity instead, since the Hot
// Prospects page is an owner summary and that is the record Hap means by "this one is hot".
function hotBtn(kind, id, label){
  if(!id) return '';
  const st = hotStage(kind, id);
  return `<span class="hotbtn${st?' on st-'+st:''}" data-hk="${esc(kind)}" data-hi="${esc(id)}" data-hl="${esc(label||'')}"
    onclick="event.stopPropagation();openHotMenu(this)" title="${esc(hotTitle(kind, id, label))}">&#128293;</span>`;
}
// The bucket picker the flame opens: three choices, plus remove when it is already on.
function closeHotMenu(){
  const m = document.getElementById('hot-menu');
  if(m) m.remove();
  document.removeEventListener('click', hotMenuOutside, true);
}
function hotMenuOutside(ev){
  const m = document.getElementById('hot-menu');
  if(m && !m.contains(ev.target)) closeHotMenu();
}
function openHotMenu(el){
  closeHotMenu();
  const kind = el.dataset.hk, id = el.dataset.hi, cur = hotStage(kind, id);
  const m = document.createElement('div');
  m.id = 'hot-menu'; m.className = 'hot-menu';
  m.innerHTML = `<div class="hm-h">&#128293; Hot Prospects</div>`
    + HOT_STAGES.slice().reverse().map(([k, lbl, sub]) => `<div class="hm-opt st-${k}${cur===k?' cur':''}" data-st="${k}">
        <b>${esc(lbl)}</b>${cur===k?' <span class="hm-cur">&#10003; here now</span>':''}<span>${esc(sub)}</span></div>`).join('')
    + (cur ? `<div class="hm-rm" data-st="">Remove from Hot Prospects</div>` : '');
  for(const o of m.querySelectorAll('[data-st]')){
    o.onclick = async (ev) => { ev.stopPropagation(); closeHotMenu(); await setHot(kind, id, o.dataset.st || null); };
  }
  document.body.appendChild(m);
  const r = el.getBoundingClientRect();
  const w = m.getBoundingClientRect().width || 260, h = m.getBoundingClientRect().height || 200;
  m.style.left = Math.max(6, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(6, Math.min(r.bottom + 6, window.innerHeight - h - 8)) + 'px';
  setTimeout(() => document.addEventListener('click', hotMenuOutside, true), 0);
}
// On the property rosters the flame should pin the OWNER -- Hot Prospects is an owner

function paintHotCount(){

async function loadHotIds(){
  const d = await apiJSON('/api/hot/ids');
  if(!d || d.error){
    // Stays quiet on purpose: this runs on every page load, and an alert here would fire
    // before Hap has asked for anything. The flames render cold, and the real message comes
    // the moment he clicks one (toggleHot) or opens the page (renderHot).
    HOT = new Map(); HOT_COUNT = 0;
  } else {
    HOT = new Map();
    const st = d.stages || {};
    for(const k in (d.ids||{})) for(const id of d.ids[k]){
      const key = hotKey(k, id); HOT.set(key, st[key] || 'hot');

    HOT_COUNT = d.count || 0;

let hotToastTimer = null;
function hotToast(msg){
  let el = document.getElementById('hot-toast');

    document.body.appendChild(el); }

// Repaint every flame on screen for this record -- the same owner/contact can be showing in
// several places at once (a roster row, the Recent sidebar's target, an open profile).
function syncHotButtons(kind, id){
  for(const b of document.querySelectorAll('.hotbtn')){
    if(b.dataset.hk !== kind || b.dataset.hi !== id) continue;
    const st = hotStage(kind, id);
    b.className = 'hotbtn' + (st ? ' on st-' + st : '');
    b.title = hotTitle(kind, id, b.dataset.hl);
  }
  for(const b of document.querySelectorAll('.tp-hotrow')){
    if(b.dataset.hk === kind && b.dataset.hi === id) b.outerHTML = hotPopRow(kind, id);
  }
}
// Put one record in a bucket (stage = one of HOT_STAGES keys) or take it off (stage = null).
function isDncStage(s){ return s === 'dnc' || s === 'not_worth'; }
async function setHot(kind, id, stage){
  const prevStage = hotStage(kind, id);
  const body = stage ? {kind, id, stage} : {kind, id, on: false};
  const d = await apiJSON('/api/hot', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  if(!d || d.error){ alert('Could not update Hot Prospects.\n\n' + ((d && d.error) || 'unknown error')); return; }
  if(d.on) HOT.set(hotKey(kind, id), d.stage || stage); else HOT.delete(hotKey(kind, id));
  HOT_COUNT = d.count || 0;
  paintHotCount();
  syncHotButtons(kind, id);
  hotToast(d.on ? '&#128293; Hot Prospects: ' + esc(HOT_STAGE_SHORT[d.stage || stage] || '')
                : 'Removed from Hot Prospects');
  // Moving or removing FROM the hot page has to move/drop the row too, not just recolor the flame.
  if((location.hash||'').replace(/^#/,'').startsWith('hot')) touchRefreshHot();
  // DNC is also pinned in the record's last-contact column server-side, so entering or
  // leaving the DNC bucket changes the chip on whatever page is open: repaint it.
  else if(isDncStage(stage) || isDncStage(prevStage)){
    try { targetsPageCache.clear(); dbPageCache.clear(); devPageCache.clear(); } catch(e){}
    route();
  }
}
// A two-line preview of the last call/activity note, rendered right beside the last-contact
// chip on every call list (Owner Targets, New Development, the Salesforce call list). Click
// to expand the whole note in place; the full history lives on the property/contact page.
// Reads last_note / last_note_date / last_note_type, the triple _note_fields() puts on every
// list row server-side.
function notePreview(r, empty){
  if(!r || !r.last_note) return (empty===false ? '' : '<span class="empty">-</span>');
  const when = r.last_note_date ? fmtTouchDate(r.last_note_date) : '';
  const kind = (r.last_note_type && r.last_note_type !== 'note') ? noteTypeLabel(r.last_note_type) : '';
  const tag = [when, kind].filter(Boolean).join(' · ');
  return `<div class="notecell" title="Click to expand/collapse"
    onclick="event.stopPropagation();this.classList.toggle('expanded')">${tag?`<span class="nd">${esc(tag)}</span>`:''}${esc(r.last_note)}</div>`;
}

// The Notes cell used by every roster (Owner Targets, Recently Databased, New Development).
// One click expands past the two-line clamp so a long note is readable in place; a
// double-click (or the hover pencil) opens an inline editor. An empty cell offers "+ note",
// which writes a brand new note against this row's own record. `kind` is 'property' or
// 'development' -- what a new note gets attached to, and which roster caches to patch.
function noteCell(r, kind, recId){
  const data = `data-nk="${esc(kind)}" data-nrec="${esc(recId)}"`
    + ` data-nid="${esc(r.last_note_id||'')}" data-ned="${r.last_note_editable?'1':'0'}"`
    + ` data-nbody="${esc(r.last_note||'')}" data-ndate="${esc(r.last_note_date||'')}"`
    + ` data-ntype="${esc(r.last_note_type||'note')}" data-nvia="${esc(r.last_note_via||'')}"`;
  if(!r.last_note){
    return `<div class="notecell-wrap" ${data}>
      <span class="note-add" title="Add a note" onclick="openNoteEditor(this)">+ note</span></div>`;
  }
  const when = r.last_note_date ? fmtTouchDate(r.last_note_date) : '';
  const kindLbl = (r.last_note_type && r.last_note_type !== 'note') ? noteTypeLabel(r.last_note_type) : '';
  const tag = [when, kindLbl].filter(Boolean).join(' · ');
  const pencil = r.last_note_editable
    ? `<span class="np-edit" title="Edit this note" onclick="event.stopPropagation();openNoteEditor(this)">&#9998;</span>` : '';
  // The note rolls up the same relationship the chip does, so name where it was actually
  // logged whenever that is not this row itself -- a sibling building of the same owner,
  // or the owner company's own call log.
  const via = r.last_note_via
    ? `<span class="nvia" title="Logged on ${esc(r.last_note_via)} — same owner as this building">via ${esc(r.last_note_via)}</span>` : '';
  return `<div class="notecell-wrap" ${data}>${pencil}
    <div class="notecell" title="Click to expand · double-click to edit"
      onclick="this.classList.toggle('expanded')"
      ondblclick="event.stopPropagation();openNoteEditor(this)">${tag?`<span class="nd">${esc(tag)}</span>`:''}${esc(r.last_note)}</div>${via}</div>`;
}

// Swap the cell for an editor. An imported note (source != 'ui') can't be rewritten -- the
// server refuses that, so say so here rather than letting the save fail -- but a NEW note
// can always be added alongside it, which is what the editor does in that case.
function openNoteEditor(el, fresh){
  const w = el.closest('.notecell-wrap');
  if(w.querySelector('.note-edit') && !fresh) return;   // already open
  // Opening a cell that already holds one of your notes edits THAT note -- carry on where
  // you left off rather than starting a blank one. `fresh` is the escape hatch behind the
  // "+ new" link, for logging a second, separate call on a record that already has a note.
  const editing = w.dataset.ned === '1' && !!w.dataset.nid && !fresh;
  const imported = !!w.dataset.nid && !editing && !fresh;
  const body = editing ? w.dataset.nbody : '';
  const type = editing ? (w.dataset.ntype || 'note') : 'call';
  const date = (editing && w.dataset.ndate) ? w.dataset.ndate : todayISO();
  const opts = NOTE_TYPES.map(t=>`<option value="${t[0]}" ${t[0]===type?'selected':''}>${t[1]}</option>`).join('');
  // saveNoteCell and deleteNoteCell re-read intent from the dataset, not from this call's
  // arguments, so "write a NEW note" has to be recorded on the element -- otherwise a save
  // after "+ new" still sees the stored note's id and overwrites it instead of adding one.
  w.dataset.nfresh = fresh ? '1' : '';
  if(!fresh) w._prev = w.innerHTML;   // keep the ORIGINAL cell as cancel's restore point
  w.innerHTML = `<div class="note-edit">
    ${imported?`<div class="note-ro">The note on file was imported and can&rsquo;t be edited &mdash; saving adds a new one.</div>`:''}
    <div class="row"><select class="np-type">${opts}</select><input type="date" class="np-date" value="${esc(date)}"></div>
    <textarea class="np-body" rows="4" placeholder="What happened on the call?  (Ctrl+Enter to save, Esc to cancel)"
      onkeydown="noteEditorKeys(event, this)">${esc(body)}</textarea>
    <div class="row"><button class="btn" onclick="saveNoteCell(this)">Save</button>
      <a onclick="cancelNoteCell(this)">cancel</a>
      ${editing?`<a onclick="openNoteEditor(this, true)" title="Keep the note above and log a separate one">+ new</a>`:''}
      ${editing?`<a class="np-del" onclick="deleteNoteCell(this)">delete</a>`:''}</div>
  </div>`;
  const ta = w.querySelector('.np-body');
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
}

function noteEditorKeys(ev, ta){
  if((ev.ctrlKey||ev.metaKey) && ev.key === 'Enter'){ saveNoteCell(ta); return; }
  if(ev.key === 'Escape'){ ev.stopPropagation(); cancelNoteCell(ta); }
}

function cancelNoteCell(el){
  const w = el.closest('.notecell-wrap');
  if(!w) return;
  w.dataset.nfresh = '';
  if(w._prev != null) w.innerHTML = w._prev;
}

async function saveNoteCell(el){
  const w = el.closest('.notecell-wrap');
  const ta = w.querySelector('.np-body');
  const body = ta.value.trim();
  if(!body){ ta.focus(); return; }
  const type = w.querySelector('.np-type').value;
  const date = w.querySelector('.np-date').value;
  const occurred = date ? date+'T12:00:00Z' : '';
  const kind = w.dataset.nk, recId = w.dataset.nrec;
  const editing = w.dataset.ned === '1' && !!w.dataset.nid && w.dataset.nfresh !== '1';
  const url = editing ? '/api/activities/'+encodeURIComponent(w.dataset.nid) : '/api/activities';
  const payload = {activity_type:type, occurred_at:occurred, body};
  if(!editing) payload[kind==='development'?'development_id':'property_id'] = recId;
  const btn = w.querySelector('.btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  let d = null;
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    d = await r.json();
  } catch(e){ d = {error: String(e)}; }
  if(!d || d.error){
    alert('Could not save note: ' + ((d && d.error) || 'unknown error'));
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
    return;
  }
  noteSaved(kind, recId, d.activity);
}

async function deleteNoteCell(el){
  const w = el.closest('.notecell-wrap');
  if(!w.dataset.nid || w.dataset.nfresh === '1') return;   // nothing written yet to delete
  if(!confirm('Delete this note?')) return;
  const r = await fetch('/api/activities/'+encodeURIComponent(w.dataset.nid), {method:'DELETE'});
  const d = await r.json();
  if(d.error){ alert('Could not delete note: '+d.error); return; }
  noteSaved(w.dataset.nk, w.dataset.nrec, null);
}

// The paint* functions end with window.scrollTo(0,0), which is right when they are painting
// a page you just navigated to and wrong when they are repainting the page you are already
// reading. Editing a note halfway down a roster should leave you exactly where you were.
function keepScroll(paint){
  const y = window.scrollY;
  paint();
  window.scrollTo(0, y);
}

function patchRowNote(row, act){
  row.last_note = act ? act.body : null;
  row.last_note_date = act ? (act.occurred_at||'').slice(0,10) : null;
  row.last_note_type = act ? act.activity_type : null;
  row.last_note_id = act ? act.id : null;
  row.last_note_editable = !!(act && act.source === 'ui');
}

// Write the saved note back onto whatever roster rows are on screen, then repaint from
// memory. Same reasoning as touchRefreshTargets: a full refetch here would mean a page-wide
// spinner and losing your place in the list just to update one cell. The server busts its
// own roster caches on the write, and the page caches are dropped below, so the next fresh
// load is still correct.
function noteSaved(kind, recId, act){
  // A note is also a touch -- the server bumps the record's last-contact date when the note
  // is the newer of the two, so mirror that onto the chip instead of leaving it stale.
  const when = act ? (act.occurred_at||'').slice(0,10) : null;
  // A DELETE can't be patched in memory: whatever older note it was hiding should surface
  // in its place, and only the server knows what that is. Refetch for that one case.
  if(!act){
    targetsPageCache.clear(); dbPageCache.clear(); devPageCache.clear(); apPageCache.clear();
    route();
    return;
  }
  if(kind === 'development'){
    if(devLast && devLast.developments){
      const row = devLast.developments.find(x => x.id === recId);
      if(row){
        patchRowNote(row, act);
        if(when && !row.is_dnc && (!row.last_contact_date || when > row.last_contact_date)){
          row.last_contact_date = when;
        }
      }
      keepScroll(paintDevelopments);
    }
    devPageCache.clear();
    return;
  }
  // A property can be on either property roster; patch whichever ones are loaded.
  if(targetsLast && targetsLast.targets){
    const row = targetsLast.targets.find(x => x.id === recId);
    if(row){
      patchRowNote(row, act);
      row.last_note_via = null;                  // it was just written on THIS building
      // Owner Targets rolls BOTH the chip and the note up to the owner, not to the single
      // building, so a note written here lands on every sibling row for the same owner --
      // mirroring what the server would return on a fresh load.
      const ownerKey = (row.owner||'').trim().toLowerCase();
      for(const r of targetsLast.targets){
        if(r === row || (r.owner||'').trim().toLowerCase() !== ownerKey) continue;
        if(when && !r.is_dnc && (!r.portfolio_last_contact || when > r.portfolio_last_contact)){
          r.portfolio_last_contact = when;
        }
        if(!r.last_note_date || when >= r.last_note_date){
          patchRowNote(r, act);
          r.last_note_via = row.name;
        }
      }
      if(when && !row.is_dnc && (!row.portfolio_last_contact || when > row.portfolio_last_contact)){
        row.portfolio_last_contact = when;
      }
    }
  }
  if(dbLast && dbLast.databased){
    const row = dbLast.databased.find(x => x.id === recId);
    if(row){
      patchRowNote(row, act);
      if(when && !row.is_dnc && (!row.last_contact || when > row.last_contact)) row.last_contact = when;
    }
  }
  if(apLast && apLast.properties){
    const row = apLast.properties.find(x => x.id === recId);
    if(row){
      patchRowNote(row, act);
      if(when && !row.is_dnc && (!row.last_contact || when > row.last_contact)) row.last_contact = when;
    }
  }
  const onHash = (location.hash||'').replace(/^#/,'');
  if(onHash.startsWith('databased')) keepScroll(paintDatabased);
  else if(onHash.startsWith('allprops') && apLast) keepScroll(paintAllProps);
  else if(targetsLast) keepScroll(paintTargets);
  targetsPageCache.clear();
  dbPageCache.clear();
  apPageCache.clear();
}

let curTouchPop = null;
function closeTouchPop(){
  if(!curTouchPop) return;
  curTouchPop.remove(); curTouchPop = null;
  document.removeEventListener('click', touchPopOutside, true);
}
function touchPopOutside(ev){
  if(curTouchPop && !curTouchPop.contains(ev.target)) closeTouchPop();
}
function openTouchPop(chip){
  const reopening = curTouchPop && curTouchPop._chip === chip;
  closeTouchPop();
  if(reopening) return;
  const kind = chip.dataset.touchKind, id = chip.dataset.touchId, refresh = chip.dataset.touchRefresh;
  const td = todayISO();
  const pop = document.createElement('div');
  pop.className = 'touch-pop';
  pop.dataset.kind = kind; pop.dataset.id = id; pop.dataset.refresh = refresh;
  // Quick note, right where you pin the date: type what happened, then hit Today (or pick a
  // date, or DNC) and both are saved together. It writes a real core_activities row through
  // the same /api/activities the Call Log panel uses -- same type, same date, same log --
  // so a call logged here shows up there, and on every page that shares the record: the
  // building, its people, and the owner company above them.
  const canNote = true;
  const typeOpts = NOTE_TYPES.map(t=>`<option value="${t[0]}" ${t[0]==='call'?'selected':''}>${t[1]}</option>`).join('');
  // Two ways out of this popup, in order of what you reach for most: write a note and hit
  // Save (which logs the note AND stamps the date beside it), or just pin a date with one of
  // the buttons below. The date input sits with the note, since Save uses whatever is in it.
  pop.innerHTML = (canNote ? `<select class="tp-type">${typeOpts}</select>
    <textarea class="tp-note" rows="2" placeholder="Quick note (optional) &mdash; left VM, sent email..."
      onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')saveNoteAndDate(this)"></textarea>
    <input type="date" class="tp-date" value="${td}" onchange="if(!this.closest('.touch-pop').querySelector('.tp-note').value.trim())saveTouchFrom(this,this.value)">
    <button type="button" class="btn tp-save" onclick="saveNoteAndDate(this)">Save note &amp; date</button>
    <span class="tp-or">or just log the date</span>
    <button type="button" class="btn tp-today" onclick="saveTouchFrom(this,'${td}')">Today &middot; ${td}</button>`
    : `<button type="button" class="btn tp-today" onclick="saveTouchFrom(this,'${td}')">Today &middot; ${td}</button>
    <input type="date" class="tp-date" value="${td}" onchange="saveTouchFrom(this,this.value)">`)
    + `<button type="button" class="btn tp-dnc" onclick="saveTouchFrom(this,'DNC')" title="Not worth calling">DNC</button>
    <a class="tp-clear" onclick="saveTouchFrom(this,'')">Clear date</a>`
    // "Was that call worth following up on?" is decided right here, while the note is being
    // written -- so the hot-list toggle sits in the popup rather than being a separate hunt
    // for the flame outside it. Stars whatever the chip's own hot target is (the owner
    // behind a property row, on the rosters that pass one).
    + hotPopButton(chip);
  document.body.appendChild(pop);
  const rect = chip.getBoundingClientRect();
  let left = rect.left;
  if(left + 230 > window.innerWidth) left = window.innerWidth - 236;
  pop.style.left = Math.max(6, left) + 'px';
  // Keep the whole popup on screen -- it is a good deal taller now that it carries the note
  // field, so measure it rather than assuming a fixed height.
  const h = pop.getBoundingClientRect().height || 150;
  pop.style.top = Math.max(6, Math.min(rect.bottom + 6, window.innerHeight - h - 8)) + 'px';
  curTouchPop = pop; pop._chip = chip;
  setTimeout(() => document.addEventListener('click', touchPopOutside, true), 0);
}
// Set by saveTouchFrom right before invoking the refresh hook, so a hook that wants to patch
// the currently-rendered data in place (rather than refetch it) knows what just changed
// without every refresh function needing its own copy of (kind, id, date) plumbed through.
let lastTouchSave = null, lastTouchResult = null;
// True when the touch that just saved also wrote a note. The roster refresh hooks patch a
// single chip in memory to avoid a spinner, but they can't work out what a new note does to
// the owner-portfolio note rollup -- so when one was written they refetch instead.
let lastTouchNote = false;
// The Save button: log the note against whatever date is sitting in the picker above it.
// Empty note, empty date -- both fine, it just falls through to pinning the date.
// The hot-list row inside the touch popup. Reads its target off the flame that sits beside
// the chip, so the popup always stars exactly what the flame would.
function hotPopButton(chip){
  const btn = chip.parentElement && chip.parentElement.querySelector
    ? chip.parentElement.querySelector('.hotbtn') : null;
  if(!btn) return '';
  return hotPopRow(btn.dataset.hk, btn.dataset.hi);
}
// Same three buckets as the flame's menu, as one row of buttons: the bucket it is in now is
// lit, clicking another moves it, and "remove" shows once it is on the list.
function hotPopRow(kind, id){
  const cur = hotStage(kind, id);
  const btns = HOT_STAGES.slice().reverse().map(([k]) => `<button type="button" class="btn tp-hot st-${k}${cur===k?' on':''}"
    title="${esc(HOT_STAGES.find(s=>s[0]===k)[1])}"
    onclick="event.stopPropagation();setHot('${esc(kind)}','${esc(id)}','${k}')">${esc(HOT_STAGE_SHORT[k])}</button>`).join('');
  return `<div class="tp-hotrow" data-hk="${esc(kind)}" data-hi="${esc(id)}">
    <div class="tp-hotlbl">&#128293; Hot Prospects${cur?` &middot; <a onclick="event.stopPropagation();setHot('${esc(kind)}','${esc(id)}',null)">remove</a>`:''}</div>
    <div class="tp-hotbtns">${btns}</div></div>`;
}

function saveNoteAndDate(el){
  const pop = el.closest('.touch-pop');
  return saveTouchFrom(el, pop.querySelector('.tp-date').value || todayISO());
}

async function saveTouchFrom(el, date){
  const pop = el.closest('.touch-pop');
  const kind = pop.dataset.kind, id = pop.dataset.id, refresh = pop.dataset.refresh;
  const noteEl = pop.querySelector('.tp-note');
  // "Clear date" is an undo -- saving a note alongside it would immediately re-stamp the
  // date it just cleared (the server bumps last-contact from any note), so skip it there.
  const body = (date === '' || !noteEl) ? '' : noteEl.value.trim();
  pop.style.opacity = '.5'; pop.style.pointerEvents = 'none';
  try {
    // Note first, then the date pin: writing a note bumps the record's last-contact date on
    // the server, so the explicit pin has to land last or it would be overwritten -- most
    // visibly on DNC, which a note's own date would otherwise wipe straight back out.
    if(body){
      const occurred = (date && date !== 'DNC') ? date + 'T12:00:00Z' : todayISO() + 'T12:00:00Z';
      const payload = {activity_type: pop.querySelector('.tp-type').value, occurred_at: occurred, body};
      payload[ACT_ID_KEY[kind] || 'property_id'] = id;
      const nr = await fetch('/api/activities', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)});
      const nd = await nr.json();
      if(nd.error){
        alert('Could not save the note: '+nd.error);
        pop.style.opacity = ''; pop.style.pointerEvents = '';
        return;
      }
    }
    const r = await fetch('/api/touch', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({kind, id, date})});
    const d = await r.json();
    if(d.error){ alert('Could not save: '+d.error); closeTouchPop(); return; }
    lastTouchResult = d;
  } catch(e){
    alert('Could not reach the server.'); closeTouchPop(); return;
  }
  // Say so. A note logged against a record that was ALREADY dated today changes nothing you
  // can see -- the chip keeps the same date and the popup just vanishes -- which reads as
  // "it didn't save". Hold the popup open for a beat on the confirmation instead.
  if(body){
    pop.innerHTML = '<div class="tp-saved">&#10003; Note saved</div>';
    pop.style.opacity = '';
    await new Promise(r => setTimeout(r, 800));
  }
  closeTouchPop();
  lastTouchSave = {kind, id, date: date || null};
  lastTouchNote = !!body;
  const fn = window[refresh];
  if(typeof fn === 'function') fn();
  lastTouchNote = false;
}
// Refresh hooks: re-fetch + repaint whichever view is currently open, bypassing that view's
// own page cache (which has no way to know a touch just changed the data underneath it).
function touchRefreshProperty(){ if(curPid) renderProperty(curPid); }
function touchRefreshEntity(){
  // Logging a call on a person listed as an owner makes their contact profile (server side);
  // go straight to it, since that is the page every later click lands on anyway.
  const made = lastTouchResult && lastTouchResult.person_created;
  lastTouchResult = null;
  if(made){ location.hash = 'contact/' + made; return; }
  if(curEntityId) renderEntity(curEntityId);
}
function touchRefreshContact(){ if(curContactId) renderContact(curContactId); }
// Owner Targets is a big roster (hundreds of rows, an expensive server-side recompute) --
// a full refetch-and-repaint here means a page-wide spinner and losing your place in the
// list just to update one chip. Patch the touched row (and its owner's sibling rows already
// on this page, mirroring the server's per-owner-portfolio rollup) in memory instead, then
// repaint from that -- no network round trip. The server's own cache still gets invalidated
// by the /api/touch call, so a later fresh load (a new page, a filter change) is correct even
// for sibling rows this page doesn't currently hold.
function touchRefreshTargets(){
  const t = lastTouchSave;
  if(!lastTouchNote && t && t.kind === 'property' && targetsLast && targetsLast.targets){
    const rows = targetsLast.targets;
    const row = rows.find(r => r.id === t.id);
    if(row){
      const ownerKey = (row.owner||'').trim().toLowerCase();
      if(t.date === 'DNC'){
        row.is_dnc = true;
      } else if(t.date){
        row.is_dnc = false;
        for(const r of rows){
          if((r.owner||'').trim().toLowerCase() === ownerKey &&
             (!r.portfolio_last_contact || t.date > r.portfolio_last_contact)){
            r.portfolio_last_contact = t.date;
          }
        }
      } else {
        row.is_dnc = false;
        row.portfolio_last_contact = null; // best-effort; a fresh load recomputes the true
      }                                     // rollup if a sibling elsewhere still has one
    }
    paintTargets();
    return;
  }
  targetsPageCache.clear();
  renderTargets(targetsState, targetsMetro, targetsRegion, targetsSort, targetsDir, (targetsLast&&targetsLast.offset)||0);
}
// Recently Databased is paginated in SQL rather than sliced from a cached roster, so there
// is no server-side cache to bust here -- just patch the row on screen and repaint.
function touchRefreshDatabased(){
  const t = lastTouchSave;
  if(!lastTouchNote && t && t.kind === 'property' && dbLast && dbLast.databased){
    const row = dbLast.databased.find(r => r.id === t.id);
    if(row){
      row.is_dnc = t.date === 'DNC';
      row.last_contact = t.date === 'DNC' ? null : (t.date || null);
    }
    paintDatabased();
    return;
  }
  dbPageCache.clear();
  renderDatabased(dbCurState, dbSort, dbDir, (dbLast && dbLast.offset) || 0);
}
// Same instant in-place patch as touchRefreshTargets -- New Development is the same shape
// of big roster + expensive server-side cache, so a full refetch-and-repaint here would be
// the identical "Loading..." flash-and-lose-your-place Hap flagged on Owner Targets. No
// portfolio rollup to mirror onto sibling rows though: a development is a one-off project,
// not one of several properties sharing an owner, so this only ever touches the one row.
function touchRefreshDevelopments(){
  const t = lastTouchSave;
  if(!lastTouchNote && t && t.kind === 'development' && devLast && devLast.developments){
    const row = devLast.developments.find(r => r.id === t.id);
    if(row){
      row.is_dnc = t.date === 'DNC';
      row.last_contact_date = t.date === 'DNC' ? null : (t.date || null);
    }
    paintDevelopments();
    return;
  }
  devPageCache.clear();
  renderDevelopments(devState, devCbsa, devStage, devSubclass, devSort, devDir, (devLast&&devLast.offset)||0);
}

// Property-level notes panel (full panel with heading)
function notesPanel(pid, acts){
  return `<div class="panel notes-panel">
    <h2>Call Log</h2>
    ${notesBlock('property', pid, acts)}
  </div>`;
}

// Reusable notes block: an add form + a scoped list. Works for a property, a contact, or
// a development.
function notesBlock(kind, id, acts){
  return `<div class="notes-block">
    ${noteForm()}
    <div class="notes-list" data-kind="${kind}" data-id="${esc(id)}">${notesListHTML(acts)}</div>
  </div>`;
}

function noteForm(){
  const opts = NOTE_TYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('');
  return `<div class="note-form">
    <div class="row">
      <select class="nf-type">${opts}</select>
      <input type="date" class="nf-date" value="${todayISO()}">
      <button type="button" class="btn" onclick="quickNote(this,'Left voicemail')">Left Voicemail</button>
      <button type="button" class="btn" onclick="quickNote(this,'LM and sent email')">LM and sent email</button>
      <button type="button" class="btn tp-dnc" onclick="quickDnc(this,'not_worth')" title="Not worth calling: log it and put them on the DNC list">DNC</button>
      <button type="button" class="btn tp-dnc" onclick="quickDnc(this,'dnc')" title="Yelled at: DNC unless feeling spicy">DNC &middot; yelled at</button>
    </div>
    <textarea class="nf-body" rows="2" placeholder="Log a call...  (Ctrl+Enter to save)"
      onkeydown="if((event.ctrlKey||event.metaKey)&&event.key==='Enter')addNoteFrom(this)"></textarea>
    <div class="row"><button class="btn" onclick="addNoteFrom(this)">Save note</button></div>
  </div>`;
}

// One feed per page, and it holds more than this record's own notes: the server rolls in
// the calls logged next door (a.via -- the person, the building, the owner company), so
// "what did I last say to these people" is answered wherever you happen to be standing.
// A borrowed note is read-only here and links back to where it lives; only this record's
// own notes carry edit/delete, since that is where a rewrite is unambiguous.
function noteHref(v){
  if(!v || !v.id) return '';
  return v.kind === 'contact' ? 'contact/' + v.id
       : (v.kind === 'entity' ? 'entity/' + v.id
       : (v.kind === 'property' ? 'property/' + v.id : ''));
}

// `also` are the other records the SAME note was logged on the same day -- one note written
// across a group of people (everyone tied to a building that sold, say). The server folds
// them into one line; this names the first and offers the rest behind "and N others", which
// expands into real links rather than hiding them. Nothing is lost: each person's own page
// still carries their copy.
function noteViaLink(v, also){
  if(!v || !v.id) return '';
  const href = noteHref(v);
  const label = 'logged on ' + (v.name || 'another record');
  const head = href
    ? `<a class="note-via" onclick="event.stopPropagation();location.hash='${esc(href)}'"
        title="Open ${esc(v.name||'')}">${esc(label)} &rarr;</a>`
    : `<span class="note-via">${esc(label)}</span>`;
  also = (also || []).filter(x => x && x.id);
  if(!also.length) return head;
  const links = also.map(x => {
    const h = noteHref(x);
    return h ? `<a onclick="event.stopPropagation();location.hash='${esc(h)}'">${esc(x.name||'')}</a>`
             : esc(x.name||'');
  }).join(', ');
  return head + ` <span class="note-also" title="The same note was logged on each of them"
    onclick="event.stopPropagation();this.nextElementSibling.style.display=this.nextElementSibling.style.display?'':'none';this.style.display='none'"
    >and ${also.length} other${also.length===1?'':'s'}</span><span class="note-also-list" style="display:none">${links}</span>`;
}

function notesListHTML(acts){
  acts = acts || [];
  if(!acts.length) return '<div class="empty-msg">No calls logged yet.</div>';
  let h='';
  for(const a of acts){
    const dt = (a.occurred_at||'').slice(0,10);
    const actions = a.via
      ? noteViaLink(a.via, a.via_also)
      : `<a onclick="startEditNote(this)">edit</a>
         <a onclick="deleteNote(this)">delete</a>`;
    h += `<div class="note${a.via?' borrowed':''}" data-id="${esc(a.id)}" data-type="${esc(a.activity_type)}" data-date="${esc(dt)}" data-body="${esc(a.body)}">
      <div class="note-head">
        <span class="note-type ${esc(a.activity_type)}">${esc(noteTypeLabel(a.activity_type))}</span>
        <span class="note-date">${esc(dt)}</span>
        <span class="note-actions">${actions}</span>
      </div>
      <div class="note-body">${esc(a.body)}</div>
    </div>`;
  }
  return h;
}

// Corporate tails that make a comma punctuation ("Dimond Care, Llc") rather than a
// "Last, First" inversion -- mirrors _ENTITY_SUFFIXES on the server.
const NAME_SUFFIXES = new Set(['LLC','L.L.C','LLP','LP','L.P','INC','CORP','CO','LTD','PC','PLLC',
  'TRUST','COMPANY','INCORPORATED','CORPORATION','PARTNERSHIP','ASSOCIATES']);
// "Murphy, Evelina L." -> "Evelina L. Murphy". Only flips a single comma whose tail reads
// like a given name, so a company keeps its punctuation.
function spokenName(s){
  const name = (s||'').trim();
  if((name.match(/,/g)||[]).length !== 1) return name;
  const i = name.indexOf(',');
  const head = name.slice(0,i).trim(), tail = name.slice(i+1).trim();
  if(!head || !tail) return name;
  if(tail.split(/\s+/).length > 2 || NAME_SUFFIXES.has(tail.toUpperCase().replace(/\.$/,''))) return name;
  return tail + ' ' + head;
}
function contactName(c){
  const built = ((c.first_name||'')+' '+(c.last_name||'')).trim();
  return built || spokenName(c.full_name_raw) || '(name unknown)';
}

// The notes logged against one person, newest first, rendered inline under them. A note is
// only useful where you'd look for it -- next to the person you called -- so this shows up
// on the owner profile's People block and on a property's Key Contacts, not just on the
// contact's own page. Shows the date each was logged; long histories collapse after `show`.
function contactLog(c, show){
  const acts = (c.activities||[]).filter(a => a.body);
  if(!acts.length) return '';
  show = show || 3;
  const row = a => `<div class="cl-note"><span class="cl-when">${esc(fmtTouchDate((a.occurred_at||'').slice(0,10))||'')}${
    a.activity_type && a.activity_type!=='note' ? ' · '+esc(noteTypeLabel(a.activity_type)) : ''}</span>${esc(a.body)}</div>`;
  let h = `<div class="clog">` + acts.slice(0, show).map(row).join('');
  if(acts.length > show){
    h += `<div class="cl-hidden" style="display:none">${acts.slice(show).map(row).join('')}</div>
      <a class="cl-more" onclick="const b=this.previousElementSibling;const o=b.style.display==='none';b.style.display=o?'':'none';this.textContent=o?'show less':'+ ${acts.length-show} older';">+ ${acts.length-show} older</a>`;
  }
  return h + `</div>`;
}

function renderContacts(cs, opts){
  opts = opts || {};
  if(!cs || !cs.length) return opts.scope==='owner' ? '' : '<div class="empty-msg">No contacts on file.</div>';
  let h='', splitDone = false;
  // The server hands these back owner-first (rank 0/1) with facility staff last (rank 2/3).
  // Mark where the owners stop so the eye can stop there too, but only when there are
  // owners above the line AND non-owners below it.
  const hasOwners = cs.some(c => (c.rank||0) <= 1), hasOther = cs.some(c => (c.rank||0) >= 2);
  for(const c of cs){
    if(hasOwners && hasOther && !splitDone && (c.rank||0) >= 2){
      splitDone = true;
      h += `<div class="contact-split">Other contacts</div>`;
    }
    const cc = contactLine(c);   // every number and address on file, one line
    // TLO link maps to the owner-of-record lookup, never a person-specific search.
    //  - contact has a known employer (core_contact_employments) -> Businesses search on THAT
    //    entity, not just whichever owner sorts first on the property (a property can have both a
    //    TLO title-of-record owner and a separately-sourced Salesforce owner company).
    //  - else LLC owner  -> Businesses search on the LLC name.
    //  - no LLC (direct-person owner) -> Assets>Properties search by the property address, so Hap
    //    lands on the property record and judges the owner himself (a name search is too noisy).
    let turl='', tloLabel='', tq='';
    //  - an INDIVIDUAL employer (a person recorded as the owner) is NOT a business: fall
    //    through to the owner LLC / property search rather than firing a Businesses lookup
    //    on a human name, which only ever returns noise.
    if(c.employer_name && c.employer_kind !== 'INDIVIDUAL'){
      tq = c.employer_name;
      turl = 'https://tloxp.tlo.com/search.php?type=BusinessComboSearch&action=search&BusinessName=' + encodeURIComponent(tq);
      tloLabel = `Open owner "${esc(tq)}" in TLO`;
    } else if(curOwnerLLC){
      tq = curOwnerLLC;
      turl = 'https://tloxp.tlo.com/search.php?type=BusinessComboSearch&action=search&BusinessName=' + encodeURIComponent(tq);
      tloLabel = `Open owner "${esc(tq)}" in TLO`;
    } else if(curPropAddr){
      tq = curPropAddr;
      turl = tloPropertyUrl(curPropAddr, curPropCSZ);
      tloLabel = `Open this property in TLO (no LLC — judge the owner)`;
    }
    const tloLink = turl ? `<div class="sosnote"><a class="tlolink" href="${turl}" target="_blank" rel="noopener" data-q="${esc(tq)}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">🔎 ${tloLabel} →</a></div>` : '';
    h += `<div class="contact" data-cid="${esc(c.id)}">
      <div class="contact-top">
        <div class="contact-id">
          <div class="cn" onclick="location.hash='contact/${esc(c.id)}'" style="cursor:pointer">${esc(contactName(c))}${c.do_not_contact?' <span class="dnc">DNC</span>':''}</div>
          <div class="cr">${esc([c.role_label||c.title||''].concat(c.also_roles||[]).filter(Boolean).join(' + '))}${c.employer_name?' &middot; '+esc(c.employer_name):''}</div>
          ${cc?`<div class="cc">${cc}</div>`:''}
          ${c.notes?`<div class="cnotes">${esc(c.notes)}</div>`:''}
          ${tloLink}
          ${contactLog(c)}
        </div>
        <div class="contact-actions">
          ${touchChip('contact', c.id, c.last_touch_date, 'touchRefreshProperty')}
          ${curOwnerNames.has(nameKey(contactName(c)))
            ? `<span class="isowner" title="Already recorded on this property's real estate owner stack">&#10003; owner of record</span>`
            : `<a class="mkowner" data-name="${esc(contactName(c))}"
                  title="Record this person as a Real Estate Owner of this property. Adds to the ownership stack; nothing already on file is changed or removed."
                  onclick="makeContactOwner('${esc(c.id)}',this)">&#127968; make owner</a>`}
          ${(opts.scope==='owner' && !c.on_property)
            ? `<a onclick="location.hash='contact/${esc(c.id)}'">open</a>`
            : `<a onclick="editContact('${esc(c.id)}',this)">edit</a>
               <a onclick="removeContact('${esc(c.id)}',this)">remove</a>`}
        </div>
      </div>
    </div>`;
  }
  return h;
}

// A person can now be on this page twice: in Key Contacts and on the card under the owner

  const d = await getJSON('/api/property/'+encodeURIComponent(curPid));

      if(box) box.innerHTML = ownerPeopleInner(e);

  }
}

// Promote a key contact to owner of record. Hap keeps finding that the person already on
// the card IS the real estate owner (the trust/LLC row is stale, or the Salesforce "owner
// company" is really the management shell) -- this records that in one click instead of
// retyping the name into "+ add owner / operator". It only ever ADDS a role: whatever owner
// is already on file stays there, so the two can be judged side by side.
async function makeContactOwner(cid, el){
  const nm = el.dataset.name || 'this contact';
  if(!confirm(`Record ${nm} as a Real Estate Owner of this property?

This ADDS them to the ownership stack. Any owner already on file stays exactly as it is.`)) return;
  if(el.dataset.busy) return;      // double-click guard; the row repaints on success
  el.dataset.busy = '1';
  const was = el.innerHTML;
  el.textContent = 'recording...';
  // apiJSON, not fetch: if the running server predates this feature the request lands on
  // its HTML 404 and comes back as the "restart the server" message instead of a mystery.
  const d = await apiJSON('/api/make-owner', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contact_id: cid, property_id: curPid}),
  });
  if(d && d.error){
    alert(/already has this role/.test(d.error)
      ? `${nm} is already recorded as a real estate owner of this property.`
      : (d.stale ? d.error : 'Could not record that owner: ' + d.error));
    el.innerHTML = was;
    el.dataset.busy = '';
    if(!d.stale) renderProperty(curPid);
    return;
  }
  flashRoleId = d.role_id || null;
  renderProperty(curPid);
}

let entSugTimer = null;
function onEntityInput(input){
  // Serves both the full owner form and the one-line Owner/Operator editor in Property Details.
  const form = input.closest('.owner-form, .party-edit');
  form.dataset.entityId = '';           // typing invalidates any previously picked entity
  const box = form.querySelector('.entsug');
  const q = input.value.trim();
  clearTimeout(entSugTimer);
  if(q.length < 2){ box.style.display='none'; box.innerHTML=''; return; }
  entSugTimer = setTimeout(async () => {
    const d = await getJSON('/api/entities?q='+encodeURIComponent(q));
    const ents = (d && d.entities) || [];
    if(!ents.length){ box.style.display='none'; box.innerHTML=''; return; }
    box.innerHTML = ents.map(e => {
      const bits = [];
      // People come out of CMS/CoStar as "Robin, Aaron"; we list them the way they're
      // spoken and keep the stored form visible so the link is still auditable.
      const label = e.display_name || e.legal_name;
      if(label !== e.legal_name) bits.push('recorded as '+esc(e.legal_name));
      if(e.property_count>0) bits.push(e.property_count+' propert'+(e.property_count===1?'y':'ies'));
      if(e.portfolio) bits.push('portfolio: '+esc(e.portfolio));
      if(e.kind && e.kind!=='UNKNOWN') bits.push(esc(e.kind));
      if(e.source_seed) bits.push('via '+esc(e.source_seed));
      return `<div class="es-row" data-id="${esc(e.id)}" data-name="${esc(e.legal_name)}" onclick="pickEntity(this)">
        <div class="es-name">${esc(label)}</div>
        <div class="es-meta">${bits.join(' &middot; ')||'no linked properties yet'}</div>
      </div>`;
    }).join('');
    box.style.display = '';
  }, 200);
}

function collectOwnerForm(form){

// store in reach from the property page, where he is standing when he learns the number.
let curOwnerInfo = {};

// The owner's callable people, rendered as the SAME card Key Contacts uses -- cell, office,
// email, notes, call log, the lot. Once Hap makes a key contact the owner of record, "who
// owns this" and "who do I call" are one person, and a name with a percentage next to it is

function ownerInfoBlock(e){
  if(!e.entity_id) return '';
  const ci = e.contact_info || {};
  curOwnerInfo[e.entity_id] = ci;
  // Don't echo a number or address that is already on one of the people cards right above
  // (promoting a contact copies their phone onto the owner) -- the same digits twice in a
  // row reads as two numbers.
  const digits = v => (v||'').replace(/\D/g,'');
  const onCards = new Set();
  for(const p of (e.people || [])){
    for(const v of [p.phone_mobile, p.phone_office, p.phone_home]) if(digits(v)) onCards.add(digits(v));
    for(const v of [p.email, p.email_alt]) if(v) onCards.add(v.toLowerCase());
  }
  const dupePhone = v => v && onCards.has(digits(v));
  const dupeEmail = v => v && onCards.has(v.toLowerCase());
  const bits = [];
  if(ci.contact) bits.push(`<span class="oi-k">ask for</span> ${esc(ci.contact)}`);
  if(ci.phone && !dupePhone(ci.phone)) bits.push(`<a href="tel:${esc(ci.phone)}">${esc(ci.phone)}</a>${facTag(ci.phone)}`);
  if(ci.phone_alt && !dupePhone(ci.phone_alt)) bits.push(`<a href="tel:${esc(ci.phone_alt)}">${esc(ci.phone_alt)}</a>${facTag(ci.phone_alt)}`);
  if(ci.email && !dupeEmail(ci.email)) bits.push(`<a href="mailto:${esc(ci.email)}">${esc(ci.email)}</a>`);
  if(ci.website){
    const u = /^https?:\/\//i.test(ci.website) ? ci.website : ('https://'+ci.website);
    bits.push(`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(ci.website.replace(/^https?:\/\//,''))}</a>`);
  }
  if(ci.address) bits.push(esc(ci.address));
  const has = Object.keys(ci).length > 0;
  const edit = `<a class="oi-edit" data-eid="${esc(e.entity_id)}" onclick="event.stopPropagation();editOwnerInfo(this)"
    >${bits.length ? 'edit' : (has ? '&#9998; owner contact info' : '&#9998; add contact info')}</a>`;
  return `<div class="ownerinfo">${bits.length?'&#9742; '+bits.join(' &middot; ')+' ':''}${edit}</div>
    <div class="owner-info-slot" data-infofor="${esc(e.entity_id)}"></div>`;
}

function kv(k,v){
