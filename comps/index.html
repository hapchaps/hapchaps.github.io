}

// An editable Property Details row. Double-click the value to edit just that line; it saves
// only the field it changed (the API takes a partial update) and busts the roster caches, so
// filling in units or beds here shows up on Owner Targets and Recently Databased too.
//   field   -- the core_properties column to write
//   raw     -- the value to edit (asset class edits the CODE while displaying the label)
//   shown   -- what to display; falls back to raw
//   type    -- text | number | select | textarea | citystate
function kvEd(label, field, raw, shown, type){
  const empty = (raw==null || raw==='');
  const disp = empty ? 'not on file' : (shown!=null && shown!=='' ? shown : String(raw));
  return `<div class="k">${esc(label)}</div>`
    + `<div class="v kv-ed ${empty?'empty':''}" data-field="${esc(field)}" data-type="${esc(type||'text')}"`
    + ` data-raw="${esc(raw==null?'':raw)}" title="Double-click to edit"`
    + ` ondblclick="startKvEdit(this)">${esc(disp)}</div>`;
}

function startKvEdit(cell){
  if(cell.querySelector('.kv-in')) return;              // already editing
  const field = cell.dataset.field, type = cell.dataset.type, raw = cell.dataset.raw || '';
  cell._prev = cell.innerHTML;
  cell._wasEmpty = cell.classList.contains('empty');
  cell.classList.remove('empty');
  let inner;
  if(type === 'select'){
    const list = field === 'asset_class' ? ASSET_OPTS : STATUS_OPTS;
    inner = `<select class="kv-in">${list.map(o=>
      `<option value="${o[0]}" ${o[0]===raw?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  } else if(type === 'textarea'){
    inner = `<textarea class="kv-in" rows="3">${esc(raw)}</textarea>`;
  } else if(type === 'citystate'){
    // One row on screen, two columns underneath -- edit them together rather than splitting
    // the line, so the panel keeps reading the way it always has.
    inner = `<input class="kv-in kv-city" value="${esc((curProp&&curProp.city)||'')}" placeholder="City">
      <input class="kv-in kv-state" value="${esc((curProp&&curProp.state)||'')}" placeholder="ST" maxlength="2" style="flex:0 0 54px">`;
  } else {
    inner = `<input class="kv-in" type="${type==='number'?'number':'text'}" value="${esc(raw)}">`;
  }
  cell.innerHTML = `<div class="kv-edit" onkeydown="kvEditKeys(event,this)">${inner}
    <div class="kv-actions"><button type="button" class="btn" onclick="saveKvEdit(this)">Save</button>
      <a onclick="cancelKvEdit(this)">cancel</a></div></div>`;
  const f = cell.querySelector('.kv-in');
  f.focus();
  if(f.select) f.select();
}

function kvEditKeys(ev, box){
  const inTextarea = ev.target.tagName === 'TEXTAREA';
  if(ev.key === 'Enter' && (!inTextarea || ev.ctrlKey || ev.metaKey)){
    ev.preventDefault(); saveKvEdit(box);
  } else if(ev.key === 'Escape'){
    ev.stopPropagation(); cancelKvEdit(box);
  }
}

function cancelKvEdit(el){
  const cell = el.closest('.kv-ed');
  if(!cell || cell._prev == null) return;
  cell.innerHTML = cell._prev;
  if(cell._wasEmpty) cell.classList.add('empty');
}

async function saveKvEdit(el){
  const cell = el.closest('.kv-ed');
  const field = cell.dataset.field, type = cell.dataset.type;
  const payload = {};
  if(type === 'citystate'){
    payload.city = cell.querySelector('.kv-city').value.trim();
    payload.state = cell.querySelector('.kv-state').value.trim();
  } else {
    payload[field] = cell.querySelector('.kv-in').value.trim();
  }
  const btn = cell.querySelector('.btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  let d;
  try {
    const r = await fetch('/api/property/'+encodeURIComponent(curPid),
      {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    d = await r.json();
  } catch(e){ d = {error: String(e)}; }
  if(!d || d.error){
    alert('Could not save: ' + ((d && d.error) || 'unknown error'));
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
    return;
  }
  // Every roster that shows this property holds a cached page; drop them so the corrected
  // value is what loads next time rather than the stale one sitting in the cache.
  targetsPageCache.clear(); dbPageCache.clear(); apPageCache.clear();
  const y = window.scrollY;
  await renderProperty(curPid);      // repaint from the saved record, keeping your place
  window.scrollTo(0, y);
}
function kvNum(k,v){

}

// Where an Owner / Operator line came from, said the way Hap would say it.
const PARTY_SRC = {
  ui: 'you', tlo: 'TLO', costar: 'CoStar', nicmap: 'NIC MAP', nicmap_pipeline: 'NIC MAP',
  cms: 'CMS', cms_nhcc: 'CMS', cms_ownership: 'CMS', cms_cost_report: 'CMS',
  salesforce: 'Salesforce', license: 'state license', owner: 'same as owner', research: 'researched',
};

// The Owner / Operator summary lines. The ownership panel on the right is still the record --
// every entity, every source, every TLO link. These two lines just answer the first question
// asked about a building without making anyone read the stack, and they say how solid the
// answer is: a bare name is recorded fact, "assumed" is our read of the license or a small
// owner-operated home, "verify" is Salesforce-only. When nothing is solid enough to name,
// the line says needs research and opens the add form rather than showing a guess.
function kvParty(label, row, roleType){
  // undefined (not null) means the running server predates these lines -- say that, rather
  // than reporting "needs research" on a property whose owner is sitting right there in the
  // ownership panel. Same mismatch STALE_SERVER_MSG covers for missing routes.
  if(row === undefined){
    return `<div class="k">${esc(label)}</div>`
      + `<div class="v empty" title="${esc(STALE_SERVER_MSG)}">restart the server to see this</div>`;
  }
  // A rolled-up owner (Welltower, shown for MGP XVII LLC) still edits the DEED owner: the
  // editor records a real_estate_owner role, and that is the LLC, not its parent.
  const editName = (row && row.via) || (row && row.name) || '';
  const editId = (row && row.via ? row.via_entity_id : row && row.entity_id) || '';
  const dataAttrs = ` data-role-type="${esc(roleType)}" data-label="${esc(label)}"`
    + ` data-name="${esc(editName)}"`
    + ` data-entity-id="${esc(editId)}" ondblclick="startPartyEdit(this)"`;
  if(!row || !row.name){
    return `<div class="k">${esc(label)}</div>`
      + `<div class="v party-none kv-party"${dataAttrs}>`
      + `<a onclick="startPartyEdit(this.closest('.kv-party'))"`
      + ` title="Nothing solid on file. Click to record the ${esc(label.toLowerCase())}.">needs research</a></div>`;
  }
  const name = row.entity_id
    ? `<a onclick="location.hash='entity/${esc(row.entity_id)}'">${esc(row.name)}</a>`
    : esc(row.name);
  let tag = '';
  if(row.confidence === 'assumed'){
    tag = `<span class="ptag assumed" title="${esc(row.note || 'Our read, not a recorded fact')}">assumed</span>`;
  } else if(row.confidence === 'verify'){
    tag = `<span class="ptag verify" title="${esc(row.note || 'Salesforce ownership data can be stale or wrong')}">verify</span>`;
  }
  const src = PARTY_SRC[row.source];
  const bits = [];
  // On a rolled-up owner the feed that named the LLC says nothing about the parent; the
  // rollup's own reason ("CoStar true owner", "parent company on file") is the source here.
  if(row.via) bits.push(row.lift_note || 'parent company');
  else if(src) bits.push(src);
  if(row.portfolio) bits.push('part of ' + row.portfolio);
  let tail = bits.length ? `<span class="psrc">${esc(bits.join(' · '))}</span>` : '';
  if(row.via){
    const llc = row.via_entity_id
      ? `<a onclick="location.hash='entity/${esc(row.via_entity_id)}'">${esc(row.via)}</a>` : esc(row.via);
    tail += `<span class="psrc" title="${esc(row.lift_note || '')}">through ${llc}</span>`;
  }
  return `<div class="k">${esc(label)}</div>`
    + `<div class="v party kv-party"${dataAttrs}`
    + ` title="Double-click to change the ${esc(label.toLowerCase())}">${name}${tag}${tail}</div>`;
}

// ---------- Owner / Operator, edited where they are read ----------

      <a onclick="partyEditMore(this)">more options</a></div>

// Which role row this line should WRITE THROUGH to, or null to add a new one. The displayed
// entity wins; failing that, a lone existing role of this type is the one being corrected.
// Two or more and we add instead -- silently repointing one of several owners would be a
// guess about which one Hap meant.
function partyRoleFor(roleType, entityId){
  const block = (curOwnership || []).find(b => b.role_type === roleType);
  const ents = (block && block.entities) || [];
  if(!ents.length) return null;
  if(entityId){
    const hit = ents.find(e => e.entity_id === entityId);
    if(hit) return hit;
  }
  return ents.length === 1 ? ents[0] : null;
}

async function savePartyEdit(el){
  const cell = el.closest('.kv-party');
  const box = cell.querySelector('.party-edit');
  const roleType = cell.dataset.roleType;
  const name = box.querySelector('.of-name').value.trim();
  const entityId = box.dataset.entityId || '';
  if(!name && !entityId){
    // Blanking the line is a removal, which belongs in the ownership panel behind its
    // confirm -- an owner record is not something to drop by accident on a stray keystroke.
    box.querySelector('.of-hint').innerHTML =
      'Enter a name, or remove the record in <b>Ownership &amp; Operations</b> on the right.';
    box.querySelector('.of-name').focus();
    return;
  }
  const existing = partyRoleFor(roleType, cell.dataset.entityId);
  const payload = {role_type: roleType};
  if(entityId) payload.entity_id = entityId; else payload.entity_name = name;
  let url;
  if(existing){
    // The update endpoint rewrites every field it is given, so carry the percent through
    // rather than blanking a stake that was already recorded.
    payload.pct_interest = (existing.pct_interest == null ? '' : existing.pct_interest);
    url = '/api/roles/' + encodeURIComponent(existing.role_id);
  } else {
    payload.property_id = curPid;
    url = '/api/roles';
  }
  const btn = box.querySelector('.btn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving...'; }
  let d;
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)});
    d = await r.json();
  } catch(e){ d = {error: String(e)}; }
  if(!d || d.error){
    alert('Could not save: ' + ((d && d.error) || 'unknown error'));
    if(btn){ btn.disabled = false; btn.textContent = 'Save'; }
    return;
  }
  // Same cache sweep as any other Property Details edit: the owner shown on Owner Targets,
  // Recently Databased and All Properties comes off these roles.
  targetsPageCache.clear(); dbPageCache.clear(); apPageCache.clear();
  const y = window.scrollY;
  await renderProperty(curPid);
  window.scrollTo(0, y);
}

// The same Owner / Operator answer as a roster cell (All Properties). A table row has no
// space for the source label, so that moves into the tooltip and only the tag that changes
// how much to trust the name stays on screen.
function partyCell(row){
  if(row === undefined) return `<span class="pneed" title="${esc(STALE_SERVER_MSG)}">restart the server</span>`;
  if(!row || !row.name) return '<span class="pneed" title="Nothing confirmed or high-confidence on file">needs research</span>';
  const src = PARTY_SRC[row.source];
  const why = [row.via ? 'owns it through ' + row.via + ' (' + (row.lift_note || 'parent') + ')' : '',
               src ? 'per ' + src : '', row.note || ''].filter(Boolean).join(' · ');
  const name = row.entity_id
    ? `<a onclick="location.hash='entity/${esc(row.entity_id)}'" style="cursor:pointer" title="${esc(why)}">${esc(row.name)}</a>`
    : `<span title="${esc(why)}">${esc(row.name)}</span>`;
  if(row.confidence === 'assumed')
    return name + `<span class="ptag assumed" title="${esc(row.note || 'Our read, not a recorded fact')}">assumed</span>`;
  if(row.confidence === 'verify')
    return name + `<span class="ptag verify" title="${esc(row.note || 'Salesforce data can be stale or wrong')}">verify</span>`;
  return name;
}

// ---------- shared mini-map (Leaflet, OpenStreetMap tiles) ----------
// One helper backs the Sales Comp map, the single-property location map, and an owner's
// portfolio map, so a marker/popup only has to look right once. Fails silently (returns
// null) if Leaflet didn't load -- e.g. offline -- rather than throwing into a blank page.
function renderMiniMap(containerId, points, opts){
  const el = document.getElementById(containerId);
  if(!el) return null;
  if(!window.L){ el.innerHTML = '<div class="empty-msg">Map failed to load (no internet?).</div>'; return null; }
  if(!points.length){ el.innerHTML = '<div class="empty-msg">No location on file for this yet.</div>'; return null; }
  const map = L.map(containerId, {scrollWheelZoom:false});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors',
  }).addTo(map);
  map.on('focus', ()=>map.scrollWheelZoom.enable());
  map.on('blur', ()=>map.scrollWheelZoom.disable());
  for(const pt of points){
    const m = L.marker([pt.lat, pt.lng]).addTo(map);
    if(pt.html) m.bindPopup(pt.html);
  }
  if(points.length === 1){
    map.setView([points[0].lat, points[0].lng], (opts&&opts.zoom)||15);
  } else {
    map.fitBounds(L.latLngBounds(points.map(pt=>[pt.lat,pt.lng])), {padding:[28,28], maxZoom:15});
  }
  return map;
}

function bbMoney(n){
  if(n == null) return '';
  return n >= 1e6 ? '$' + (Math.round(n/1e5)/10).toString().replace(/\.0$/,'') + 'M' : '$' + num(n);
}
function bbRange(lo, hi, fmt){
  if(lo != null && hi != null) return fmt(lo) + ' to ' + fmt(hi);
  if(lo != null) return fmt(lo) + ' and up';
  if(hi != null) return 'up to ' + fmt(hi);
  return '';
}
// [['CA', 12], ['AZ', 3]] -> chips; acuity chips wear their asset-class color.
// "owner entity tied to Tharon Group; call Tharon Group" -> "to Tharon Group": who picks up,
// short enough for a chip. The whole note stays on the card and in the tooltip.
function callThruWho(note){
  const m = /(?:^|[;:.]\s*)call\s+(.+)$/i.exec(note || '')
         || /\bwithin\s+(?:the\s+)?(.+)$/i.exec(note || '')
         || /^(.+?)\s+property (?:llc|entity)\b/i.exec(note || '');
  let who = m ? m[1] : (note || '');
  who = who.replace(/\s*\(.*$/, '').replace(/[.;]+$/, '').trim();
  if(who.length > 40) who = who.slice(0, 38).trim() + '...';
  return who ? 'to ' + who : '';
}

function tallyChips(pairs, isClass){
  return (pairs||[]).map(([k, n]) => isClass
    ? `<span class="chip ${esc(k)}">${esc(ASSET_SHORT[k]||k)} ${num(n)}</span>`
    : `<span class="chip status">${esc(k)} ${num(n)}</span>`).join(' ');

// ---------- Buyers List (#buyerlist) ----------
// Pull everyone to send a deal to: pick states and acuity, get every company that owns that
// product there (rolled up to the true owner), every buyer of record there in the comps, and
// every company or person whose stated criteria cover it, each with the people to call.
const BL_CLASSES = ['AL','MC','IL','CCRC','SENIOR_APT','SNF'];
let blLast = null;

function blParams(p){
  return {state: (p.get('state')||'').split(',').filter(Boolean), acuity: (p.get('acuity')||'').split(',').filter(Boolean),
          umin: p.get('umin')||'', umax: p.get('umax')||'', q: p.get('q')||'', sort: p.get('sort')||'owned',
          offset: parseInt(p.get('offset'),10)||0};
}
function blHash(f){
  const qp = new URLSearchParams();
  if(f.state.length) qp.set('state', f.state.join(','));
  if(f.acuity.length) qp.set('acuity', f.acuity.join(','));
  if(f.umin) qp.set('umin', f.umin);
  if(f.umax) qp.set('umax', f.umax);
  if(f.q) qp.set('q', f.q);
  if(f.sort && f.sort !== 'owned') qp.set('sort', f.sort);
  if(f.offset) qp.set('offset', f.offset);
  return 'buyerlist' + (qp.toString() ? '?' + qp.toString() : '');
}
function blToggle(key, val){
  const f = Object.assign({}, blLast);
  const set = new Set(f[key]);
  set.has(val) ? set.delete(val) : set.add(val);
  f[key] = [...set]; f.offset = 0;
  location.hash = blHash(f);
}
function blSet(key, val){
  const f = Object.assign({}, blLast);
  f[key] = val; if(key !== 'offset') f.offset = 0;
  location.hash = blHash(f);
}
function blApiQS(f, limit){
  const qp = new URLSearchParams();
  if(f.state.length) qp.set('state', f.state.join(','));
  if(f.acuity.length) qp.set('acuity', f.acuity.join(','));
  if(f.umin) qp.set('umin', f.umin);
  if(f.umax) qp.set('umax', f.umax);
  if(f.q) qp.set('q', f.q);
  qp.set('sort', f.sort); qp.set('offset', f.offset); qp.set('limit', limit);
  return qp.toString();
}

// One row per person (a company with nobody on file still gets a row), so the file drops
// straight into a mail merge or a call sheet for the deal.
async function exportBuyerListCSV(){
  const f = Object.assign({}, blLast, {offset: 0});
  const all = document.getElementById('bl-allcsv');
  const d = await getJSON('/api/buyer-list?' + blApiQS(f, 0) + (all && all.checked ? '&all_contacts=1' : ''));
  const hdr = ['Company','WhyOnList','Researched','CallThrough','OwnsHere','OwnedStates','OwnedAcuity','BoughtHere','LastPurchase','StatedCriteria',
               'PerSalesforceOnly','Contact','Title','Role','Cell','Office','Email','DNC','ContactSource','CompanyLink'];
  const out = [hdr];
  const pairs = ps => (ps||[]).map(([k,n]) => k+' '+n).join('; ');
  for(const o of (d.results||[])){
    const why = [o.stated?'stated criteria':'', o.owned_count?'owns':'', o.bought_count?'bought':''].filter(Boolean).join(', ');
    const base = [o.name, why, o.reviewed_at||'', o.call_through||'', o.owned_count, pairs(o.owned_states), pairs(o.owned_classes), o.bought_count, o.last_bought||'',
                  o.stated?'yes':'', o.salesforce_only?'yes':(o.not_buyer?'NOT A BUYER: '+o.not_buyer:'')];
    const link = location.origin + '/#' + (o.entity_id ? 'entity/'+o.entity_id : 'contact/'+o.contact_id);
    const people = o.contacts || [];
    if(!people.length) out.push(base.concat(['','','','','','','','', link]));
    for(const c of people){
      out.push(base.concat([contactName(c), c.title||'', (c.is_key?'KEY: '+(c.key_role||'')+' / ':'')+(c.why||[]).join(' / '), c.phone_mobile||'', c.phone_office||'',
        c.email||'', c.do_not_contact?'DNC':'', c.source_seed||'', link]));
    }
  }
  const csv = out.map(r => r.map(v => {
    v = (v==null?'':String(v));
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'buyers_list' + (f.state.length?'_'+f.state.join('-'):'') + (f.acuity.length?'_'+f.acuity.join('-'):'') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function saveEntityProperty(btn){
  const form = btn.closest('.addprop-form');
  if(!form.dataset.propId){
    alert('Pick a facility from the dropdown first.');
    form.querySelector('.ap-name').focus();
    return;
  }
  const role = form.querySelector('.ap-role').value;
  // Recording a second owner on a property that already has one is legitimate (a JV, a
  // parent above the title holder) but it is also how a wrong owner sneaks in, so say out
  // loud what is already there before writing it.
  if(role === 'real_estate_owner' && form.dataset.propOwner){
    if(!confirm('"'+form.dataset.propOwner+'" is already recorded as the real estate owner of that property.'
      + '\n\nAdd this company as an owner too? Nothing already on file is changed or removed.')) return;
  }
  btn.disabled = true; btn.textContent = 'Adding...';
  const d = await apiJSON('/api/roles', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({property_id: form.dataset.propId, entity_id: curEntityId,
                          role_type: role, pct_interest: form.querySelector('.ap-pct').value.trim()})});
  if(d && d.error){
    alert('Could not add that property: '+d.error);
    btn.disabled = false; btn.textContent = 'Add to portfolio';
    return;
  }
  renderEntity(curEntityId);
}

async function removeEntityProperty(el){
  const nm = el.dataset.name || 'this property';
  if(!confirm('Take "'+nm+'" out of this owner\'s portfolio?\n\nThe role is soft-deleted, so an imported record survives for audit. The facility itself is untouched.')) return;
  const d = await apiJSON('/api/roles/'+encodeURIComponent(el.dataset.rid), {method:'DELETE'});
  if(d && d.error){ alert('Could not remove that: '+d.error); return; }
  renderEntity(curEntityId);
}

async function renderEntity(id, opts){
  opts = opts || {};
  app.innerHTML = '<div class="spinner">Loading owner profile...</div>';
  const d = await getJSON('/api/entity/'+id);
  if(!d || d.error){ app.innerHTML='<div class="empty-msg">Entity not found.</div>'; return; }
  const e = d.entity;
  // A person-as-owner record (INDIVIDUAL) with exactly one person on it is a shell around
  // that person: it only knows the one building it was recorded on, while the contact page
  // has every building and every number. Opening it from anywhere lands on the person.
  // replace() so Back skips the shell. Only on navigation -- the in-page refreshes after an
  // edit call renderEntity(id) bare and must stay put -- and never for entity/<id>/record,
  // the contact page's own way back to the owner record itself.
  const people = d.contacts || [];
  if(opts.route && !opts.keep && e.kind === 'INDIVIDUAL' && people.length === 1){
    location.replace('#contact/' + people[0].id);
    return;
  }
  curEntityId = e.id;
  trackRecentlyViewed('entity', e.id, e.display_name||e.legal_name, e.kind && e.kind!=='UNKNOWN' ? e.kind : 'Company');
  let html = `<a class="back" onclick="history.back()">&larr; Back</a>
    <div class="dhead"><h1>${esc(e.display_name||e.legal_name)}</h1>
    <div class="sub">${esc(e.kind||'Entity')}${e.state_of_formation?' &middot; '+esc(e.state_of_formation):''} &middot; ${d.count} linked propert${d.count===1?'y':'ies'}${d.outside_portfolio&&d.outside_portfolio.communities&&d.outside_portfolio.communities.length?' &middot; '+(d.count+d.outside_portfolio.communities.length)+' total portfolio':''}
    &middot; ${touchChip('entity', e.id, e.last_contact_date, 'touchRefreshEntity')}</div></div>`;

  curEntityInfo = d.company_info || {};

  const dupes = d.possible_duplicates || [];
  if(dupes.length){
    const items = dupes.map(o => {
      const bits = [];
      if(o.property_count) bits.push(num(o.property_count)+' propert'+(o.property_count===1?'y':'ies'));
      if(o.deal_count) bits.push(num(o.deal_count)+' deal'+(o.deal_count===1?'':'s'));
      if(o.source_seed) bits.push('source: '+esc(o.source_seed));
      return `<div>&middot; <a onclick="location.hash='entity/${o.id}'" style="cursor:pointer">${esc(o.legal_name)}</a>`
        + (bits.length?' &middot; '+bits.join(' &middot; '):'')+'</div>';
    }).join('');
    html += `<div class="prof-alt" style="border:1px solid var(--warn);border-radius:6px;padding:8px 10px;margin-bottom:14px;font-size:12.5px">
      <b style="color:var(--warn)">&#9888; ${dupes.length} other live record${dupes.length===1?'':'s'} share${dupes.length===1?'s':''} this exact name</b> --
      probably the same company split by different pulls. Open each and confirm before merging with <span class="kbd">dedupe_entities.py</span>.
      ${items}
    </div>`;
  }

  html += '<div class="cols"><div>';

  html += `<div class="panel"><h2>Contact Details <a class="panel-act" onclick="editEntityInfo()">edit</a></h2>
    <div id="eprofile-body" class="dtable">${entityInfoHTML(curEntityInfo)}</div></div>`;

  // The owner summary is where "where do we stand with these people" gets answered, so the
  // whole relationship's call history sits above the portfolio: calls logged on the company
  // itself, on any of its buildings, and on any of its people, newest first.
  html += `<div class="panel notes-panel"><h2>Call Log</h2>
    ${notesBlock('entity', e.id, d.activities||[])}</div>`;


  html += `<div class="panel"><h2>Properties <a class="panel-act" onclick="showAddEntityProperty()">+ add property</a></h2>
    <div id="add-eprop-slot"></div>`;
  if(!d.properties.length){
    html += '<div class="empty-msg">No linked properties. Use <b>+ add property</b> to record one this owner holds.</div>';
  } else {
    html += '<div class="results">';
    // One card per building: an owner who is also the operator/licensee of it has several
    // roles on the same property, which read as duplicate properties when listed one per role.
    const grouped = [];
    const byProp = {};
    for(const p of d.properties){
      if(!byProp[p.id]){ byProp[p.id] = {p, roles:[]}; grouped.push(byProp[p.id]); }
      byProp[p.id].roles.push(p);
    }
    for(const g of grouped){
      const p = g.p, multi = g.roles.length > 1;
      const size = propSizeLabel(p), built = propBuiltLabel(p);
      const pct = g.roles.find(r=>r.pct_interest!=null);
      html += `<div class="card" onclick="location.hash='property/${p.id}'">
        <div class="r1"><span class="name">${esc(p.name)}</span>
        <span class="chip ${esc(p.asset_class)}">${esc(p.asset_label)}</span>${size?` <span class="chip">${size}</span>`:''}${built?` <span class="chip">${built}</span>`:''}
        ${g.roles.map(r=>`<span class="chip status">${esc(r.role_label)}</span>`).join(' ')}</div>
        <div class="meta">${esc(p.city||'')}, ${esc(p.state||'')}
        ${pct?'&middot; '+Number(pct.pct_interest).toFixed(1)+'% interest':''}
        &middot; ${touchChip('property', p.id, p.last_contact_date, 'touchRefreshEntity')}
        ${g.roles.filter(r=>r.role_id).map(r=>`&middot; <a class="rowact" data-rid="${esc(r.role_id)}" data-name="${esc(p.name)}${multi?' ('+esc(r.role_label)+')':''}"
             onclick="event.stopPropagation();removeEntityProperty(this)">remove${multi?' '+esc(r.role_label):''}</a>`).join(' ')}</div>
      </div>`;
    }
    html += '</div>';
  }
  html += '</div>';

  html += outsidePortfolioPanel(d.outside_portfolio, d.count);
  html += entityDevelopmentsPanel(d.developments);

  const uniqProps = [...new Map(d.properties.map(p=>[p.id,p])).values()];
  const mapPts = uniqProps.filter(p=>p.lat!=null && p.lng!=null);
  const missingCoords = uniqProps.length - mapPts.length;
  if(d.properties.length){
    html += `<div class="panel"><h2>Portfolio Map</h2>`;
    if(mapPts.length) html += `<div id="entity-map" class="minimap" style="height:340px"></div>`;
    if(missingCoords){
      html += `<div class="meta" style="margin-top:${mapPts.length?'8px':'0'}">
        ${missingCoords} propert${missingCoords===1?'y has':'ies have'} no location yet.
        <a id="locate-link" onclick="locateEntityProperties('${id}')">Locate ${missingCoords===1?'it':'them'}</a></div>`;
    }
    html += `</div>`;
  }

  if(d.transactions && d.transactions.length){
    html += `<div class="panel"><h2>Transaction History</h2>
      <table class="tx"><thead><tr><th>Date</th><th>Side</th><th>Property</th><th>Acuity</th><th>Units</th><th>Price</th><th>$/Unit</th><th>Counterparty</th></tr></thead>
      <tbody>${txRows(d.transactions, true)}</tbody></table></div>`;
  }

  html += '</div><div>';

  // The owner LLC of a known company: that company's main players lead the page.
  for(const pc of (d.parent_contacts||[])){
    html += `<div class="panel"><h2>Contacts at ${esc(pc.name)}
        <a class="panel-act" onclick="location.hash='entity/${esc(pc.entity_id)}'">open company &rarr;</a></h2>
      <div class="meta" style="margin-bottom:6px">This LLC holds buildings for ${esc(pc.name)}.
        ${pc.reviewed_at?'Main players, researched '+esc(pc.reviewed_at)+'.':'Not researched yet; best people on file.'}</div>`;
    if(!(pc.contacts||[]).length) html += '<div class="empty-msg" style="margin:0">No people on file for that company yet.</div>';
    for(const c of (pc.contacts||[])){
      const line = contactLine(c);
      html += `<div class="contact"><div class="cn" onclick="location.hash='contact/${esc(c.id)}'" style="cursor:pointer">${esc(contactName(c))}
          ${c.is_key?` <span class="chip status" style="border-color:var(--accent)">KEY${c.key_role?': '+esc(c.key_role):''}</span>`:''}</div>
        ${c.title?`<div class="cr">${esc(c.title)}</div>`:''}${line?`<div class="cc">${line}</div>`:''}</div>`;
    }
    html += '</div>';
  }

  html += '<div class="panel"><h2>People</h2>';
  if(d.contact_audit){
    html += `<div class="meta" style="margin-bottom:8px">Contacts researched ${esc(d.contact_audit.reviewed_at||'')}.
      ${esc(d.contact_audit.summary||'')}</div>`;
  }
  const allPeople = d.contacts || [];
  if(!allPeople.length && e.kind === 'INDIVIDUAL'){
    html += personChoiceHTML(e, d.person_candidates || []);
  } else if(!allPeople.length){
    html += '<div class="empty-msg">No contacts on file for this company.</div>';
  } else {
    // Main players up front: the researched key people, or until research the best five by
    // the same order the Buyers List uses. Everyone else stays one click away.
    const named = allPeople.filter(c => c.first_name || c.last_name);
    const keys = allPeople.filter(c => c.is_key);
    const lead = (keys.length || d.contact_audit) ? keys : named.slice(0, 5);
    const leadIds = new Set(lead.map(c => c.id));
    const rest = allPeople.filter(c => !leadIds.has(c.id));
    const personHTML = c => {
      const line = contactLine(c);
      return `<div class="contact">
        <div class="cn" onclick="location.hash='contact/${c.id}'" style="cursor:pointer">${esc(contactName(c))}${c.do_not_contact?' <span class="dnc">DNC</span>':''}${c.is_key?` <span class="chip status" style="border-color:var(--accent)" title="${esc(c.key_source||'')}">KEY${c.key_role?': '+esc(c.key_role):''}</span>`:''}</div>
        ${(c.employment_title||c.is_primary)?`<div class="cr">${esc(c.employment_title||'')}${c.is_primary?' &middot; primary':''}</div>`:''}
        ${line?`<div class="cc">${line}</div>`:''}
        <div class="cc" style="margin-top:4px">${touchChip('contact', c.id, c.last_touch_date, 'touchRefreshEntity')}</div>
        ${contactLog(c)}
      </div>`;
    };
    if(!lead.length) html += `<div class="empty-msg" style="margin:0">${d.contact_audit&&d.contact_audit.needs_lookup
      ? 'Needs lookup: '+esc(d.contact_audit.needs_lookup)+'. Nobody on file is confirmed for this company.'
      : 'No confirmed decision makers yet.'}</div>`;
    html += lead.map(personHTML).join('');
    if(rest.length){
      html += `<div class="meta" style="margin-top:6px"><a onclick="const x=this.parentNode.nextElementSibling;x.style.display=x.style.display==='none'?'':'none'">
          Show ${rest.length} other${rest.length===1?'':'s'} on file</a></div>
        <div style="display:none">${rest.map(personHTML).join('')}</div>`;
    }
  }
  html += '</div>';

  if(d.related_entities && d.related_entities.length){
    html += '<div class="panel"><h2>Related Entities</h2><div class="entlist">';
    for(const r of d.related_entities){
      const rt = (r.relationship_type||'').replace(/_/g,' ');
      const phrase = r.direction==='child' ? rt : ('via ' + rt);
      html += `<div class="entrow" onclick="location.hash='entity/${r.entity_id}'" style="cursor:pointer">
        <span class="nm">${esc(r.display_name||r.legal_name)}</span>
        <span class="ex">${esc(phrase)}${r.pct_interest!=null?' &middot; '+Number(r.pct_interest).toFixed(1)+'%':''}</span>
      </div>`;
    }
    html += '</div></div>';
  }

  html += '</div></div>';
  html += buyerCriteriaPanel('entity', e.id, d.buy_box, d.buyer_profile, d.contacts);
  app.innerHTML = html;
  window.scrollTo(0,0);
  if(mapPts.length){
    renderMiniMap('entity-map', mapPts.map(p => ({lat: p.lat, lng: p.lng, html:
      `<b>${esc(p.name)}</b><br>${esc(p.city||'')}, ${esc(p.state||'')}${p.total_units?' &middot; '+num(p.total_units)+' units':''}`
      + `<br><a onclick="location.hash='property/${p.id}'">View property &rarr;</a>`})));
  }
}

// Geocodes up to 25 of this entity's still-uncoded properties (rate-limited server-side,
// ~1/sec), then reloads the page so the map picks up whatever just got resolved. Click
// again for a portfolio bigger than 25 -- the remaining count on the page says how many.
async function locateEntityProperties(id){
  const link = document.getElementById('locate-link');
  if(link){ link.textContent = 'Locating... (about a second per property)'; link.style.pointerEvents = 'none'; }
  try { await fetch('/api/entity/'+id+'/geocode_missing', {method:'POST'}); }
  catch(e){ /* fall through to re-render with whatever succeeded */ }
  renderEntity(id);
}

// ---------- Merge Review (#mergereview) ----------
// The merges contact research flagged and never made on its own: the same firm under an
// old name, an operating arm and its parent, one person filed several times. Each card puts
// the records side by side so Hap can pick the one that survives, link them, or say no.
let mrData = null, mrFilter = 'all';

async function renderMergeReview(){
  app.innerHTML = '<div class="spinner">Loading merge review...</div>';
  mrData = await apiJSON('/api/merge-review');
  if(!mrData || mrData.error){ app.innerHTML = `<div class="empty-msg">${esc((mrData&&mrData.error)||'Could not load merge review.')}</div>`; return; }
  paintMergeReview();
}

function mrGroup(f){ return f.kind === 'person' ? 'people' : (f.related ? 'related' : 'same'); }

function paintMergeReview(){
  const flags = mrData.flags || [];
  paintMergeCount(flags.length);
  const counts = {all: flags.length, same: 0, related: 0, people: 0};
  flags.forEach(f => counts[mrGroup(f)]++);
  const chip = (k, label) => `<span class="catchip ${mrFilter===k?'active':''}" onclick="mrFilter='${k}';paintMergeReview()">${label}<span class="ct">${counts[k]}</span></span>`;
  let html = `<div class="cl-head"><h1>&#128279; Merge Review</h1></div>
    <div class="cl-sub">Duplicates and related records found during contact research. Nothing here was merged automatically.
      Pick the record to keep and merge, link a company under its parent, or mark them as not the same.
      Merges are reversible. ${mrData.decided?`<b>${mrData.decided}</b> decided so far.`:''}
      Exact-name duplicates also have their own queues: <a onclick="location.hash='duplicates'">companies</a> and <a onclick="location.hash='peopledupes'">people</a>.</div>
    <div class="cl-cats"><span class="lbl">Show:</span>${chip('all','All')}${chip('same','Same company')}${chip('related','Related companies')}${chip('people','Same person')}</div>`;
  const shown = flags.filter(f => mrFilter === 'all' || mrGroup(f) === mrFilter);
  if(!shown.length){ html += '<div class="empty-msg">Nothing left to review here.</div>'; app.innerHTML = html; return; }
  for(const f of shown) html += mrCardHTML(f);
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function mrRecordHTML(f, c){
  const checked = c.id === f.suggested_keeper ? 'checked' : '';
  const radio = `<label style="display:flex;gap:6px;align-items:center;font-weight:600;cursor:pointer">
      <input type="radio" name="keep-${esc(f.flag_id)}" value="${esc(c.id)}" ${checked}>
      ${f.kind==='person'?'Keep this record':(f.related?'Keep / parent':'Keep this record')}</label>`;
  const link = f.kind === 'person' ? `contact/${esc(c.id)}` : `entity/${esc(c.id)}`;
  const row = (k, v) => v ? `<div class="dt-row"><span class="dt-k">${k}</span><span class="dt-v">${v}</span></div>` : '';
  let body = '';
  if(f.kind === 'person'){
    const phones = [c.phone_mobile?'C: '+esc(c.phone_mobile)+facTag(c.phone_mobile):'', c.phone_office?'O: '+esc(c.phone_office)+facTag(c.phone_office):''].filter(Boolean).join(' &middot; ');
    body += row('Title', esc(c.title||''));
    body += row('Companies', (c.companies||[]).map(x => `<a onclick="location.hash='entity/${esc(x.id)}'">${esc(x.name)}</a>${x.title?' <span class="muted">'+esc(x.title)+'</span>':''}`).join('<br>'));
    body += row('Phone', phones);
    body += row('Email', esc([c.email, c.email_alt].filter(Boolean).join(', ')));
    body += row('Linked to', `${num(c.properties)} building${c.properties===1?'':'s'}${c.activities?' &middot; '+num(c.activities)+' notes/calls':''}`);
    if((c.key_for||[]).length) body += row('Key contact for', esc(c.key_for.join(', ')));
    body += row('Source', esc(c.source||'') + (c.do_not_contact?' <span class="dnc">DNC</span>':''));
  } else {
    body += row('Owns', `${num(c.properties)} building${c.properties===1?'':'s'}${(c.states||[]).length?' &middot; '+esc(c.states.join(', ')):''}`);
    body += row('Deals', c.deals ? num(c.deals) : '');
    body += row('People', c.people_count ? `${num(c.people_count)} on file${(c.people||[]).length?': '+c.people.map(p => esc(p.name)+(p.is_key?' <span class="chip status">KEY</span>':'')).join(', '):''}` : '<span class="muted">none on file</span>');
    body += row('Phone', esc(c.phone||''));
    body += row('Address', esc(c.address||''));
    body += row('Other names', esc((c.alt_names||[]).join(', ')));
    body += row('Researched', c.researched ? esc(c.researched) + (c.not_buyer?' <span class="chip deadend">not a buyer</span>':'')
      + (c.call_through?' <span class="chip callthru" title="'+esc(c.call_through)+'">call through '+esc(callThruWho(c.call_through))+'</span>':'') : '');
    body += row('Source', esc(c.source||''));
    if(c.summary) body += `<div class="meta" style="margin-top:6px">${esc(c.summary)}</div>`;
  }
  return `<div class="panel" style="margin:0;flex:1 1 300px;min-width:260px">
      ${radio}
      <h2 style="text-transform:none;font-size:15px;letter-spacing:0;margin:6px 0">
        <a onclick="location.hash='${link}'" style="cursor:pointer">${esc(c.name)}</a></h2>
      <div class="dtable">${body}</div></div>`;
}

function mrCardHTML(f){
  const label = f.kind === 'person' ? 'Same person' : (f.related ? 'Related companies' : 'Same company');
  const btns = [`<button class="btn" onclick="mrMerge(this,'${esc(f.flag_id)}')">Merge into the kept record</button>`];
  if(f.kind !== 'person') btns.push(`<button class="btn" onclick="mrLink(this,'${esc(f.flag_id)}')">Keep both, selected is the parent</button>`);
  btns.push(`<a onclick="mrDismiss(this,'${esc(f.flag_id)}')" style="align-self:center">Not the same</a>`);
  return `<div class="panel" data-flag="${esc(f.flag_id)}">
      <div class="r1" style="margin-bottom:6px"><span class="chip status">${label}</span>
        <span style="font-weight:600;margin-left:6px">${esc(f.note||'')}</span></div>
      ${f.found_on?`<div class="meta" style="margin-bottom:8px">Found while researching ${esc(f.found_on)}</div>`:''}
      <div style="display:flex;gap:12px;flex-wrap:wrap">${f.cards.map(c => mrRecordHTML(f, c)).join('')}</div>
      <div class="row" style="margin-top:10px;gap:14px;align-items:center;flex-wrap:wrap">${btns.join('')}</div>
    </div>`;
}

function mrSelected(flagId){
  const r = document.querySelector(`input[name="keep-${CSS.escape(flagId)}"]:checked`);
  return r ? r.value : '';
}

async function mrAct(btn, flagId, url, payload, confirmText, doneHTML){
  if(confirmText && !confirm(confirmText)) return;
  const panel = btn.closest('[data-flag]');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Working...';
  const d = await apiJSON(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  if(!d || d.error){ alert('Could not do that: ' + ((d && d.error) || 'unknown error')); btn.disabled = false; btn.textContent = label; return; }
  mrData.flags = mrData.flags.filter(x => x.flag_id !== flagId);
  mrData.decided = (mrData.decided||0) + 1;
  paintMergeCount(mrData.flags.length);
  panel.innerHTML = `<div class="empty-msg" style="margin:0">${doneHTML(d)}</div>`;
}

function mrMerge(btn, flagId){
  const f = mrData.flags.find(x => x.flag_id === flagId);
  const keep = mrSelected(flagId);
  if(!keep){ alert('Pick the record to keep first.'); return; }
  const kept = f.cards.find(c => c.id === keep);
  const others = f.cards.filter(c => c.id !== keep).map(c => c.name).join(', ');
  const link = f.kind === 'person' ? 'contact/' + keep : 'entity/' + keep;
  mrAct(btn, flagId, '/api/merge-review/merge', {flag_id: flagId, keeper_id: keep},
    `Merge ${others} into ${kept.name}? Buildings, deals, people and notes move to the kept record.`,
    () => `Merged into <a onclick="location.hash='${link}'">${esc(kept.name)}</a>.`);
}

function mrLink(btn, flagId){
  const f = mrData.flags.find(x => x.flag_id === flagId);
  const parent = mrSelected(flagId);
  if(!parent){ alert('Pick the parent company first.'); return; }
  const p = f.cards.find(c => c.id === parent);
  mrAct(btn, flagId, '/api/merge-review/link', {flag_id: flagId, parent_id: parent},
    `Keep both records and set ${p.name} as the parent?`,
    () => `Linked under <a onclick="location.hash='entity/${esc(parent)}'">${esc(p.name)}</a>.`);
}

function mrDismiss(btn, flagId){
  mrAct(btn, flagId, '/api/merge-review/dismiss', {flag_id: flagId}, null, () => 'Marked as not the same. It will not come back.');
}

// ---------- duplicate-entity review queue ----------
async function renderDuplicates(){
  app.innerHTML = '<div class="spinner">Loading possible duplicates...</div>';
  const d = await getJSON('/api/duplicates');
  const groups = d.groups || [];
  let html = `<a class="back" onclick="location.hash='owners'">&larr; Back to Owners &amp; Contacts</a>
    <div class="dhead"><h1>Possible Duplicate Companies</h1>
    <div class="sub">${groups.length} group${groups.length===1?'':'s'} of live entities sharing the exact same name.
    Merging repoints every property, role, deal, and contact link onto one record -- review each before merging.</div></div>`;
  if(!groups.length){
    html += '<div class="empty-msg">No possible duplicates right now.</div>';
    app.innerHTML = html;
    return;
  }
  for(const g of groups){
    // data-* attributes, not values baked into onclick strings -- a company name can
    // contain an apostrophe (breaks a single-quoted onclick, and is bad practice besides).
    html += `<div class="panel" data-group="${esc(g.normalized_name)}" data-ids="${g.members.map(m=>esc(m.id)).join(',')}">
      <h2 style="text-transform:none;font-size:15px;letter-spacing:0">${esc(g.members[0].legal_name)}</h2>
      <div class="results">`;
    for(const m of g.members){
      html += `<div class="card" onclick="location.hash='entity/${esc(m.id)}'">
        <div class="r1"><span class="name">${esc(m.legal_name)}</span>
          ${m.kind&&m.kind!=='UNKNOWN'?`<span class="chip status">${esc(m.kind)}</span>`:''}
          ${m.source_seed?`<span class="chip status">${esc(m.source_seed)}</span>`:''}</div>
        <div class="meta">${num(m.owned_count)} owned &middot; ${num(m.role_count)} role${m.role_count===1?'':'s'} &middot; ${num(m.deal_count)} deal${m.deal_count===1?'':'s'}</div>
      </div>`;
    }
    html += '</div>';
    if(g.eligible && g.single_token){
      html += `<div class="row" style="margin-top:10px;gap:14px;align-items:center">
          <button class="btn" onclick="mergeDuplicateGroup(this)">Merge these ${g.members.length} into one</button>
          <span class="meta" style="color:var(--warn)">&#9888; single-word name -- confirm this is really the same company</span>
          <a onclick="dismissDuplicateGroup(this)">Not a duplicate</a>
        </div>`;
    } else if(g.eligible){
      html += `<div class="row" style="margin-top:10px;gap:14px;align-items:center">
          <button class="btn" onclick="mergeDuplicateGroup(this)">Merge these ${g.members.length} into one</button>
          <a onclick="dismissDuplicateGroup(this)">Not a duplicate</a>
        </div>`;
    } else {
      html += `<div class="meta" style="margin-top:10px">Can't auto-merge: ${esc(g.reason)}.
          <a onclick="dismissDuplicateGroup(this)">Not a duplicate</a></div>`;
    }
    html += '</div>';
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
}

async function mergeDuplicateGroup(btn){
  const panel = btn.closest('[data-group]');
  const ids = panel.dataset.ids.split(',');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Merging...';
  try {
    const r = await fetch('/api/duplicates/merge', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({entity_ids: ids})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ alert(j.error||'Merge failed'); btn.disabled=false; btn.textContent=label; return; }
    panel.innerHTML = `<div class="empty-msg">Merged. <a onclick="location.hash='entity/${esc(j.keeper_id)}'">View the surviving record &rarr;</a></div>`;
  } catch(e){
    alert('Could not reach the server.'); btn.disabled = false; btn.textContent = label;
  }
}

async function dismissDuplicateGroup(link){
  const panel = link.closest('[data-group]');
  const name = panel.dataset.group;
  const label = link.textContent;
  link.textContent = 'Dismissing...';
  try {
    const r = await fetch('/api/duplicates/dismiss', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({normalized_name: name})});
    if(!r.ok){ alert('Could not dismiss this group.'); link.textContent = label; return; }
    panel.remove();
  } catch(e){
    alert('Could not reach the server.'); link.textContent = label;
  }
}

// ---------- SNF owners you cannot call ----------
// CMS publishes every 5%-or-greater owner of a certified nursing home, and how much they
// hold. It does not publish a phone number. So this is the list of people who own these
// buildings outright and have no way to be reached -- names, not leads. Ordered by how many
// facilities each one holds, because a name attached to eleven buildings is worth an
// afternoon of looking and a name attached to one is worth a minute.
function cmsChip(r){
  if(r.owner_source !== 'cms') return '';
  const pct = r.owner_pct!=null ? Math.round(r.owner_pct)+'%' : '';
  return `<span class="cmschip" title="Named in the CMS nursing-home ownership disclosure as holding ${pct||'a 5%+ stake'} of this facility. Not a TLO result.">CMS ${pct}</span>`;
}

// CMS files names in shouting caps ("TRESS, AVROHOM"). Title-case for reading, but leave
// the interior capitals of a McDonald or an O'Brien alone.
function niceName(s){
  return (s||'').toLowerCase().replace(/(^|[\s'\-])([a-z])/g, (m,a,b)=>a+b.toUpperCase())
    .replace(/\bMc([a-z])/g, (m,a)=>'Mc'+a.toUpperCase());
}
function shortRole(s){
  return (s||'').replace(/5% Or Greater /i,'5%+ ').replace(/ Ownership Interest/i,'')
    .replace(/ Interest/i,'').replace(/Of The SNF/i,'of the SNF');
}

let snfOwnState = '';
async function renderSnfOwners(hash){
  const qi = (hash||'').indexOf('?');
  const p = qi>=0 ? new URLSearchParams(hash.slice(qi+1)) : new URLSearchParams();
  const st = p.get('state') || '';
  const showAll = p.get('all') === '1';
  const maxPort = p.get('max_portfolio') || '2';
  app.innerHTML = '<div class="spinner">Finding nursing homes with an owner you cannot call...</div>';
  const d = await apiJSON('/api/snfowners?' + new URLSearchParams({
    ...(st?{state:st}:{}), ...(showAll?{all:'1'}:{}), max_portfolio: maxPort}).toString());
  if(!d || d.error){ app.innerHTML = '<div class="empty-msg">'+esc((d&&d.error)||'Could not load.')+'</div>'; return; }
  const fac = d.facilities || [];
  const chip = (on,label,changes) => `<span class="chip status" style="cursor:pointer;${on?'outline:1px solid var(--accent)':''}"
      onclick='snfOwnersGo(${JSON.stringify(changes)})'>${label}</span>`;

  let html = `<div class="cl-head"><h1>&#127973; SNF Owners To Find</h1></div>
    <div class="cl-sub">Nursing homes whose <b>50%+ owner</b> has no phone number yet. One row per building,
      opened to show who holds it. Find the number once and every home that owner holds becomes callable
      &mdash; and they all leave this list together.</div>
    <div class="row" style="gap:8px;margin:10px 0 6px;align-items:center;flex-wrap:wrap">
      ${chip(!st,'All states',{state:''})}${chip(st==='CA','CA',{state:'CA'})}${chip(st==='AZ','AZ',{state:'AZ'})}${chip(st==='CO','CO',{state:'CO'})}
      <span style="width:14px"></span>
      ${chip(maxPort==='2','Owns 1&ndash;2 homes',{max_portfolio:'2'})}
      ${chip(maxPort==='any','Any portfolio size',{max_portfolio:'any'})}
      <span style="flex:1"></span>
      ${chip(showAll,'Include owners I can already call',{all: showAll?'':'1'})}
    </div>
    <div class="muted" style="margin-bottom:12px">${fac.length} facilit${fac.length===1?'y':'ies'}
      &middot; ${d.owner_count} owner${d.owner_count===1?'':'s'} to find
      ${maxPort==='2'?' &middot; <span style="color:var(--good)">small portfolios only &mdash; the ones that actually trade</span>':''}</div>`;

  if(!fac.length){
    html += '<div class="empty-msg">Nothing here right now. Try widening the portfolio size or including owners you can already call.</div>';
    app.innerHTML = html; return;
  }
  for(const f of fac){
    const bits = [];
    if(f.beds) bits.push('<b>'+num(f.beds)+'</b> beds');
    if(f.total_units) bits.push('<b>'+num(f.total_units)+'</b> units');
    if(f.year_built) bits.push('built '+esc(f.year_built));
    const where = [f.city, f.state].filter(Boolean).join(', ');
    html += `<div class="snfown-card" data-pid="${esc(f.property_id)}">
      <div class="snfown-top">
        <div class="snfown-name">
          <a onclick="location.hash='property/${esc(f.property_id)}'">${esc(f.name)}</a>
          <span class="chip ${esc(f.asset_class||'')}">${esc(f.asset_label||'SNF')}</span>
        </div>
        <div class="snfown-stat">${esc(where)}${bits.length?' &middot; '+bits.join(' &middot; '):''}
          ${f.address?'<br><span style="opacity:.7">'+esc(f.address)+'</span>':''}
          ${f.address?`<a class="tlolink" href="${tloPropertyUrl(f.address, f.zip, f.city, f.state)}" target="_blank" rel="noopener"
             title="TLO Assets &gt; Real Estate: the parcel names the owning LLC, and the owner's contacts from there"
             data-q="${esc(f.address)}" onclick="tloCopy(this.dataset.q);event.stopPropagation();">&#128269; Open this address in TLO</a>`:''}</div>
      </div>
      <div class="snfown-owners">`;
    for(const o of f.owners){
      const alsoIds = [f.property_id].concat((o.portfolio||[]).map(x=>x.property_id)).join(',');
      const also = (o.portfolio||[]).length
        ? `<div class="own-also">also holds ${o.portfolio.map(x=>
            `<a onclick="location.hash='property/${esc(x.property_id)}'">${esc(x.name)}</a>`).join(', ')}
            &mdash; one number covers all ${o.portfolio_count}</div>`
        : '<div class="own-also">this is their only nursing home</div>';
      html += `<div class="ownrow" data-owner="${esc(o.owner_name)}" data-eid="${esc(o.entity_id||'')}"
                    data-pids="${esc(alsoIds)}" data-name="${esc(o.display_name)}">
        <div class="own-head">
          <span class="own-pct">${o.pct!=null?Math.round(o.pct)+'%':'&mdash;'}</span>
          <span class="own-name">${o.entity_id
            ? `<a onclick="location.hash='entity/${esc(o.entity_id)}'">${esc(o.display_name)}</a>`
            : esc(o.display_name)}</span>
          <span class="own-port">${o.portfolio_count} home${o.portfolio_count===1?'':'s'}</span>
          ${o.has_phone?`<span class="chip status">${esc(o.phones[0])}</span>`:''}
          <a class="own-add" onclick="showOwnerContactForm(this)">+ got a number</a>
        </div>
        ${also}
        <div class="own-slot"></div>
      </div>`;
    }
    html += `</div></div>`;
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function snfOwnersGo(changes){

// ---------- duplicate people review ----------
// Two questions on one page, deliberately not mixed: the top half is "these are the same
// person and here is the proof", the bottom half is "these share a name and nothing else,
// you tell me". Merging is one click either way; what differs is how much the page is
// willing to claim.
function dupeContactCard(m, isKeeper){
  const lines = [];
  if(m.phone_mobile) lines.push('C: '+esc(m.phone_mobile)+facTag(m.phone_mobile));
  if(m.phone_office) lines.push('O: '+esc(m.phone_office)+facTag(m.phone_office));
  if(m.phone_home) lines.push('H: '+esc(m.phone_home));
  const mails = [m.email, m.email_alt].filter(Boolean).map(esc);
  const bits = [];
  bits.push(m.properties + ' propert' + (m.properties===1?'y':'ies'));
  if(m.companies) bits.push(m.companies + ' compan' + (m.companies===1?'y':'ies'));
  if(m.notes_count) bits.push(m.notes_count + ' note' + (m.notes_count===1?'':'s'));
  if(m.source) bits.push('via ' + esc(m.source));
  // Which record survives is Hap's call, not the row count's: the copy holding the most
  // buildings is sometimes the job the person just left. Clicking a card moves the KEEPS
  // badge to it, and the merge follows.
  return `<div class="dupecard ${isKeeper?'keeper':''}" data-id="${esc(m.id)}" onclick="pickDupeKeeper(this)">
    <div class="dc-name"><a onclick="event.stopPropagation();location.hash='contact/${esc(m.id)}'">${esc(m.name||'(no name)')}</a>
      ${isKeeper?'<span class="dc-keep">KEEPS</span>':'<span class="dc-pick">keep this one</span>'}${m.do_not_contact?' <span class="dnc">DNC</span>':''}</div>
    <div class="dc-meta">${bits.join(' &middot; ')}</div>
    ${m.title?`<div class="dc-meta">${esc(m.title)}</div>`:''}
    ${lines.length?`<div class="dc-line">${lines.join(' &nbsp;&middot;&nbsp; ')}</div>`:''}
    ${mails.length?`<div class="dc-line">${mails.join('<br>')}</div>`:''}
    ${(m.company_names&&m.company_names.length)?`<div class="dc-co">${m.company_names.map(esc).join(' &middot; ')}</div>`:''}
  </div>`;
}

function pickDupeKeeper(card){
  const panel = card.closest('[data-ids]');
  panel.dataset.keeper = card.dataset.id;
  panel.querySelectorAll('.dupecard').forEach(el => {
    const mine = el === card;
    el.classList.toggle('keeper', mine);
    const badge = el.querySelector('.dc-keep, .dc-pick');
    if(badge){
      badge.className = mine ? 'dc-keep' : 'dc-pick';
      badge.textContent = mine ? 'KEEPS' : 'keep this one';
    }
  });
}

function dupeGroupPanel(g, confirmed){
  const ids = g.members.map(m=>m.id).join(',');
  const keeper = confirmed ? g.members[0].id : '';
  const label = g.key.replace(/\b\w/g, c=>c).toLowerCase().replace(/\b\w/g, c=>c.toUpperCase());
  return `<div class="panel" data-key="${esc(g.key)}" data-ids="${esc(ids)}" data-keeper="${esc(keeper)}">
    <h2 style="text-transform:none;font-size:15px;letter-spacing:0">${esc(label)}
      <span class="hint-dbl">${g.members.length} records &middot; ${g.properties} property link${g.properties===1?'':'s'}</span></h2>
    <div class="hint" style="margin-bottom:6px">The record marked <b>KEEPS</b> survives and everything
      folds onto it. Click a different card to keep that one instead.</div>
    <div class="dupe-why ${confirmed?'':'judge'}">${confirmed
      ? '&#10003; ' + esc(g.reason) + ' &mdash; the same person recorded twice'
      : 'Same name, nothing else in common. Open each one before you decide.'}</div>
    <div class="dupegrid">${g.members.map((m,i)=>dupeContactCard(m, confirmed && m.id===keeper)).join('')}</div>
    <div class="row" style="margin-top:10px;gap:14px;align-items:center">
      <button class="btn" onclick="mergePeopleGroup(this)">Merge these ${g.members.length} into one</button>
      <a onclick="dismissPeopleGroup(this)">Not the same person</a>
    </div>
  </div>`;
}

async function renderPeopleDuplicates(){
  app.innerHTML = '<div class="spinner">Looking for duplicate people...</div>';
  const d = await apiJSON('/api/contact-duplicates');
  if(!d || d.error){ app.innerHTML = '<div class="empty-msg">'+esc((d&&d.error)||'Could not load.')+'</div>'; return; }
  const conf = d.confirmed || [], rev = d.review || [];
  let html = `<a class="back" onclick="location.hash='owners'">&larr; Back to Owners &amp; Contacts</a>
    <div class="dhead"><h1>Duplicate People</h1>
    <div class="sub">One human should be one record holding every building they touch and every LLC
    they sit behind. Merging repoints all of it onto the keeper and folds in any phone, email or
    note the others had; the record that goes away is kept (soft-deleted) for audit.
    ${d.dismissed_count?` &middot; ${d.dismissed_count} name${d.dismissed_count===1?'':'s'} already marked "not the same person"`:''}</div></div>`;

  if(!conf.length && !rev.length){
    html += '<div class="empty-msg">No duplicate people to review right now.</div>';
    app.innerHTML = html; return;
  }
  if(conf.length){
    html += `<div class="dupe-sec">Confirmed by evidence &mdash; ${conf.length} group${conf.length===1?'':'s'}
      <span>a shared phone, email, employer or building ties these records together</span></div>`;
    html += conf.map(g=>dupeGroupPanel(g, true)).join('');
  }
  if(rev.length){
    html += `<div class="dupe-sec">Your call &mdash; ${rev.length} group${rev.length===1?'':'s'}
      <span>same name, nothing corroborating it. Two people really can share a name.</span></div>`;
    html += rev.map(g=>dupeGroupPanel(g, false)).join('');
  }
  app.innerHTML = html;
  window.scrollTo(0,0);
}

async function mergePeopleGroup(btn){
  const panel = btn.closest('[data-ids]');
  const ids = panel.dataset.ids.split(',');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Merging...';
  const d = await apiJSON('/api/contact-duplicates/merge', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contact_ids: ids, keeper_id: panel.dataset.keeper || undefined})});
  if(!d || d.error){
    alert((d && d.error) || 'Merge failed');
    btn.disabled = false; btn.textContent = label; return;
  }
  const props = d.held_properties||0, cos = d.held_companies||0;
  panel.innerHTML = `<div class="empty-msg">Merged. <b>${esc(d.keeper_name||'One record')}</b> now holds
    ${props} propert${props===1?'y':'ies'}${cos?` under ${cos} compan${cos===1?'y':'ies'}`:''}, on one record.
    <a onclick="location.hash='contact/${esc(d.keeper_id)}'">Open it &rarr;</a></div>`;
}

async function dismissPeopleGroup(link){
  const panel = link.closest('[data-key]');
  const label = link.textContent;
  link.textContent = 'Dismissing...';
  const d = await apiJSON('/api/contact-duplicates/dismiss', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({name_key: panel.dataset.key})});
  if(!d || d.error){ alert((d && d.error) || 'Could not dismiss this group.'); link.textContent = label; return; }
  panel.remove();
}

// ---------- contact profile ----------
// ---------- contact profile: details + portfolio editing ----------
// The phone book half of a person's page. Everything you might dial or write to lives in
// one panel behind one Edit button, because the alternative -- a cell number buried in a
// call note, a home line only ever written on the property page -- is how a callback gets
// missed.
const CONTACT_DETAIL_ROWS = [
  ['phone_mobile', 'Cell',        'tel'],
  ['phone_office', 'Office',      'tel'],
  ['phone_home',   'Home',        'tel'],
  ['email',        'Email',       'mailto'],
  ['email_alt',    'Other email', 'mailto'],
  ['linkedin_url', 'LinkedIn',    'url'],
  ['mailing_address', 'Mailing address', 'text'],
];

function contactDetailsHTML(c){
  let h = '';
  if(c.title) h += `<div class="dt-row"><span class="dt-k">Title</span><span class="dt-v">${esc(c.title)}</span></div>`;
  if(c.age) h += `<div class="dt-row"><span class="dt-k">Age</span><span class="dt-v">${esc(String(c.age))}<span class="ex"> (born ${esc(String(c.birth_year))})</span></span></div>`;
  const rows = CONTACT_DETAIL_ROWS.filter(r => c[r[0]]).map(([f, label, kind]) => {
    const v = c[f];
    let val = esc(v);
    if(kind === 'tel') val = '<a href="tel:'+esc(v)+'">'+esc(v)+'</a>'+facTag(v);
    else if(kind === 'mailto') val = '<a href="mailto:'+esc(v)+'">'+esc(v)+'</a>';
    else if(kind === 'url'){
      const u = /^https?:\/\//i.test(v) ? v : ('https://'+v);
      val = '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(v.replace(/^https?:\/\//,''))+'</a>';
    }
    if(f === 'mailing_address' && c.mailing_as_of) val += `<span class="ex"> (as of ${esc(c.mailing_as_of)})</span>`;
    return `<div class="dt-row"><span class="dt-k">${label}</span><span class="dt-v">${val}</span></div>`;
  }).join('');
  h += rows;
  if(c.facility_phone) h += `<div class="dt-row"><span class="dt-k">Facility</span><span class="dt-v"><a href="tel:${esc(c.facility_phone)}">${esc(c.facility_phone)}</a><span class="ex"> front desk${c.facility_phone_name?' of '+esc(c.facility_phone_name):''}</span></span></div>`;
  if(!h) h = '<div class="empty-msg" style="margin:0">Nothing on file yet &mdash; add a cell, a home line or an email.</div>';
  if(c.do_not_contact) h += '<div class="dt-row"><span class="dt-k">Status</span><span class="dt-v"><span class="dnc">DO NOT CONTACT</span></span></div>';
  if(c.notes) h += `<div class="cnotes" style="margin-top:8px">${esc(c.notes)}</div>`;
  return h;
}

// Property typeahead -- the mirror image of the owner picker (onEntityInput): you attach a
// building that already exists in the database rather than typing a name that matches
// nothing. Each hit shows the owner already recorded on it, so adding a person to a
// property CoStar already gave an owner is a decision, not an accident.
let propSugTimer = null;
function onPropertyInput(input){
  const form = input.closest('.addprop-form');
  form.dataset.propId = '';
  form.dataset.propOwner = '';
  const box = form.querySelector('.entsug');
  const q = input.value.trim();
  clearTimeout(propSugTimer);
  if(q.length < 2){ box.style.display='none'; box.innerHTML=''; return; }
  propSugTimer = setTimeout(async () => {
    const d = await apiJSON('/api/properties?q='+encodeURIComponent(q));
    if(d && d.error){
      box.innerHTML = '<div class="es-row"><div class="es-meta">'+esc(d.error)+'</div></div>';
      box.style.display = '';
      return;
    }
    const ps = (d && d.properties) || [];
    if(!ps.length){
      box.innerHTML = '<div class="es-row"><div class="es-meta">No facility matches that. This links buildings already in the database.</div></div>';
      box.style.display = '';
      return;
    }
    box.innerHTML = ps.map(pr => {
      const bits = [];
      if(pr.city||pr.state) bits.push(esc([pr.city, pr.state].filter(Boolean).join(', ')));
      if(pr.asset_label) bits.push(esc(pr.asset_label));
      if(pr.total_units) bits.push(num(pr.total_units)+' units');
      bits.push(pr.owner_name ? 'owner: '+esc(pr.owner_name) : 'no owner recorded');
      return `<div class="es-row" data-id="${esc(pr.id)}" data-name="${esc(pr.name)}"
                   data-owner="${esc(pr.owner_name||'')}" onclick="pickProperty(this)">
        <div class="es-name">${esc(pr.name)}</div>
        <div class="es-meta">${bits.join(' &middot; ')}</div>
      </div>`;
    }).join('');
    box.style.display = '';
  }, 200);
}

async function removeContactProperty(el){

// A person changing firms is the most common way this database goes stale: the feeds keep
// them attached to the old employer's entire portfolio forever, so a name that looks like
// the right call is 62 buildings out of date. This unwinds it in one step, and is careful
// about the difference between what belonged to the JOB (a desk line, a work address) and
// what belongs to the PERSON (their cell, their own email) -- the second kind follows them
// to the new firm and must survive.
async function showLeftCompany(el){
  const eid = el.dataset.eid, nm = el.dataset.name;
  const slot = document.querySelector(`.leftco-slot[data-slotfor="${eid}"]`);
  if(!slot) return;
  if(slot.dataset.open){ slot.innerHTML=''; slot.dataset.open=''; return; }
  slot.dataset.open = '1';
  slot.innerHTML = '<div class="leftco-form">Checking what came from this company...</div>';
  const pv = await apiJSON('/api/contact-left-company/preview', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contact_id: curContactId, entity_id: eid})});
  if(!pv || pv.error){
    slot.innerHTML = `<div class="leftco-form">${esc((pv&&pv.error)||'Could not check that.')}</div>`;
    return;
  }
  const c = curContact || {};
  const jobFields = [['email','Email',c.email],['email_alt','Other email',c.email_alt],
    ['phone_mobile','Cell phone',c.phone_mobile],['phone_office','Office phone',c.phone_office],
    ['phone_home','Home phone',c.phone_home],['title','Title',c.title]];
  const boxes = jobFields.filter(f=>f[2]).map(([f,label,v]) =>
    `<label><input type="checkbox" class="lc-clear" value="${esc(f)}"> ${esc(label)}: ${esc(v)}</label>`).join('');
  slot.innerHTML = `<div class="leftco-form" data-eid="${esc(eid)}">
    <h4>${esc(nm)} &mdash; no longer works here?</h4>
    <div class="lc-what">This removes their job at ${esc(nm)}${pv.property_links
      ? ` and the <b>${pv.property_links} propert${pv.property_links===1?'y':'ies'}</b> they are only linked to because of it`
      : ''}. The buildings themselves, their owners and every note are untouched.</div>
    ${pv.unexplained_links?`<label style="margin-top:9px"><input type="checkbox" class="lc-unexp" checked>
      Also drop <b>${pv.unexplained_links} other propert${pv.unexplained_links===1?'y':'ies'}</b> no company of theirs owns
      &mdash; leftovers from the old job</label>`:''}
    ${boxes?`<div style="margin-top:9px"><b style="font-size:12.5px">Tick anything that went with the job:</b>${boxes}</div>`:''}
    <div class="lc-keep">&#10003; Anything left unticked stays &mdash; a cell number and a personal
      address follow the person to wherever they went next.</div>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="saveLeftCompany(this)">They left ${esc(nm)}</button>
      <a onclick="showLeftCompany(document.querySelector('.leftco[data-eid=\'${esc(eid)}\']'))" style="align-self:center">cancel</a></div>
  </div>`;
}

async function saveLeftCompany(btn){
  const form = btn.closest('.leftco-form');
  const clear = [...form.querySelectorAll('.lc-clear:checked')].map(b=>b.value);
  btn.disabled = true; btn.textContent = 'Recording...';
  const d = await apiJSON('/api/contact-left-company', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contact_id: curContactId, entity_id: form.dataset.eid, clear_fields: clear,
                          drop_unexplained: !!form.querySelector('.lc-unexp:checked')})});
  if(!d || d.error){
    alert((d && d.error) || 'Could not record that.');
    btn.disabled = false; btn.textContent = 'They left'; return;

  renderContact(curContactId);
}
