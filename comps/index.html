<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<!-- Sign-in for the cloud copy of the Sales Comp Report. comps_page/build.py places this in
     the page's <head>, ahead of the app's own scripts. It signs the user in with Supabase
     Auth (email and password; a first-time or reset link lets them choose the password) and
     sends their token with every /api/ request the page makes, to the bs-comps function.
     Nothing here is secret: the key below is the project's public key, and every request is
     checked against the signed-in user on the server. -->
<script>window.COMPS_ONLY = true;</script>
<style>
  #gate { position: fixed; inset: 0; z-index: 10000; background: #0f1419; color: #e6edf3; display: none;
          align-items: center; justify-content: center; padding: 24px; font: 15px "Segoe UI", -apple-system, sans-serif; }
  #gate.on { display: flex; }
  #gate form { width: 100%; max-width: 360px; background: #1a2129; border: 1px solid #2e3a47; border-radius: 12px; padding: 24px 22px; }
  #gate h1 { font-size: 20px; margin: 0 0 4px; }
  #gate p { color: #8b9aa8; font-size: 13.5px; margin: 0 0 14px; }
  #gate label { display: block; font-size: 12.5px; color: #8b9aa8; margin: 12px 0 5px; }
  #gate input { width: 100%; box-sizing: border-box; padding: 10px 11px; font-size: 15px; color: #e6edf3; background: #0f1419;
                border: 1px solid #2e3a47; border-radius: 8px; }
  #gate button { width: 100%; margin-top: 18px; padding: 11px; font-size: 15px; font-weight: 600; color: #fff; background: #4a9eff;
                 border: 0; border-radius: 8px; cursor: pointer; }
  #gate .err { color: #ffb3ae; font-size: 13.5px; min-height: 18px; margin-top: 12px; }
  #gate-out { position: fixed; left: 12px; bottom: 8px; font-size: 12px; color: #8b9aa8; z-index: 5; cursor: pointer; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
  const URL_ = 'https://gpgeevlmecgomazqyhdz.supabase.co', KEY = 'sb_publishable_CjDdEouLDrWLgLI73LO4Sg_Lo5QY9V9', API = URL_ + '/functions/v1/bs-comps';
  const sb = supabase.createClient(URL_, KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'bs-comps-auth' } });
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let step = 'password', gate = null, form = null;
  // A first-time or reset link lands here with its token in the address.
  const arriving = /type=(recovery|invite)/.test(location.hash) || /type=(recovery|invite)/.test(location.search);

  function draw(message) {
    if (!gate) {
      if (!document.body) return document.addEventListener('DOMContentLoaded', () => draw(message));
      gate = document.createElement('div'); gate.id = 'gate';
      form = document.createElement('form'); form.autocomplete = 'on';
      gate.appendChild(form); document.body.appendChild(gate);
      form.addEventListener('submit', submit);
    }
    gate.classList.add('on');
    if (step === 'password') {
      form.innerHTML = '<h1>Sales Comp Report</h1><p>The Knapp Stahler Group</p>' +
        '<label for="g-email">Email</label><input id="g-email" type="email" autocomplete="username" required>' +
        '<label for="g-pass">Password</label><input id="g-pass" type="password" autocomplete="current-password" required>' +
        '<button type="submit">Sign in</button><div class="err">' + esc(message) + '</div>';
    } else {
      form.innerHTML = '<h1>Choose your password</h1><p>At least 10 characters. You will use it with your email to sign in from now on.</p>' +
        '<label for="g-new">New password</label><input id="g-new" type="password" autocomplete="new-password" minlength="10" required>' +
        '<label for="g-again">Again</label><input id="g-again" type="password" autocomplete="new-password" minlength="10" required>' +
        '<button type="submit">Save and continue</button><div class="err">' + esc(message) + '</div>';
    }
    const first = form.querySelector('input');
    if (first) first.focus();
  }

  async function submit(e) {
    e.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    try {
      if (step === 'password') {
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('g-email').value.trim(), password: document.getElementById('g-pass').value });
        if (error) return draw('That email and password did not match.');
      } else {
        const a = document.getElementById('g-new').value, b = document.getElementById('g-again').value;
        if (a !== b) return draw('The two passwords are not the same.');
        const { error } = await sb.auth.updateUser({ password: a });
        if (error) return draw(error.message || 'That password was not accepted.');
      }
      location.replace(location.pathname);        // a clean address, signed in
    } catch (err) {
      draw('Could not reach the server. Check your connection and try again.');
    } finally {
      button.disabled = false;
    }
  }

  sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') { step = 'new'; draw(''); } });
  sb.auth.getSession().then(({ data }) => {
    if (arriving && data && data.session) { step = 'new'; return draw(''); }
    if (!data || !data.session) { step = 'password'; draw(arriving ? 'That link has expired. Ask Hap for a new one.' : ''); }
  });

  // Every request the page makes to its own API goes to Supabase with the user's token.
  const plain = window.fetch.bind(window);
  window.fetch = async function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (url.indexOf('/api/') !== 0) return plain(input, init);
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) {
      step = 'password'; draw('');
      return new Response(JSON.stringify({ error: 'Please sign in.' }), { status: 401, headers: { 'Content-Type': 'application/json' } });
    }
    const headers = new Headers((init && init.headers) || {});
    headers.set('Authorization', 'Bearer ' + data.session.access_token);
    const r = await plain(API + url, Object.assign({}, init || {}, { headers }));
    if (r.status === 401) { step = 'password'; draw('Please sign in again.'); }
    return r;
  };

  document.addEventListener('DOMContentLoaded', () => {
    const out = document.createElement('a');
    out.id = 'gate-out'; out.textContent = 'Sign out';
    out.onclick = async () => { await sb.auth.signOut(); step = 'password'; draw(''); };
    document.body.appendChild(out);
  });
})();
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Senior Housing BetaStation</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    /* Height of the sticky header. Everything that parks itself under the header
       keys off this, so the header only has to be measured in one place. */
    --hdr: 59px;
    --bg: #0f1419;
    --panel: #1a2129;
    --panel-2: #222c37;
    --line: #2e3a47;
    --text: #e6edf3;
    --muted: #8b9aa8;
    --accent: #4a9eff;
    --accent-soft: #1d3a5f;
    --good: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --chip: #2a3845;
    /* One grey band for the row the cursor is on -- light enough to read over a
       tinted cell, quiet enough not to compete with the blue selection tints. */
    --rowhover: #313d4b;
  }
  * { box-sizing: border-box; }
  /* ---- row hover ----
     Every wide list gets one grey highlight across the whole row, so the eye can
     track from the property name out to the last column without losing its line.
     It is painted on the cells, not the row, because several of these tables tint
     individual tds (picked comps, needs-review, principal contacts) and a tr
     background would sit behind those and never show. Rows carrying an inline
     background -- the group header bands -- keep it, which is what we want. */
  table.sc tbody tr:hover > td,
  table.scn tbody tr:hover > td,
  table.cl tbody tr:hover > td,
  table.tx tbody tr:hover > td,
  table.hist tbody tr:hover > td,
  table.umtable tbody tr:hover > td,
  table.brief tbody tr:hover > td { background: var(--rowhover); }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #131a21, #0f1419);
    border-bottom: 1px solid var(--line);
    padding: 11px 12px;
    display: flex; align-items: center; gap: 7px var(--navgap, 8px);
    /* One row, always: the nav type is sized to fit by fitHeaderNav() below rather than
       wrapping, because a wrapped nav buries the last tabs on a second line. On a window
       too narrow for even the smallest type that function adds .nav-wrap, so the tabs
       still all stay reachable instead of running off the edge. */
    flex-wrap: nowrap;
  }
  header.nav-wrap { flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; cursor: pointer; margin-right: 1px; }
  .brand span { color: var(--accent); transition: color .15s; }
  .brand:hover span { color: #7cbaff; }
  /* Spins only on hover, not constantly -- this sits in a sticky header visible all day,
     so a background animation would just be a distraction during real work. */
  .brand .orbit { display: inline-block; margin-right: 2px; transition: transform .6s ease; }
  .brand:hover .orbit { transform: rotate(360deg); }
  /* The search box is the one flexible thing up here: it soaks up whatever width the nav
     leaves over, and gives width back first so the nav stays on one row. Flex decides
     where to wrap from the basis, not the shrunk width, so the basis is deliberately
     small -- that is what keeps the header a single row on a normal window. */
  .searchwrap { flex: 1 1 120px; min-width: 120px; position: relative; max-width: 460px; }
  #search {
    width: 100%; padding: 10px 12px; font-size: 15px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  /* Instant results, from the first letter. Hap is usually mid-call when he types, so
     this has to land under the box while he is still typing -- not after a page render,
     and not after he has backed the query down to one word to make it work. */
  .qsug {
    position: absolute; z-index: 40; left: 0; right: 0; top: 100%; margin-top: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: 0 10px 28px rgba(0,0,0,.55); overflow: hidden;
    min-width: 440px; max-height: min(70vh, 560px); overflow-y: auto;
  }
  .qsug .qs-head {
    padding: 5px 11px; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); font-weight: 700; background: #141b23;
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
  }
  .qsug .qs-row {
    display: flex; align-items: baseline; gap: 9px; padding: 7px 11px; cursor: pointer;
    border-bottom: 1px solid #232d38;
  }
  .qsug .qs-row:last-child { border-bottom: 0; }
  .qsug .qs-row.sel { background: var(--accent-soft); }
  .qsug .qs-body { min-width: 0; flex: 1; }
  .qsug .qs-name { font-weight: 600; font-size: 13.5px; }
  .qsug .qs-name b { color: var(--accent); font-weight: 700; }
  .qsug .qs-sub, .qsug .qs-meta {
    color: var(--muted); font-size: 11.5px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .qsug .qs-kind {
    flex: 0 0 auto; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
    background: var(--chip); color: var(--muted); align-self: flex-start;
  }
  .qsug .qs-kind.property { color: #7fd3a0; background: rgba(63,185,80,.13); }
  .qsug .qs-kind.entity   { color: #7fbcff; background: rgba(74,158,255,.14); }
  .qsug .qs-kind.contact  { color: #e0b86a; background: rgba(210,153,34,.14); }
  .qsug .qs-kind.development { color: #c3a2f0; background: rgba(160,120,240,.15); }
  .qsug .qs-kind.comp     { color: #8fd7dd; background: rgba(20,180,200,.13); }
  .qsug .qs-foot {
    padding: 7px 11px; font-size: 11.5px; color: var(--muted); cursor: pointer;
    background: #141b23; border-top: 1px solid var(--line);
  }
  .qsug .qs-foot:hover, .qsug .qs-foot.sel { color: var(--text); background: var(--accent-soft); }
  .qsug .qs-empty { padding: 11px; font-size: 12.5px; color: var(--muted); }

  /* filter bar */
  .filterbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 24px; background: #131a21; border-bottom: 1px solid var(--line);
    position: sticky; top: var(--hdr); z-index: 9; font-size: 13px;
  }
  .filterbar .grp { display: flex; align-items: center; gap: 7px; }
  .filterbar label { color: var(--muted); font-weight: 600; }
  .filterbar select, .filterbar input {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; outline: none;
  }
  .filterbar input.units { width: 64px; }
  .filterbar select:focus, .filterbar input:focus { border-color: var(--accent); }
  .togglechip {
    display: inline-block; padding: 5px 11px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font-weight: 600; user-select: none;
  }
  .togglechip.active { background: var(--accent-soft); color: #cfe5ff; border-color: var(--accent); }
  .clearbtn { color: var(--muted); cursor: pointer; font-size: 12.5px; margin-left: auto; }
  .clearbtn:hover { color: var(--text); }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 24px 80px; }

  /* search results */
  .results { display: grid; gap: 10px; }
  .resultcount { color: var(--muted); font-size: 13px; margin: 4px 2px 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  .card:hover { border-color: var(--accent); background: var(--panel-2); }
  .card .r1 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card .name { font-weight: 650; font-size: 16px; }
  .card .addr { color: var(--muted); font-size: 13.5px; margin-top: 3px; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .card .meta b { color: var(--text); font-weight: 600; }

  .chip {
    display: inline-block; font-size: 11.5px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px; background: var(--chip); color: var(--text);
  }
  .chip.AL { background: #2b3a4d; color: #9cc4ff; }
  .chip.SNF { background: #3a2b40; color: #e3a7ff; }
  .chip.IL { background: #2b403a; color: #8fe0c0; }
  .chip.CCRC { background: #40392b; color: #ecd08f; }
  .chip.SENIOR_APT { background: #3a3340; color: #c9b3ff; }
  .chip.status { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .chip.portfolio { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .chip.deadend { background: #402b2b; color: #ff9c9c; }
  /* Not a dead end: a real owner whose call goes through a parent or operator. */
  .chip.callthru { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .chip.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
  /* Loans Coming Due signals: red = due now, amber = next year, blue = later, green/teal = HUD pitches. */
  .chip.ln-hot { background: #4a2626; color: #ff9c9c; }
  .chip.ln-warm { background: #45391f; color: #f2c46b; }
  .chip.ln-cool { background: #26374a; color: #9cc4ff; }
  .chip.ln-refi { background: #243f33; color: #86e0b0; }
  .chip.ln-assume { background: #24403f; color: #7fd8d8; }
  /* Loan note at the foot of Property Details: noticeable, not loud. */
  .ln-note { margin-top: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13px;
    border: 1px solid var(--line); border-left-width: 3px; color: var(--muted); }
  .ln-note b { color: var(--text); font-weight: 600; margin-right: 8px; }
  .ln-note-d { color: var(--muted); }
  .ln-note.hot { background: rgba(255,120,120,.07); border-color: rgba(255,120,120,.28); border-left-color: rgba(255,130,130,.7); }
  .ln-note.warm { background: rgba(242,196,107,.07); border-color: rgba(242,196,107,.26); border-left-color: rgba(242,196,107,.7); }
  .ln-note.refi { background: rgba(134,224,176,.06); border-color: rgba(134,224,176,.24); border-left-color: rgba(134,224,176,.65); }
  .ln-note.assume { background: rgba(127,216,216,.06); border-color: rgba(127,216,216,.24); border-left-color: rgba(127,216,216,.65); }
  .ln-tlo { font-size: 11px; opacity: .85; }
  .ln-tlo.refi { color: #f2c46b; opacity: 1; }
  .ln-sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; white-space: nowrap;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .chip.MC { background: #402b38; color: #ffb3d1; }
  .chip.ACTIVE_ADULT { background: #2b3a4d; color: #9cc4ff; }
  .chip.MIXED_USE { background: #2b3540; color: #9fd3ff; }
  .chip.DAYCARE { background: #333a2b; color: #c6e08f; }
  /* Development stage: green family for live/near-term, amber for early/paused, red for dead. */
  .chip.stage-Underway { background: #1f3a2a; color: #8fe0a8; }
  .chip.stage-Bidding { background: #1f3a2a; color: #8fe0a8; }
  .chip.stage-Planning { background: #2b3a4d; color: #9cc4ff; }
  .chip.stage-FinalPlanning { background: #2b3a4d; color: #9cc4ff; }
  .chip.stage-PrePlanning { background: #40392b; color: #ecd08f; }
  .chip.stage-Deferred { background: #40392b; color: #ecd08f; }
  .chip.stage-Abandoned { background: #402b2b; color: #ff9c9c; }

  /* ---- Sales Comp Report ---- */
  /* Comp grade: A cites clean in a BOV, B expect a question, C context only. */
  .grade { display:inline-block; width:17px; height:17px; line-height:17px; text-align:center;
           border-radius:3px; font-size:11px; font-weight:700; }
  .grade.A { background:#1f4030; color:#7fe0a8; }
  .grade.B { background:#403a1f; color:#e8d189; }
  .grade.C { background:#402b2b; color:#ff9c9c; }
  .flagdot { color: var(--muted); font-size: 11px; margin-left: 4px; cursor: help; }
  .reviewdot { color: #ffbb7a; font-size: 12px; margin-left: 4px; cursor: help; font-weight: 700; }
  table.sc tr.needsreview td { background: rgba(255,187,122,.07); }
  /* Wide report table: scrolls sideways inside its own box so the page never does. */
  .scwrap { overflow-x: auto; }
  table.sc { width: 100%; border-collapse: collapse; font-size: 12.5px; white-space: nowrap; }
  table.sc th, table.sc td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  table.sc thead th { position: sticky; top: 0; background: var(--panel); z-index: 1;
                      font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  table.sc th.sortable { cursor: pointer; user-select: none; }
  table.sc th.sortable:hover { color: #cfe5ff; }
  table.sc th.sorted { color: #cfe5ff; }
  table.sc td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.sc td.wide { white-space: normal; max-width: 190px; }
  .sc-stats { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--line);
              border-radius: 5px; margin: 10px 0; overflow: hidden; }
  .sc-stats > div { padding: 7px 13px; border-right: 1px solid var(--line); }
  .sc-stats > div:last-child { border-right: none; }
  .compfoot { margin: 16px 0 26px; padding: 13px 16px; border: 1px solid var(--line);
              border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
              background: var(--panel); font-size: 13px; line-height: 1.6; max-width: 900px; }
  .compfoot h3 { margin: 0 0 5px; font-size: 13.5px; letter-spacing: .01em; }
  .compfoot .kbd { display:inline-block; width:13px; height:13px; border:1px solid var(--muted);
                   border-radius:3px; vertical-align:-2px; margin:0 1px; }
  /* ---- comp selection tray ---- */
  .selbox { width:15px; height:15px; cursor:pointer; accent-color:#4f9cff; vertical-align:-2px; }
  table.sc tr.picked td { background: rgba(79,156,255,.10); }
  .seltray { position:sticky; bottom:0; z-index:5; display:flex; align-items:center; gap:12px;
             background:var(--panel); border-top:2px solid var(--accent);
             padding:10px 14px; margin-top:10px; border-radius:6px 6px 0 0;
             box-shadow:0 -4px 14px rgba(0,0,0,.35); flex-wrap:wrap; }
  .seltray .n { font-size:14px; font-weight:700; }
  .seltray .stat { font-size:12px; color:var(--muted); }
  .seltray .stat b { color:inherit; font-weight:700; }
  .selpick { display:flex; align-items:center; gap:8px; padding:5px 0;
             border-bottom:1px solid var(--line); font-size:13px; }
  .selpick:last-child { border-bottom:none; }
  .selpick .rm { cursor:pointer; color:var(--muted); font-size:14px; padding:0 5px; }
  .selpick .rm:hover { color:#ff9c9c; }
  .selpick .grow { flex:1; min-width:0; }
  .betaline { font-size: 12px; color: var(--muted); margin: 2px 0 8px; line-height: 1.5; max-width: 860px; }
  .betatag { display:inline-block; background:#4a3320; color:#ffbb7a; font-size:10px;
             font-weight:700; letter-spacing:.06em; text-transform:uppercase;
             padding:1px 6px; border-radius:3px; margin-right:6px; vertical-align:1px; }
  .sc-stats .k { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .sc-stats .v { font-size: 15px; font-weight: 700; }

  /* ---- Comp profile: source badges ---- */
  /* Which source a value came from. Dee outranks NIC MAP everywhere, per Hap. */
  .src { display:inline-block; font-size:9px; font-weight:700; letter-spacing:.05em;
         text-transform:uppercase; padding:1px 5px; border-radius:3px; margin-left:6px;
         vertical-align:middle; white-space:nowrap; }
  .src.dee    { background:#1f3b40; color:#7fd8e0; }
  .src.nicmap { background:#33304a; color:#b9b3ee; }
  .src.costar, .src.costar_alert { background:#402a1f; color:#f0ab7f; }
  .src.conflict { background:#4a3320; color:#ffbb7a; }
  .prof-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; }
  .prof-row { display:flex; justify-content:space-between; gap:10px; padding:4px 0;
              border-bottom:1px solid var(--line); font-size:13px; }
  .prof-row:last-child { border-bottom:none; }
  .prof-row .lab { color:var(--muted); flex:0 0 auto; }
  .prof-row .val { font-weight:600; text-align:right; }
  .prof-alt { font-size:11px; color:var(--muted); padding:2px 0 5px 0; }
  .prof-alt b { color:#ffbb7a; font-weight:600; }
  table.scn { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.scn th, table.scn td { padding:5px 9px; border-bottom:1px solid var(--line); text-align:right; }
  table.scn th:first-child, table.scn td:first-child { text-align:left; }
  table.scn thead th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .notebox { background:var(--panel); border-left:3px solid var(--accent); border-radius:0 4px 4px 0;
             padding:8px 11px; font-size:13px; line-height:1.5; white-space:pre-wrap; }
  /* ---- profile editing ---- */
  .prof-row .val { display:flex; align-items:center; gap:4px; justify-content:flex-end; }
  .pf-edit, .pf-conf { opacity:0; cursor:pointer; font-size:11px; padding:1px 4px; border-radius:3px;
                       border:1px solid var(--line); background:var(--panel); color:var(--muted); }
  .prof-row:hover .pf-edit, .prof-row:hover .pf-conf { opacity:1; }
  .pf-edit:hover, .pf-conf:hover { color:#cfe5ff; border-color:var(--accent); }
  .pf-conf.on { opacity:1; background:#1f4030; color:#7fe0a8; border-color:#2c5a44; }
  .pf-conf.stale { opacity:1; background:#4a3320; color:#ffbb7a; border-color:#6b4a2c; }
  .pf-in { background:var(--bg); border:1px solid var(--accent); border-radius:4px;
           color:inherit; padding:2px 6px; font-size:13px; width:170px; text-align:right; }
  .whoami { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  .whoami select { background:var(--panel); border:1px solid var(--line); border-radius:4px;
                   color:inherit; padding:3px 7px; font-size:12px; }
  .addfield { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .addfield select, .addfield input { background:var(--panel); border:1px solid var(--line);
       border-radius:4px; color:inherit; padding:4px 8px; font-size:12.5px; }
  .pf-hist { font-size:10px; color:var(--muted); cursor:help; white-space:nowrap; }
  table.hist { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.hist th, table.hist td { padding:5px 9px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  table.hist thead th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .act { display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase;
         letter-spacing:.04em; padding:1px 5px; border-radius:3px; }
  .act.edit      { background:#2b3a4d; color:#9cc4ff; }
  .act.clear     { background:#3a3340; color:#c9b3ff; }
  .act.confirm   { background:#1f4030; color:#7fe0a8; }
  .act.unconfirm { background:#402b2b; color:#ff9c9c; }
  .hist-old { color:var(--muted); text-decoration:line-through; }

  /* detail */
  .back { color: var(--muted); font-size: 14px; margin-bottom: 14px; display: inline-block; }
  .dhead { margin-bottom: 18px; }
  .dhead h1 { margin: 0 0 6px; font-size: 26px; }
  .dhead .sub { color: var(--muted); font-size: 15px; }
  .dhead .tags { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  /* Other licensed buildings at the same doorstep (nursing + AL + IL on one campus). */
  .campus-line { margin-top: 9px; font-size: 13px; color: var(--muted); }
  .campus-line a { cursor: pointer; font-weight: 600; }
  .campus-line .chip { font-size: 11px; padding: 1px 7px; margin-left: 2px; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 18px;
  }
  .minimap { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--panel-2); }
  .minimap .leaflet-popup-content-wrapper, .minimap .leaflet-popup-tip { background: var(--panel); color: var(--text); }
  .minimap .leaflet-popup-content a { color: var(--accent); }
  .panel h2 {
    margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 700;
  }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 7px 12px; font-size: 14.5px; }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--text); font-weight: 550; }
  .kv .v.empty { color: #5b6975; font-weight: 400; font-style: italic; }
  /* Property Details lines edit in place on a double-click. The dotted underline on hover is
     the only affordance -- the panel reads as plain values until you go to change one. */
  .kv .v.kv-ed { cursor: text; border-radius: 4px; margin: -2px -5px; padding: 2px 5px; }
  .kv .v.kv-ed:hover { background: var(--panel-2); box-shadow: inset 0 -1px 0 var(--line); }
  .kv-edit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .kv-in { background: var(--bg); color: var(--text); border: 1px solid var(--accent);
    border-radius: 6px; padding: 4px 7px; font-size: 14px; font-family: inherit; outline: none;
    min-width: 0; flex: 1 1 120px; }
  textarea.kv-in { width: 100%; flex-basis: 100%; resize: vertical; line-height: 1.45; }
  .kv-actions { display: flex; gap: 9px; align-items: center; flex: 0 0 auto; }
  .kv-actions .btn { padding: 3px 11px; font-size: 12.5px; }
  .kv-actions a { color: var(--muted); font-size: 12px; cursor: pointer; }
  .kv-actions a:hover { color: var(--accent); }
  .hint-dbl { font-size: 11px; font-weight: 400; color: var(--muted); font-style: italic;
    text-transform: none; letter-spacing: 0; margin-left: 8px; }

  /* ownership */
  .roleblock { margin-bottom: 14px; }
  .roleblock:last-child { margin-bottom: 0; }
  .rolelabel {
    font-size: 12px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
  }
  .entlist { display: grid; gap: 5px; }
  .entrow {
    display: flex; align-items: baseline; gap: 8px; justify-content: space-between;
    padding: 6px 10px; background: var(--panel-2); border-radius: 7px; font-size: 14px;
  }
  .entrow .nm { font-weight: 550; }
  .entrow .ex { color: var(--muted); font-size: 12px; }
  /* ownership editing */
  .rolelabel .rl-add { float: right; font-size: 11px; font-weight: 600; text-transform: none;
    letter-spacing: 0; cursor: pointer; color: var(--accent); }
  .entrow .rowacts { display: inline-flex; gap: 7px; margin-left: 8px; opacity: 0; transition: opacity .12s; }
  .entrow:hover .rowacts, .entrow:focus-within .rowacts { opacity: 1; }
  .entrow .rowacts a { font-size: 11px; color: var(--muted); cursor: pointer; }
  .entrow .rowacts a:hover { color: var(--accent); }
  .uichip { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px;
    border-radius: 20px; background: #1f3d2a; color: #86e0a4; margin-left: 6px; }
  .owner-form { display: grid; gap: 7px; margin: 6px 0; padding: 10px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  .owner-form input, .owner-form select {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 8px; font-size: 13px; font-family: inherit; width: 100%;
  }
  .owner-form input:focus, .owner-form select:focus { border-color: var(--accent); outline: none; }
  .owner-form .row2 { display: flex; gap: 7px; }
  .owner-form .row2 > * { flex: 1; min-width: 0; }
  .owner-form .hint { font-size: 11px; color: var(--muted); }
  .entpick { position: relative; }
  .entsug { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin-top: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
    max-height: 240px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .entsug .es-row { padding: 7px 9px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .entsug .es-row:last-child { border-bottom: 0; }
  .entsug .es-row:hover { background: var(--accent-soft); }
  .entsug .es-name { font-weight: 600; }
  .entsug .es-meta { color: var(--muted); font-size: 11px; margin-top: 1px; }
  .entsug .es-new { color: #86e0a4; }
  .tloaddr { font-size: 12.5px; margin: 0 0 10px; }
  .tloaddr .muted { margin-left: 6px; font-size: 11.5px; }
  .sosnote { font-size: 11.5px; color: var(--muted); margin: 2px 0 4px 10px; line-height: 1.35; }
  .sosnote.sos-deadend, .sosnote .sos-deadend { color: #b4541a; }
  .sosnote .suggest { color: #2e7d32; font-weight: 600; }
  .tlobadge { display: inline-flex; align-items: center; gap: 3px; vertical-align: middle;
    font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 999px; line-height: 1.4; position: relative; top: -2px;
    border: 1px solid transparent; white-space: nowrap; }
  .tlobadge.done { color: #1b7f4b; background: rgba(46,160,90,.12); border-color: rgba(46,160,90,.35); }
  .tlobadge.pending { color: #9a6a12; background: rgba(214,158,46,.12); border-color: rgba(214,158,46,.32); }
  .tlobadge.nic { color: #0f6e8c; background: rgba(20,160,200,.12); border-color: rgba(20,160,200,.34); }
  .tlobadge.suspect { color: #b4541a; background: rgba(214,90,26,.12); border-color: rgba(214,90,26,.4); }
  .parcel-warn { font-size: 12px; line-height: 1.4; margin: 0 0 12px; padding: 9px 11px;
    border: 1px solid rgba(214,90,26,.4); background: rgba(214,90,26,.08); border-radius: 8px; color: #8a3d12; }
  .parcel-warn .pw-note { font-weight: 400; color: var(--muted); margin: 3px 0 6px; }
  .parcel-warn .pw-seen { color: #b4541a; }
  .parcel-warn .tlolink { font-weight: 600; }
  .unitmix { margin-top: 8px; font-size: 13px; }
  .unitmix .umsum b { color: var(--accent); }
  .unitmix .umopen { color: var(--muted); margin-left: 8px; font-size: 12px; }
  .umdetails { margin-top: 5px; }
  .umdetails summary { cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; }
  .umtable { border-collapse: collapse; margin-top: 6px; font-size: 12px; }
  .umtable th, .umtable td { border: 1px solid var(--border, #2a2f3a); padding: 2px 9px; text-align: right; }
  .umtable th:first-child, .umtable td:first-child { text-align: left; font-weight: 600; }
  .umtable .umtot { font-weight: 700; }

  /* Email templates: click any email address -> small menu -> draft popup */
  .em-menu { position: fixed; z-index: 220; min-width: 230px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .em-menu .em-h { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); padding: 5px 9px 3px; }
  .em-menu .em-opt { padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
  .em-menu .em-opt:hover { background: var(--rowhover); }
  .em-menu .em-sep { border-top: 1px solid var(--line); margin: 4px 0; }
  .em-menu .em-opt.plain { color: var(--muted); font-size: 12.5px; }
  .em-modal { max-width: 680px; }
  .em-modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
  .em-modal input[type=text], .em-modal textarea, .em-modal select { width: 100%; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13.5px; }
  .em-modal textarea { min-height: 230px; line-height: 1.5; }
  .em-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .em-tabs a { font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
  .em-tabs a.on { background: var(--accent-soft); border-color: var(--accent); }
  .em-who { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .em-foot { display: flex; align-items: center; gap: 14px; margin-top: 14px; flex-wrap: wrap; font-size: 13px; }
  .em-foot .em-go { background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; font-weight: 650; }
  .em-foot .em-go:hover { text-decoration: none; filter: brightness(1.1); }
  .em-foot .em-msg { color: var(--muted); font-size: 12.5px; }

  /* Educational Notes cheat sheet (New Development page) */
  .dn-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .dn-modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    max-width: 820px; width: 100%; padding: 22px 26px 26px; position: relative;
  }
  .dn-modal h1 { font-size: 19px; margin: 0 0 4px; }
  .dn-modal .dn-sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; line-height: 1.5; }
  .dn-close { position: absolute; top: 14px; right: 18px; cursor: pointer; color: var(--muted); font-size: 22px; line-height: 1; }
  .dn-close:hover { color: var(--text); }
  .dn-cat { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; background: var(--panel-2); }
  .dn-cat > summary { cursor: pointer; padding: 10px 14px; font-weight: 700; font-size: 14px; color: var(--accent); list-style: none; }
  .dn-cat > summary::-webkit-details-marker { display: none; }
  .dn-cat > summary::before { content: '\25B8  '; }
  .dn-cat[open] > summary::before { content: '\25BE  '; }
  .dn-catbody { padding: 2px 14px 12px; }
  .dn-term { border-top: 1px solid var(--line); padding: 8px 0; }
  .dn-term summary { cursor: pointer; font-weight: 600; font-size: 13.5px; list-style: none; }
  .dn-term summary::-webkit-details-marker { display: none; }
  .dn-term summary::before { content: '+  '; color: var(--muted); }
  .dn-term[open] summary::before { content: '\2212  '; }
  .dn-term .dn-body { padding: 6px 2px 4px 16px; font-size: 13px; line-height: 1.6; color: var(--text); }
  .dn-term .dn-body ul { margin: 6px 0 0 18px; padding: 0; }
  .dn-term .dn-body .dn-why { color: var(--muted); margin-top: 6px; }
  .dn-term .dn-body .dn-tip { color: #9fd3a0; margin-top: 6px; font-style: italic; }
  .umop { margin-top: 5px; font-size: 12px; color: var(--muted); }
  .portchip { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--accent);
    background: rgba(74,158,255,.12); border: 1px solid rgba(74,158,255,.30); border-radius: 999px;
    padding: 1px 7px; margin-right: 4px; white-space: nowrap; }
  .tlolink { color: var(--accent); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .tlolink:hover { text-decoration: underline; }
  .inferred { color: var(--warn); font-size: 11px; border: 1px solid var(--warn);
    padding: 0 5px; border-radius: 10px; opacity: .8; }

  /* Owner / Operator summary lines in Property Details. A name with nothing after it is a
     recorded fact; anything less carries its own tag so a guess never reads as one. */
  .kv .v.party a { color: var(--text); cursor: pointer; }
  .kv .v.party a:hover { color: var(--accent); text-decoration: underline; }
  .ptag { display: inline-block; font-size: 10.5px; font-weight: 700; margin-left: 6px;
    padding: 1px 6px; border-radius: 999px; white-space: nowrap; vertical-align: 1px; }
  .ptag.assumed { color: var(--warn); border: 1px solid rgba(210,153,34,.45);
    background: rgba(210,153,34,.12); }
  .ptag.verify { color: #e0864a; border: 1px solid rgba(224,134,74,.45);
    background: rgba(224,134,74,.12); }
  .psrc { color: var(--muted); font-size: 11.5px; font-weight: 400; margin-left: 6px; }
  .kv .v.party-none a { color: var(--warn); font-weight: 500; font-style: italic; cursor: pointer; }
  .kv .v.party-none a:hover { text-decoration: underline; }
  .pneed { color: var(--warn); font-style: italic; opacity: .75; white-space: nowrap; }
  /* Double-click either line to change who it names. Same feel as the other editable rows,
     plus the entity typeahead -- picking a name already in the database keeps the property
     inside that owner's portfolio instead of forking a second record for the same company. */
  .kv .v.kv-party { cursor: text; border-radius: 4px; margin: -2px -5px; padding: 2px 5px; }
  .kv .v.kv-party:hover { background: var(--panel-2); box-shadow: inset 0 -1px 0 var(--line); }
  .party-edit { display: grid; gap: 6px; }
  .party-edit .entpick input { width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
  .party-edit .entpick input:focus { border-color: var(--accent); outline: none; }
  .party-edit .of-hint { font-size: 11px; color: var(--muted); }
  .party-edit .of-hint a { color: var(--accent); cursor: pointer; }

  /* last-contact quick-touch chip + popover */
  .touchchip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    font-weight: 600; padding: 2px 8px; border-radius: 999px; cursor: pointer;
    white-space: nowrap; border: 1px solid var(--line); color: var(--muted);
    background: var(--panel-2); }
  .touchchip:hover { border-color: var(--accent); color: var(--accent); }
  /* "spoke with them" -- same green family as the IL asset-class chip */
  .touchchip.has-date { background: #2b403a; color: #8fe0c0; border-color: rgba(143,224,192,.35); }
  /* DNC -- same pink family as the MC asset-class chip, bold + all-caps so it reads as a
     stop sign at a glance in a busy roster column */
  .touchchip.dnc { background: #402b38; color: #ffb3d1; border-color: rgba(255,179,209,.35);
    font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .touch-pop { position: fixed; z-index: 90; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.5); width: 210px; }
  .touch-pop select.tp-type { width: 100%; box-sizing: border-box; margin-bottom: 6px;
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 6px; font-size: 12.5px; font-family: inherit; }
  .touch-pop .tp-today { width: 100%; }
  .touch-pop input[type=date] { width: 100%; margin-top: 7px; box-sizing: border-box;
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 6px; font-size: 12.5px; font-family: inherit; }
  .touch-pop .tp-dnc { width: 100%; margin-top: 7px; background: rgba(255,179,209,.10);
    color: #ffb3d1; border: 1px solid rgba(255,179,209,.35); font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; }
  .touch-pop .tp-dnc:hover { background: rgba(255,179,209,.18); }
  .touch-pop .tp-clear { display: block; text-align: center; margin-top: 7px;
    font-size: 11.5px; color: var(--muted); cursor: pointer; }
  .touch-pop .tp-clear:hover { color: var(--bad); }
  /* Quick note: type what the call was, then pin it with any of the buttons below. */
  .touch-pop .tp-note { width: 100%; box-sizing: border-box; margin-bottom: 8px; resize: vertical;
    background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 6px;
    padding: 5px 6px; font-size: 12.5px; font-family: inherit; line-height: 1.4; outline: none; }
  .touch-pop .tp-note:focus { border-color: var(--accent); }
  .touch-pop .tp-save { width: 100%; margin-bottom: 8px; }
  .touch-pop .tp-or { display: block; text-align: center; margin: 0 0 8px; font-size: 10.5px;
    color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .touch-pop .tp-saved { text-align: center; padding: 14px 6px; font-size: 13px; font-weight: 700;
    color: var(--good, #7fe0b6); }
  /* "Add to Hot Prospects" inside the touch popup -- the same decision Hap is already
     making when he logs the call, so it lives in the same popup rather than a second click
     somewhere else on the page. */
  .touch-pop .tp-hotrow { margin-top: 9px; }
  .touch-pop .tp-hotlbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 4px; }
  .touch-pop .tp-hotlbl a { text-transform: none; letter-spacing: 0; cursor: pointer; }
  .touch-pop .tp-hotbtns { display: flex; gap: 4px; }
  .touch-pop .tp-hot { flex: 1; padding: 5px 2px; font-size: 11px; line-height: 1.2; font-weight: 700;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .touch-pop .tp-hot:hover { color: var(--text); border-color: var(--hs-c); }
  .touch-pop .tp-hot.on { background: var(--hs-bg); color: var(--hs-c); border-color: var(--hs-c); }
  /* One color per Hot Prospects bucket, shared by the flame, its menu, the popup buttons and
     the page's section tabs: blue = needs contact, yellow = keep in touch, orange = hot/BOV. */
  .st-dnc           { --hs-c: #ff6b6b; --hs-bg: rgba(255,107,107,.16); }
  .st-not_worth     { --hs-c: #ffb3d1; --hs-bg: rgba(255,179,209,.14); }
  .st-needs_contact { --hs-c: #7fb8ff; --hs-bg: rgba(74,158,255,.16); }
  .st-keep_in_touch { --hs-c: #f2c94c; --hs-bg: rgba(242,201,76,.15); }
  .st-hot           { --hs-c: #7ee2a0; --hs-bg: rgba(126,226,160,.11); }
  .hot-menu { position: fixed; z-index: 210; width: 262px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .hot-menu .hm-h { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); padding: 3px 7px 6px; }
  .hot-menu .hm-opt { padding: 7px 9px; border-radius: 7px; cursor: pointer; border-left: 3px solid var(--hs-c);
    margin-bottom: 3px; font-size: 13px; }
  .hot-menu .hm-opt b { color: var(--hs-c); }
  .hot-menu .hm-opt span:last-child { display: block; color: var(--muted); font-size: 11.5px; }
  .hot-menu .hm-opt:hover, .hot-menu .hm-opt.cur { background: var(--hs-bg); }
  .hot-menu .hm-cur { font-size: 11px; color: var(--muted); }
  .hot-menu .hm-rm { padding: 6px 9px; font-size: 12px; color: var(--muted); cursor: pointer; text-align: center;
    border-top: 1px solid var(--line); margin-top: 4px; }
  .hot-menu .hm-rm:hover { color: var(--bad); }

  .person-choice.flash { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
  /* ---- Hot Prospects ---- */
  /* The flame rides next to EVERY last-contact chip in the app (see touchChip), so the
     "this one is worth working" decision is always one click from where the call is
     logged, on whichever roster or profile Hap happens to be on. */
  .touchgrp { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .hotbtn { cursor: pointer; font-size: 12px; line-height: 1; padding: 3px 5px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel-2); filter: grayscale(1); opacity: .45; }
  .hotbtn:hover { filter: none; opacity: 1; border-color: #ff8a3d; }
  .hotbtn.on { filter: none; opacity: 1; border-color: var(--hs-c, rgba(255,138,61,.55)); background: var(--hs-bg, rgba(255,138,61,.15)); }
  /* Needs-contact flames stay a little muted so the hot ones read hotter at a glance. */
  .hotbtn.on.st-needs_contact { filter: saturate(.5); }
  .hotbtn.on.st-not_worth { filter: saturate(.5); }
  .hotbtn.on.st-dnc { filter: saturate(.6) hue-rotate(-30deg); }
  .navct { display: inline-block; margin-left: 4px; font-size: 10px; font-weight: 800;
    background: rgba(255,138,61,.2); color: #ffa76b; border-radius: 999px; padding: 0 5px; }
  .navct:empty { display: none; }

  .hotcard { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid #ff8a3d;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  /* The compact Hot Prospects roster (one row per owner, Owner Targets style) and the full
     card that opens under a row when it is expanded. */
  .hot-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
  .hot-tab { cursor: pointer; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); font-weight: 700; font-size: 14px; color: var(--muted);
    border-bottom: 3px solid var(--hs-c, var(--line)); }
  .hot-tab:hover { color: var(--text); }
  .hot-tab.active { background: var(--hs-bg, var(--panel-2)); color: var(--hs-c, var(--text)); }
  .hot-tab .ct { margin-left: 7px; font-size: 12px; opacity: .8; }
  table.hotrows td { vertical-align: top; }
  table.hotrows .hr-x { cursor: pointer; color: var(--muted); width: 14px; user-select: none; }
  table.hotrows .hr-x:hover { color: var(--text); }
  table.hotrows .hr-own { color: var(--muted); font-size: 12px; max-width: 260px; }
  table.hotrows .hr-sub { color: var(--muted); font-size: 12px; }
  table.hotrows td.t-notes { min-width: 240px; max-width: 420px; }
  table.hotrows tr.hot-detail > td { background: var(--bg); padding: 10px 12px 2px; }
  table.hotrows tr.hot-detail:hover > td { background: var(--bg); }
  .hs-sel { background: var(--hs-bg); color: var(--hs-c); border: 1px solid var(--hs-c); border-radius: 7px;
    font: inherit; font-size: 12px; font-weight: 700; padding: 3px 5px; cursor: pointer; }
  .hs-sel option { background: var(--panel); color: var(--text); }
  .hotcard.dnc { border-left-color: #ffb3d1; opacity: .75; }
  .hc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hc-name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hc-sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .hc-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .hc-reason { margin-top: 9px; font-size: 13px; background: var(--panel-2); border: 1px dashed var(--line);
    border-radius: 7px; padding: 6px 9px; cursor: text; color: var(--text); }
  .hc-reason.empty { color: var(--muted); font-style: italic; }
  .hc-reason:hover { border-color: var(--accent); }
  .hc-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 11px; }
  @media (max-width: 1100px) { .hc-cols { grid-template-columns: 1fr; } }
  .hc-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  .hc-box h4 { margin: 0 0 7px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; }
  .hc-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    padding: 5px 0; border-top: 1px solid var(--line); }
  .hc-row:first-of-type { border-top: none; }
  .hc-row .l { min-width: 0; }
  .hc-row .nm { font-weight: 600; font-size: 13.5px; }
  .hc-row .ex { color: var(--muted); font-size: 12px; }
  .hc-row .ph { font-size: 12.5px; margin-top: 1px; }
  .hc-more { color: var(--muted); font-size: 12px; padding-top: 6px; }
  .hc-log { margin-top: 11px; }
  .hc-log .le { padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .hc-log .le:first-of-type { border-top: none; }
  .hc-log .ld { color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .02em; }
  .hc-log .lt { color: var(--accent); font-size: 11.5px; }
  .hc-star { color: #ff8a3d; font-size: 11px; font-weight: 800; }
  .hot-toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 200;
    background: var(--panel); border: 1px solid rgba(255,138,61,.5); color: #ffc59a;
    border-radius: 999px; padding: 8px 18px; font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 26px rgba(0,0,0,.5); }

  /* stars */
  .stars { display: inline-flex; gap: 2px; vertical-align: middle; }
  .star { color: #4a5663; font-size: 15px; }
  .star.on { color: var(--warn); }

  table.tx { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.tx th, table.tx td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  table.tx th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  /* Click-to-sort lists (see the sorter near the end of the script). Dates never wrap. */
  table.tx thead th, table.hist thead th { cursor: pointer; user-select: none; white-space: nowrap; }
  table.tx thead th:hover, table.hist thead th:hover, table.tx thead th.sorted, table.hist thead th.sorted { color: #cfe5ff; }
  td.dt, .dt { white-space: nowrap; }

  .contact { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .contact:last-child { border-bottom: none; }
  .contact .cn { font-weight: 600; }
  .contact .cr { color: var(--muted); font-size: 12.5px; }
  .contact .cc { margin-top: 3px; font-size: 13px; }

  .empty-msg { color: var(--muted); font-size: 13.5px; font-style: italic; }

  /* landing */
  .landing { text-align: center; padding: 40px 0 20px; }
  .landing h1 { font-size: 24px; margin: 0 0 6px; }
  .landing p { color: var(--muted); margin: 0 0 26px; }
  .statgrid { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 22px; min-width: 120px; }
  .stat .num { font-size: 26px; font-weight: 700; }
  .stat .lbl { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .spinner { color: var(--muted); padding: 30px; text-align: center; }

  /* home-screen widgets row (headlines + weather) -- centered under the (also centered)
     stat grid; Hap tried flush-left first and asked to go back to centered. */
  .home-widgets { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap;
    max-width: 900px; margin: 30px auto 0; text-align: left; justify-content: center; }
  .headlines-panel { flex: 1 1 480px; max-width: 600px; margin: 0; }
  .headlines-list { display: flex; flex-direction: column; }
  .headline-row {
    display: block; padding: 10px 4px; border-bottom: 1px solid var(--line);
    color: var(--text); text-decoration: none;
  }
  .headline-row:last-child { border-bottom: none; }
  .headline-row:hover .headline-title { color: var(--accent); }
  .headline-title { font-weight: 600; font-size: 14.5px; line-height: 1.4; }
  .headline-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }

  /* "Today" morning brief: what to work on, from Beta Station's own data */
  .brief-panel { max-width: 1200px; margin: 30px auto 0; text-align: left; padding: 18px 24px 20px; }
  .brief-panel h2 .brief-date { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; }
  .brief-sec { margin-top: 18px; }
  .brief-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  .brief-head h3 { margin: 0; font-size: 14.5px; }
  .brief-head .bh-why { color: var(--muted); font-size: 12px; flex: 1; }
  .brief-head .bh-all { font-size: 12.5px; white-space: nowrap; }
  table.brief { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.brief td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  table.brief td.b-name { width: 26%; }
  table.brief td.b-who { width: 22%; }
  table.brief td.b-when { white-space: nowrap; width: 1%; color: var(--muted); text-align: right; }
  table.brief td.b-when .b-sub { margin-top: 3px; }
  table.brief .b-sub { color: var(--muted); font-size: 12px; }
  table.brief .b-note { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; }
  table.brief .b-ph { white-space: nowrap; }
  .brief-empty { color: var(--muted); font-size: 13px; padding: 4px 0 2px; }
  .brief-tag { display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 6px;
    border-radius: 6px; background: var(--chip); margin-left: 4px; }
  .brief-tag.bad { background: #4a1f22; color: #ffb3ae; }
  .brief-tag.warn { background: #43361a; color: #f2cc72; }
  .brief-tag.good { background: #1b3b24; color: #8fe0a0; }
  /* Copilot name matcher: a quiet link at the foot of Today, opens in place */
  .bm-toggle { display: inline-block; margin-top: 16px; font-size: 12.5px; color: var(--muted); }
  .bm-toggle:hover { color: var(--accent); }
  .bm-box { margin-top: 8px; }
  .bm-box textarea { width: 100%; min-height: 90px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; font-size: 13px; }
  .bm-actions { display: flex; gap: 10px; align-items: center; margin: 6px 0 4px; font-size: 12.5px; }
  .bm-actions .bm-hint { color: var(--muted); flex: 1; }

  /* small phone-widget-style 7-day forecast */
  .weather-widget { flex: 0 0 190px; width: 190px; margin: 0; }
  .weather-days { display: flex; flex-direction: column; gap: 2px; }
  .weather-day { display: grid; grid-template-columns: 38px 22px 1fr; align-items: center;
    gap: 8px; padding: 4px 2px; font-size: 13px; }
  .wd-label { color: var(--muted); font-weight: 600; }
  .wd-icon { font-size: 15px; text-align: center; }
  .wd-temp { text-align: right; }
  .wd-temp b { font-weight: 650; }
  .wd-lo { color: var(--muted); }

  /* nav link in header */
  .navlink {
    white-space: nowrap; font-weight: 650; font-size: 13px;
    padding: 7px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--text);
  }
  /* Header tabs only -- the in-page ones (Prev / Next, Download CSV) set their own size. */
  header .navlink { font-size: var(--navfs, 13px); padding: 6px var(--navpx, 10px); border-radius: 6px; }
  /* Any width the search box doesn't take sits here, so the tabs stay flush right. */
  #nav-hot { margin-left: auto; }
  .navlink:hover { border-color: var(--accent); text-decoration: none; color: #cfe5ff; }
  .navlink.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe5ff; }

  /* recently viewed -- persistent left sidebar, not a dropdown, so it's always in view
     while ripping through several records in a row. */
  .shell { display: flex; align-items: flex-start; }
  /* The base `main` rule above caps width at 1180px and centers it with `margin:0 auto` for
     the old single-column layout. Inside the sidebar shell that leaves main auto-centered in
     whatever space the sidebar doesn't take -- a gap next to the sidebar AND wasted space on
     the right edge, worst on wide screens with table-heavy views. Reset both so main fills
     the full remaining flex width right up against the sidebar. */
  main { flex: 1; min-width: 0; max-width: none; margin: 0; }
  .recent-sidebar {
    width: 290px; flex-shrink: 0; position: sticky; top: var(--hdr);
    max-height: calc(100vh - var(--hdr) - 20px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; margin: 22px 0 22px 24px;
  }
  .recent-sidebar h2 {
    margin: 0 0 8px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700;
  }
  .recent-row {
    display: flex; align-items: baseline; gap: 6px; padding: 5px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12px; line-height: 1.4; white-space: nowrap; overflow: hidden;
  }
  .recent-row:hover { background: var(--panel-2); }
  .recent-row .ri { font-size: 10.5px; flex-shrink: 0; }
  .recent-row .rn { font-weight: 650; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .recent-row .rs { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex-shrink: 2; }
  .recent-empty { padding: 12px 8px; color: var(--muted); font-size: 12px; text-align: center; }
  .recent-clear { padding: 6px; text-align: center; color: var(--muted); font-size: 11px;
                  cursor: pointer; border-top: 1px solid var(--line); margin-top: 2px; }
  .recent-clear:hover { color: var(--text); }

  /* call list */
  .cl-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .cl-head h1 { font-size: 22px; margin: 0; }
  .cl-sub { color: var(--muted); font-size: 13px; margin: 2px 2px 16px; }
  .cl-fac {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .cl-fac .fhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .cl-fac .fname { font-weight: 650; font-size: 16px; cursor: pointer; }
  .cl-fac .fname:hover { color: var(--accent); }
  .cl-fac .fowner { color: var(--muted); font-size: 13.5px; margin-bottom: 10px; }
  .cl-fac .fowner b { color: var(--text); font-weight: 600; }
  .cl-prov { color: #5b6975; font-size: 11.5px; font-style: italic; }
  table.cl { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.cl th, table.cl td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  table.cl th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  table.cl th.sortable { cursor: pointer; user-select: none; }
  table.cl th.sortable:hover { color: #cfe5ff; }
  table.cl th.sorted { color: #cfe5ff; }
  table.cl tr:last-child td { border-bottom: none; }
  table.cl tr.principal td { background: rgba(74,158,255,.06); }
  table.cl .cname { font-weight: 600; }
  /* Owner Targets: wider Property/Owner columns so names wrap to two lines, not four,
     and a touch less row padding so more rows fit per page */
  table.cl.targets th, table.cl.targets td { padding: 6px 6px; line-height: 1.35; }
  table.cl.targets th:first-child, table.cl.targets td:first-child { padding-left: 14px; }
  table.cl.targets th:last-child, table.cl.targets td:last-child { padding-right: 14px; }
  table.cl.targets .t-prop { min-width: 180px; }
  table.cl.targets .t-owner { min-width: 225px; }
  table.cl.targets .t-owner .chip { padding: 1px 7px; }
  table.cl.targets .t-nic { min-width: 125px; }
  table.cl.targets .t-notes { min-width: 205px; max-width: 380px; }
  /* The panel hugs the table edge to edge (no inner padding) and scrolls sideways itself
     on a narrow window, so the grey background always wraps every column, Notes included,
     and the sticky header never gets dragged off screen by a page-wide scroll. */
  .panel.targets-panel { padding: 0; overflow-x: auto; }
  main:has(.targets-panel) { padding-left: 16px; padding-right: 16px; }
  table.cl .ph a, table.cl .ph { white-space: nowrap; }
  /* Free-text note cells: a note can run to a paragraph, which used to blow up every row's
     height. Clamp to 2 lines by default; click to expand just that row. */
  .notes-clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; cursor: pointer; line-height: 1.4; }
  .notes-clamp.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
  .notes-clamp:hover { color: var(--text); }
  /* "Notes" on every call list: the last thing that was actually SAID, sitting next to the
     last-contact chip -- date/type tag, then two lines of the note body. Ownership/LLC
     intel is one click away on the record itself, so it no longer takes this space. */
  .notecell { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; cursor: pointer; line-height: 1.4; font-size: 12.5px; color: var(--text); }
  .notecell.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; white-space: pre-wrap; }
  .notecell .nd { color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase;
    letter-spacing: .03em; margin-right: 6px; white-space: nowrap; }
  table.cl .cname .notecell { font-weight: 400; margin-top: 3px; }
  .cl-fac .fnote { margin: 4px 0 2px; max-width: 760px; }
  /* Editable note cell: read it with a click (expands past the clamp), rewrite it with a
     double-click. The pencil is the discoverable version of that same double-click. */
  .notecell-wrap { position: relative; }
  .notecell-wrap .np-edit {
    position: absolute; top: -2px; right: -2px; opacity: 0; transition: opacity .12s;
    font-size: 12px; line-height: 1; padding: 3px 5px; border-radius: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .notecell-wrap:hover .np-edit { opacity: 1; }
  .notecell-wrap .np-edit:hover { color: #cfe5ff; border-color: var(--accent); }
  .note-add { color: var(--muted); font-size: 12.5px; cursor: pointer; opacity: .5; }
  .notecell-wrap:hover .note-add { opacity: 1; color: var(--accent); }
  .note-edit { display: grid; gap: 6px; min-width: 250px; }
  .note-edit .row { display: flex; gap: 6px; align-items: center; }
  .note-edit select, .note-edit input[type=date], .note-edit textarea {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 7px; font-size: 12.5px; outline: none; font-family: inherit;
  }
  .note-edit textarea { width: 100%; resize: vertical; line-height: 1.45; }
  .note-edit select:focus, .note-edit input:focus, .note-edit textarea:focus { border-color: var(--accent); }
  .note-edit .btn { padding: 4px 12px; font-size: 12.5px; }
  .note-edit a { color: var(--muted); font-size: 12px; cursor: pointer; align-self: center; }
  .note-edit a:hover { color: var(--accent); }
  .note-edit a.np-del { margin-left: auto; }
  .note-edit a.np-del:hover { color: var(--bad); }
  .note-ro { color: var(--muted); font-size: 11px; font-style: italic; }
  .nvia { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-style: italic; }
  .badge-prin {
    display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
    padding: 1px 7px; border-radius: 10px; background: var(--accent-soft);

<script>
const app = document.getElementById('app');
const search = document.getElementById('search');
let debounce = null;

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
// A facility's front-desk number is tagged wherever it shows (Hap, 2026-09-30): it may only
// sit on a person when the owner runs the building or TLO shows it is their own line.
let FACPH = {};
function facTag(v){
  const d = String(v||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,'');
  const f = FACPH[d];
  return f ? ' <span class="ph-fac" title="Front desk of '+esc(f)+'">(facility: '+esc(f)+')</span>' : '';
}
function loadFacPhones(){
  return fetch('/api/facility-phones').then(r => r.json()).then(j => {
    FACPH = (j && j.phones) || {};
    const shown = [...document.querySelectorAll('a[href^="tel:"]')].some(a => facTag(a.getAttribute('href').slice(4)));
    if(shown) route();
  }).catch(() => {});
}
function num(n){ return n==null?null:Number(n).toLocaleString(); }
function money(n){ return n==null?null:'$'+Number(n).toLocaleString(); }
// Short acuity codes for compact chips (AL/SNF/IL/MC/CCRC read fine as-is; only these need shortening)
const ASSET_SHORT = {SENIOR_APT:'Sr Apt', AFFORDABLE_SENIOR:'Affordable', BCH:'BCH', MIXED:'Mixed', OTHER:'Other'};

// Shared "Showing X-Y of N" + Prev/Next pager, used by Call List and Owner Targets
// (Recently Databased has its own copy, wired up before this helper existed).
// gotoFn is the name of a function taking one arg (the new offset).
function pagerHTML(curOffset, pageLen, filTotal, limit, gotoFn){
  const hasPrev = curOffset > 0;
  const hasNext = curOffset + pageLen < filTotal;
  return `<div style="display:flex;align-items:center;gap:10px;margin:10px 2px">
    <span class="muted" style="font-size:13px">Showing ${filTotal?curOffset+1:0}&ndash;${curOffset+pageLen} of ${filTotal}</span>
    <span class="navlink" style="padding:5px 11px;font-size:13px;${hasPrev?'cursor:pointer':'opacity:.35;pointer-events:none'}" onclick="${gotoFn}(${Math.max(0,curOffset-limit)})">&larr; Prev</span>
    <span class="navlink" style="padding:5px 11px;font-size:13px;${hasNext?'cursor:pointer':'opacity:.35;pointer-events:none'}" onclick="${gotoFn}(${curOffset+limit})">Next &rarr;</span>
  </div>`;
}

async function getJSON(url){ const r = await fetch(url); return r.json(); }

// Every endpoint this app owns answers JSON. An HTML body back means the request fell
// through to the server's own 404 page, and in practice that means one thing: the running
// Python is OLDER than the page it just served. index.html is re-read from disk on every
// request, app.py only at startup, so editing the code and not restarting leaves a new page
// talking to a server that has never heard of the route it is calling. That mismatch used to
// surface as a raw "Unexpected token '<'" JSON parse error, which says nothing about the
// actual problem; say the actual problem instead.
const STALE_SERVER_MSG = 'This page is newer than the server that is running, so that feature '
  + 'does not exist yet on the server side. Restart it: double-click "Restart Apps.bat" in the '
  + 'Agentic folder (or run  python restart_apps.py ui).';
async function apiJSON(url, opts){
  let r;
  try { r = await fetch(url, opts); }
  catch(e){ return {error: 'Could not reach the server. Is it still running?'}; }
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e){
    return {error: r.status === 404 ? STALE_SERVER_MSG
      : ('Unexpected response from the server (HTTP ' + r.status + ').'), stale: r.status === 404};
  }
}

// Sortable <th> shared by Owner Targets, All Properties and Recently Databased. gotoFn is the name of a function taking
// (col, defaultDirection) that toggles/sets the sort and navigates -- same convention as
// Sales Comp Report's scTh/scSort, just generalized across views with different state.
function rosterTh(sort, dir, col, label, gotoFn, defDir){
  const active = sort === col;
  const arrow = active ? (dir==='desc'?' &#9660;':' &#9650;') : '';
  return `<th class="sortable ${active?'sorted':''}" onclick="${gotoFn}('${col}','${defDir||'asc'}')">${label}${arrow}</th>`;
}

// ---------- filter controls ----------
const fState = document.getElementById('f-state');
const fUmin = document.getElementById('f-umin');
const fUmax = document.getElementById('f-umax');

function activeClasses(){
  return [...document.querySelectorAll('.togglechip.active')].map(c=>c.dataset.class);
}
function currentParams(){
  const p = new URLSearchParams();
  const q = search.value.trim();
  if(q) p.set('q', q);
  if(fState.value) p.set('state', fState.value);
  const cl = activeClasses();
  if(cl.length) p.set('classes', cl.join(','));
  if(fUmin.value) p.set('units_min', fUmin.value);

// back in view -- no server round trip, no shared state to worry about.
const RECENT_KEY = 'recentlyViewed';
const RECENT_CAP = 15;
const RECENT_ICON = {property: '&#127968;', entity: '&#127970;', contact: '&#128100;', comp: '&#128200;', development: '&#127959;'};
function getRecentlyViewed(){

function trackRecentlyViewed(type, id, label, sublabel){
  if(!id || !label) return;
  let list = getRecentlyViewed().filter(r => !(r.type===type && r.id===id));
  list.unshift({type, id, label, sublabel: sublabel||'', ts: Date.now()});
  if(list.length > RECENT_CAP) list = list.slice(0, RECENT_CAP);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch(e){ /* storage disabled/full */ }

function tloPropertyUrl(addr, zip, city, state){

  return 'https://tloxp.tlo.com/search.php?type=PropertySearch&action=search&Address='

// TLO Businesses lookup makes sense. Hap: the CoStar recorded owner "should be an LLC or LP".
function isEntityName(s){
  return /\b(L\.?L\.?C|L\.?P|LLLP|LLP|INC|INCORPORATED|CORP|CORPORATION|CO|COMPANY|LTD|LIMITED|TRUST|PARTNERS|PARTNERSHIP|HOLDINGS|PROPERTIES|PROPCO|REIT|ASSOCIATES|VENTURES|GROUP|FUND|CAPITAL|ENTERPRISES|INVESTMENTS)\b\.?/i.test(s||'');
}
const MONTH_NAMES=['','January','February','March','April','May','June','July','August','September','October','November','December'];
// NIC "Month Opened" comes as "M/YYYY" (e.g. "4/2017"); show it as "April 2017".
function fmtOpened(nm){
  const mo=nm.month_opened, yr=nm.year_opened;
  if(mo){
    const m=String(mo).match(/^(\d{1,2})[\/\-](\d{4})$/);
    if(m && MONTH_NAMES[+m[1]]) return MONTH_NAMES[+m[1]]+' '+m[2];
    return String(mo);
  }
  return yr ? String(yr) : '';
}
// NIC MAP unit mix: a summary line (IL/AL/MC totals + opened) on the property page, plus a
// collapsible detailed breakdown (studio/1BR/2BR/3+/not-reported per segment).
function unitMixBlock(nm){
  if(!nm) return '';

  return `<div class="unitmix">
    <span class="umsum">Unit mix &mdash; <b>IL ${il}</b> &middot; <b>AL ${al}</b> &middot; <b>MC ${mc}</b></span> ${opened}
